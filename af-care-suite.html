  let al='';
  if(s.urg==='emerg') al+=`<div class="alert w"><b class="h">EMERGENCY SURGERY</b>Proceed without cardiac testing. Arterial line for high-risk patients, MAP ≥60–65, continue β-blocker/statin, plan post-op troponin and ECG.</div>`;
  if(s.active&&s.urg!=='emerg') al+=`<div class="alert"><b class="h">ACTIVE CARDIAC CONDITION</b>${[s.actACS&&'ACS: revascularise as appropriate and defer elective surgery (1 C-LD).',s.actHF&&'Decompensated HF: treat to compensation first.',s.actArr&&'Uncontrolled arrhythmia / high-grade block: rate/rhythm control or pacing first.',s.actValve&&'Symptomatic severe valve disease: evaluate for valve intervention before elective surgery (1).'].filter(Boolean).join(' ')}</div>`;
  if(T.defer&&s.urg==='elective') al+=`<div class="alert"><b class="h">TIMING — DEFER ELECTIVE SURGERY</b>${T.items.filter(x=>x.sev==='bad').map(x=>x.h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()).join(' · ')}</div>`;
  if(s.pdep&&s.above&&s.cied) al+=`<div class="alert w"><b class="h">PACEMAKER-DEPENDENT · EMI ABOVE UMBILICUS</b>Arrange device reprogramming (asynchronous${s.icd?' + tachytherapies off':''}) before surgery and restoration before discharge.</div>`;
  if(((s.sbp!=null&&s.sbp>=180)||(s.dbp!=null&&s.dbp>=110))&&s.urg==='elective') al+=`<div class="alert w"><b class="h">BP ≥180/110 mmHg</b>If this reflects recent poorly controlled hypertension, deferring elective surgery may be considered (2b C-LD).</div>`;
  SUM=surgeonSummary(s,c,S,T,AT);
  $('plan').innerHTML=al+sumHTML(SUM)+secPath(s,c,S)+secTesting(s,c)+secTiming(s,T)+meds+secAT(s,c,AT,TR)+cond+post;
}

/* ---------- note parser ---------- */
const NEG=/\b(no|denies|denied|without|not|negative for|absence of|nil|free of|ruled out|r\/o)\b/i;
function hit(text,re){
  const g=new RegExp(re.source,'gi');let m;

function monthsIn(str){

  if(m){const y=+m[1];if(y<=NOW.getFullYear())return Math.max(0,(NOW.getFullYear()-y)*12);}
  if(/\blast (week)\b/i.test(str))return 0.25; if(/\blast month\b/i.test(str))return 1;
  return null;
}
function parseHx(){

  if($('lpm').checked&&!/\btransvenous\b/i.test(tx)) $('ppm').checked=false;
  if($('sevAS').checked&&/\b(symptomatic severe|exertional syncope|syncope|angina)\b/i.test(tx)&&!/\basymptomatic\b/i.test(tx)){$('actValve').checked=true;found.push('Symptomatic AS');}

  if(/\b(female|woman|lady)\b/i.test(tx))setRad('sex','F');else if(/\b(male|man|gentleman)\b/i.test(tx))setRad('sex','M');
  if((m=tx.match(/(\d{2,3}(?:\.\d+)?)\s*kg\b/i))){$('wt').value=m[1];found.push(m[1]+' kg');}

<script id="zcol">
/* ---------- colour-coded blocks: cards by topic, plan sections by their letter colour ---------- */
(function(){
  var KW=[[/bleed|contraind|red flag|danger|active cardiac|safety|storm|side.effect|alarm/i,'red'],
          [/medic|drug|treatment|antihypertens|interact|tablet|override|dosing/i,'amber'],
          [/history|note|picbox|report|case text/i,'teal'],
          [/patient|labs?\b|vital|blood pressure|setting/i,'green'],];
  var CYC=['violet','blue','teal','green'],prev=null;
  function paintCards(){
    var i=0;
    document.querySelectorAll('.card').forEach(function(c){
      var h=c.querySelector(':scope>h2');if(!h||c.dataset.zk)return;
      var tx=h.textContent,k=null;
      for(var j=0;j<KW.length;j++)if(KW[j][0].test(tx)){k=KW[j][1];break;}
      if(!k||(k===prev&&k!=='red'&&k!=='amber')){k=CYC[i++%CYC.length];if(k===prev)k=CYC[i++%CYC.length];}
      prev=k;
      c.style.setProperty('--zk','var(--zc-'+k+')');c.dataset.zk=k;
    });
  }
  function paintSecs(force){
    document.querySelectorAll('.sec').forEach(function(s){
      if(s.dataset.zk&&!force)return;
      var L=s.querySelector(':scope>header .L');if(!L)return;
      var c=getComputedStyle(L).backgroundColor;
      if(!c||c==='transparent'||/rgba\(0, 0, 0, 0\)/.test(c))return;
      s.style.setProperty('--zk',c);s.dataset.zk='1';
    });
  }
  var q=0;function later(f){if(q)return;q=1;requestAnimationFrame(function(){q=0;paintCards();paintSecs(f);});}
  paintCards();paintSecs(false);
  new MutationObserver(function(){later(false);}).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(function(){requestAnimationFrame(function(){paintSecs(true);});}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(){requestAnimationFrame(function(){paintSecs(true);});});
})();

<script id="zfold">
/* ---------- collapsible blocks ---------- */
(function(){
  var SEL='.card,.sec,.simple>div.sm-card,section.panel,div.panel,section.section';
  var KEY='zfold2:'+(document.title||'app'),st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function headOf(b){
    var h=b.querySelector(':scope>h2,:scope>header,:scope>.sm-h,:scope>.panel-head,:scope>.section-head,:scope>h3');
    if(h)return h;
    var x=b.querySelector('h2,h3');if(!x)return null;
    var k=x;while(k.parentElement&&k.parentElement!==b)k=k.parentElement;
    if(k.parentElement!==b)return null;
    return (k===x||k.children.length<=2)?k:null;   /* heading buried in a content wrapper: leave the block alone */
  }
  function name(b,h){var t=h.querySelector('h1,h2,h3,h4')||h;return (t.textContent||'').replace(/\s+/g,' ').trim().replace(/^[0-9]+[a-z]?\s+/i,'').slice(0,48);}
  function setState(b,closed){
    if(closed)b.setAttribute('data-zf','closed');else b.removeAttribute('data-zf');
    var h=b.querySelector('.zf-head');if(h)h.setAttribute('aria-expanded',String(!closed));
  }
  /* everything starts folded except the main block(s) */
  function defOpen(b){
    if(/^(history|consult note|current meds|setting & situation|picbox|dose calculator|new weekly schedule)/i.test(b.dataset.zfn))return true;
    return document.querySelector('[data-zfn]')===b;
  }
  function prep(){
    document.querySelectorAll(SEL).forEach(function(b){
      if(b.tagName==='DETAILS'||b.closest('[role=dialog],dialog,.modal,.zcl-back,.zcl-modal,.sheet,.sheet-doc'))return;
      var h=headOf(b);if(!h)return;
      if(!h.classList.contains('zf-head')){
        h.classList.add('zf-head','zf-keep');h.setAttribute('role','button');h.setAttribute('tabindex','0');
        var p=h.previousElementSibling;while(p){p.classList.add('zf-keep');p=p.previousElementSibling;}
        b.dataset.zfn=name(b,h);
        var s0=st[b.dataset.zfn];setState(b,s0?s0==='c':!defOpen(b));
      }
    });
    paintAll();
  }
  function toggle(b,force){
    var closed=force!=null?force:b.getAttribute('data-zf')!=='closed';
    setState(b,closed);
    st[b.dataset.zfn]=closed?'c':'o';
    save();paintAll();
    if(!closed)setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},30);
  }
  function blocks(){return [].filter.call(document.querySelectorAll(SEL),function(b){return b.dataset.zfn!=null&&b.offsetParent!==null;});}
  var allBtn=null;
  function anyOpen(){return blocks().some(function(b){return b.getAttribute('data-zf')!=='closed';});}
  function paintAll(){if(allBtn)allBtn.textContent=anyOpen()?'Collapse all':'Expand all';}
  function addAll(){
    var host=document.querySelector('.top,header.mast,header.masthead,.masthead');if(!host||allBtn)return;
    allBtn=document.createElement('button');allBtn.type='button';allBtn.className='zf-all btn';
    allBtn.addEventListener('click',function(){var c=anyOpen();blocks().forEach(function(b){toggle(b,c);});});
    var anchor=host.querySelector('.zth,[data-new]');
    if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(allBtn,anchor);else host.appendChild(allBtn);
    paintAll();
  }
  function act(e){
    var h=e.target.closest&&e.target.closest('.zf-head');if(!h)return;
    if(e.target.closest('button,a,input,select,textarea,label,summary')&&e.target.closest('button,a,input,select,textarea,label,summary')!==h)return;
    var b=h.closest('[data-zfn]');if(!b)return;
    if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;if(e.target!==h)return;e.preventDefault();}
    toggle(b);
  }
  document.addEventListener('click',act);document.addEventListener('keydown',act);
  /* Copy / Print read the page text, so unfold everything for a moment */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.classList.contains('zf-all'))return;
    if(!/copy|print|คัดลอก|พิมพ์/i.test((b.textContent||'')+' '+(b.id||'')))return;
    var c=[].slice.call(document.querySelectorAll('[data-zf="closed"]'));if(!c.length)return;
    c.forEach(function(x){x.removeAttribute('data-zf');});
    setTimeout(function(){c.forEach(function(x){if(x.isConnected)x.setAttribute('data-zf','closed');});},1200);
  },true);
  window.addEventListener('beforeprint',function(){});
  var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;prep();},0);}
  function start(){prep();addAll();new MutationObserver(later).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>

*{box-sizing:border-box}

/* reference panels */
details.ref{--k:var(--acc);border-left:4px solid var(--k);overflow:hidden}
details.ref>summary{background:color-mix(in srgb,var(--k) 10%,var(--surface))}
details.ref[open]>summary{border-bottom:1px solid color-mix(in srgb,var(--k) 25%,var(--rule));margin-bottom:10px}
details.ref>summary::before{color:var(--k)}
details.ref table.ref th{background:color-mix(in srgb,var(--k) 10%,var(--surface));color:var(--ink-2)}
@media print{.card>h2,.sec>header,.tile,.ag,.dsc h4,details.ref>summary{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<style id="zth-style">
.zth{width:32px;height:32px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:999px;border:1px solid var(--rule-2,#c9ced8);background:var(--surface,#fff);color:var(--ink-2,#4b5164);box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer;vertical-align:middle;transition:background .15s,color .15s}
.zth:hover{background:var(--surface-2,#eef1f6);color:var(--ink,#141722)}
.zth:focus-visible{outline:2px solid var(--acc,#33478c);outline-offset:2px}
.zth svg{width:16px;height:16px;display:block}
.zth-hidden{display:none!important}
@media print{.zth{display:none!important}}
</style>
<style id="zfold-style">
.zf-head{cursor:pointer;position:relative;padding-right:38px!important;-webkit-tap-highlight-color:transparent;user-select:none}
.zf-head::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;margin-top:-7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;opacity:.55;transform:rotate(45deg);transition:transform .15s}
[data-zf="closed"]>.zf-head::after,[data-zf="closed"]>.zf-keep .zf-head::after,[data-zf="closed"]>.zf-keep.zf-head::after{transform:rotate(-45deg);margin-top:-5px}
.zf-head:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
.zf-head:hover::after{opacity:1}
@media screen{
  [data-zf="closed"]>*:not(.zf-keep){display:none!important}
  [data-zf="closed"]>.zf-keep{border-bottom-color:transparent!important;margin-bottom:0!important}
  [data-zf="closed"]{align-self:start!important;height:auto!important;min-height:0!important}
}
.zf-all{border:1px solid currentColor;background:transparent;color:inherit;opacity:.75;border-radius:999px;padding:5px 11px;font:500 12px/1.2 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.zf-all:hover{opacity:1}
@media print{.zf-all{display:none!important}.zf-head::after{display:none}}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>DOAC Planner<button type="button" class="ver" id="verBtn" title="What's new"></button></h1>
    <div class="sub">Apixaban · rivaroxaban · edoxaban · dabigatran — dose for this patient, reduction criteria, contraindications, side effects, interactions, peri-procedural hold</div>
  </div>
  <div class="sp"></div>
  <button type="button" class="btn pri" data-ds>Dose summary</button>
  <button type="button" class="btn new" data-new>+ New case</button>
  <div class="seg-theme" role="group" aria-label="Theme">
    <button data-theme-set="light">Light</button><button data-theme-set="auto" class="on">Auto</button><button data-theme-set="dark">Dark</button>
  </div>
</div>

<div class="wrap">
<form class="inputs" id="f" autocomplete="off" onsubmit="return false">

  <section class="card k-ind">
    <h2><span class="n">01</span> Indication <button type="button" class="btn sm new" data-new>Clear · new case</button></h2>
    <div class="bd">
      <label class="fld"><span>What is the DOAC for?</span>
        <select id="ind">
          <option value="af">Atrial fibrillation — stroke prevention</option>
          <option value="vte">VTE treatment — DVT / PE (first 3–6 months)</option>
          <option value="ext">VTE — extended secondary prevention (after ≥6 months)</option>
          <option value="tka">VTE prophylaxis — total knee replacement</option>
          <option value="tha">VTE prophylaxis — total hip replacement</option>
          <option value="cad">CAD / PAD — vascular protection (with aspirin)</option>
        </select>
      </label>
      <div class="row" style="margin-top:10px">
        <span class="muted" style="font-size:12px">Examples:</span>
        <button type="button" class="btn sm" data-ex="0">AF, 82F 55 kg</button>
        <button type="button" class="btn sm" data-ex="1">PE, CKD 3b</button>
        <button type="button" class="btn sm" data-ex="2">AF + dronedarone</button>
        <button type="button" class="btn sm" data-ex="3">VTE, obese, GI cancer</button>
      </div>
    </div>
  </section>

  <section class="card k-pt">
    <h2><span class="n">02</span> Patient</h2>
    <div class="bd">
      <div class="grid">
        <label class="fld"><span>Age (y)</span><input id="age" type="number" min="18" max="110" inputmode="numeric"></label>
        <div class="fld"><span>Sex</span>
          <div class="seg"><label><input type="radio" name="sex" value="M" checked><span>M</span></label><label><input type="radio" name="sex" value="F"><span>F</span></label></div>
        </div>
        <label class="fld"><span>Weight (kg)</span><input id="wt" type="number" min="25" max="300" step="0.1" inputmode="decimal"></label>
        <label class="fld"><span>Height (cm)</span><input id="ht" type="number" min="100" max="230" inputmode="numeric"></label>
        <div class="fld"><span>Creatinine</span>
          <div class="dual"><input id="cr" type="number" min="0.1" step="0.01" inputmode="decimal"><select id="crUnit"><option value="mg">mg/dL</option><option value="umol">µmol/L</option></select></div>
        </div>
        <label class="fld"><span>Platelets (×10⁹/L)</span><input id="plt" type="number" min="1" max="1500" inputmode="numeric"></label>
      </div>
      <div class="lbl">Liver function</div>
      <div class="seg"><label><input type="radio" name="cp" value="0" checked><span>Normal</span></label><label><input type="radio" name="cp" value="A"><span>Child-Pugh A</span></label><label><input type="radio" name="cp" value="B"><span>B</span></label><label><input type="radio" name="cp" value="C"><span>C</span></label></div>
      <div class="cks" style="margin-top:10px">
        <label class="ck"><input type="checkbox" id="dialysis"><span>On dialysis</span></label>
      </div>
    </div>
  </section>

  <section class="card k-ci">
    <h2><span class="n">03</span> Contraindications &amp; bleeding</h2>
    <div class="bd">
      <div class="cks">
        <label class="ck danger"><input type="checkbox" id="activeBleed"><span>Active bleeding</span></label>
        <label class="ck"><input type="checkbox" id="bleed"><span>Prior major / GI bleed</span></label>
        <label class="ck"><input type="checkbox" id="gi"><span>Gastritis / GERD / peptic ulcer</span></label>
        <label class="ck danger"><input type="checkbox" id="mech"><span>Mechanical heart valve</span></label>
        <label class="ck danger"><input type="checkbox" id="ms"><span>Moderate–severe mitral stenosis</span></label>
        <label class="ck danger"><input type="checkbox" id="aps"><span>Antiphospholipid syndrome (triple +)</span></label>
        <label class="ck danger"><input type="checkbox" id="preg"><span>Pregnant</span></label>
        <label class="ck"><input type="checkbox" id="bf"><span>Breastfeeding</span></label>
        <label class="ck"><input type="checkbox" id="cancer"><span>Active cancer</span></label>
        <label class="ck"><input type="checkbox" id="giCancer"><span>Luminal GI / GU cancer</span></label>
        <label class="ck"><input type="checkbox" id="bariatric"><span>Bariatric surgery</span></label>
        <label class="ck"><input type="checkbox" id="ng"><span>Can't swallow / NG tube</span></label>
      </div>
    </div>
  </section>

  <section class="card k-ix">
    <h2><span class="n">04</span> Interacting medicines</h2>
    <div class="bd">
      <div class="cks">
        <label class="ck"><input type="checkbox" id="vera"><span>Verapamil</span></label>
        <label class="ck"><input type="checkbox" id="amio"><span>Amiodarone / quinidine</span></label>
        <label class="ck"><input type="checkbox" id="drone"><span>Dronedarone</span></label>
        <label class="ck"><input type="checkbox" id="cyclo"><span>Ciclosporin / tacrolimus</span></label>
        <label class="ck"><input type="checkbox" id="macro"><span>Erythromycin / clarithromycin</span></label>
        <label class="ck"><input type="checkbox" id="azole"><span>Keto- / itra- / vori- / posaconazole</span></label>
        <label class="ck"><input type="checkbox" id="hiv"><span>HIV protease inhibitor / cobicistat</span></label>
        <label class="ck"><input type="checkbox" id="inducer"><span>Rifampicin / carbamazepine / phenytoin / phenobarbital / St John's wort</span></label>
        <label class="ck"><input type="checkbox" id="apt"><span>Antiplatelet / NSAID</span></label>
        <label class="ck"><input type="checkbox" id="ssri"><span>SSRI / SNRI</span></label>
      </div>
    </div>
  </section>

  <section class="card k-pr">
    <h2><span class="n">05</span> Practicalities</h2>
    <div class="bd">
      <div class="grid" style="grid-template-columns:1fr">
        <label class="fld"><span>Currently taking (to check the dose)</span>
          <select id="cur">
            <option value="">— none / not started —</option>
            <option value="api|5">Apixaban 5 mg BID</option><option value="api|2.5">Apixaban 2.5 mg BID</option>
            <option value="riv|20">Rivaroxaban 20 mg OD</option><option value="riv|15">Rivaroxaban 15 mg OD</option><option value="riv|10">Rivaroxaban 10 mg OD</option><option value="riv|2.5">Rivaroxaban 2.5 mg BID</option>
            <option value="edo|60">Edoxaban 60 mg OD</option><option value="edo|30">Edoxaban 30 mg OD</option>
            <option value="dab|150">Dabigatran 150 mg BID</option><option value="dab|110">Dabigatran 110 mg BID</option><option value="dab|75">Dabigatran 75 mg BID</option>
          </select>
        </label>
        <label class="fld"><span>Planned procedure / surgery</span>
          <select id="proc">
            <option value="">None planned</option>
            <option value="min">Minor (dental, cataract, superficial skin) </option>
            <option value="low">Low bleeding risk (e.g. endoscopy with biopsy, simple ablation)</option>
            <option value="high">High bleeding risk (major surgery, spinal/epidural, polypectomy)</option>
          </select>
        </label>
      </div>
      <div class="cks" style="margin-top:10px">
        <label class="ck"><input type="checkbox" id="od"><span>Once-daily preferred (adherence)</span></label>
      </div>
    </div>
  </section>

  <div class="row" style="margin-bottom:24px"><button type="button" class="btn new" data-new>Clear all details — start new case</button></div>
</form>

<main id="out" aria-live="polite">
  <div class="plan-head">
    <h2>DOAC plan for this patient</h2>
    <button type="button" class="btn new" data-new>+ New case</button>
    <button type="button" class="btn pri" data-ds>Dose summary</button>
    <button type="button" class="btn" id="copyBtn">Copy summary</button>
    <button type="button" class="btn" onclick="window.print()">Print</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="plan"></div>

  <h2 style="font:700 16px/1.2 var(--cond);margin:22px 0 10px">Reference</h2>
  <div id="ref"></div>

  <div class="foot">
    Sources: 2021 EHRA Practical Guide on NOAC use in AF (Steffel et al., <i>Europace</i> 2021); 2024 ESC AF guideline; EMA SmPCs and US prescribing information; ISTH 2021 guidance on DOACs at extremes of body weight; ESC/ESH cancer and VTE guidance. CrCl by Cockcroft–Gault with actual body weight. Where EU and US labels differ, the EU/ESC position is shown, with the US label noted.
    <br>Teaching and decision-support aid — the "suggested" agent is a pragmatic ranking, not a guideline mandate. Check local formulary and product labelling before prescribing.
  </div>
</main>
</div>
<nav class="mtabs" aria-label="View">
  <button type="button" data-view="inputs">Inputs<small>patient &amp; drugs</small></button>
  <button type="button" data-view="plan">Plan<small id="mSum">—</small></button>
  <button type="button" data-ds>Doses<small>quick ref</small></button>
</nav>
<div class="modal" id="dsModal" hidden role="dialog" aria-modal="true" aria-labelledby="dsTitle">
  <div class="sheet">
    <header>
      <h2 id="dsTitle">DOAC dose summary<small>Standard and reduced doses, reduction criteria checked against this patient</small></h2>
      <button type="button" class="btn" id="dsPrint">Print</button>
      <button type="button" class="xbtn" data-close aria-label="Close">×</button>
    </header>
    <div class="sbd" id="dsBody"></div>
  </div>
</div>
<div class="modal" id="clModal" hidden role="dialog" aria-modal="true" aria-labelledby="clTitle">
  <div class="sheet sm">
    <header>
      <h2 id="clTitle">What's new<small>Version history</small></h2>
      <button type="button" class="xbtn" data-close aria-label="Close">×</button>
    </header>
    <div class="sbd" id="clBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const CK=['dialysis','activeBleed','bleed','gi','mech','ms','aps','preg','bf','cancer','giCancer','bariatric','ng','vera','amio','drone','cyclo','macro','azole','hiv','inducer','apt','ssri','od'];
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:null;};
const rad=n=>{const e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:null;};
const setRad=(n,v)=>{const e=document.querySelector('input[name="'+n+'"][value="'+v+'"]');if(e)e.checked=true;};
const r1=x=>Math.round(x*10)/10;
const IND={af:'AF — stroke prevention',vte:'VTE treatment (DVT/PE)',ext:'Extended VTE prevention',tka:'Knee replacement prophylaxis',tha:'Hip replacement prophylaxis',cad:'CAD/PAD vascular protection'};
const AG=[{id:'api',n:'Apixaban',bid:true},{id:'riv',n:'Rivaroxaban',bid:false},{id:'edo',n:'Edoxaban',bid:false},{id:'dab',n:'Dabigatran',bid:true}];
const AGN={api:'Apixaban',riv:'Rivaroxaban',edo:'Edoxaban',dab:'Dabigatran'};
/* brand appearance (Eliquis, Xarelto, Lixiana/Savaysa, Pradaxa) — generics may differ */
const BRAND={api:'Eliquis',riv:'Xarelto',edo:'Lixiana / Savaysa',dab:'Pradaxa'};
const PILL={
  api:{2.5:{sh:'round',f:'#F4D23C',e:'#B8961A',t:'#4A3A00',d:'yellow, round tablet'},5:{sh:'oval',f:'#F2A1BC',e:'#C0607F',t:'#5A1430',d:'pink, oval tablet'}},
  riv:{2.5:{sh:'round',f:'#F5E7A6',e:'#BFAE5E',t:'#4A3F0A',d:'light-yellow, round tablet'},10:{sh:'round',f:'#EE8E86',e:'#B8544B',t:'#4A0E0A',d:'light-red, round tablet'},15:{sh:'round',f:'#D23A3A',e:'#8F1E1E',t:'#FFFFFF',d:'red, round tablet'},20:{sh:'round',f:'#93382C',e:'#5E1F17',t:'#FFFFFF',d:'brown-red, round tablet'}},
  edo:{15:{sh:'round',f:'#F29A3F',e:'#B3651A',t:'#3D1F00',d:'orange, round tablet'},30:{sh:'round',f:'#F2A3B6',e:'#BF6479',t:'#5A1430',d:'pink, round tablet'},60:{sh:'round',f:'#F2D04A',e:'#B5961F',t:'#4A3A00',d:'yellow, round tablet'}},
  dab:{75:{sh:'cap',c:'#F7F5EF',b:'#F7F5EF',e:'#A9A493',t:'#55503F',d:'white capsule'},110:{sh:'cap',c:'#8CC3E6',b:'#F1E5C6',e:'#7E8B96',t:'#3F3A2A',d:'light-blue / cream capsule'},150:{sh:'cap',c:'#8CC3E6',b:'#F1E5C6',e:'#7E8B96',t:'#3F3A2A',d:'light-blue / cream capsule (larger)',big:true}}};
const fmtMg=m=>String(m);
function pillSvg(id,mg,h){
  const P=(PILL[id]||{})[mg];if(!P)return '';h=h||22;
  const hl='<ellipse cx="%X" cy="%Y" rx="%R" ry="%Q" fill="#fff" fill-opacity=".42" transform="rotate(-30 %X %Y)"/>';
  const H=(x,y,r,q)=>hl.replace(/%X/g,x).replace(/%Y/g,y).replace(/%R/g,r).replace(/%Q/g,q);
  const tx=(x,y,fs,s)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${P.t}" font-family="IBM Plex Mono,monospace">${s}</text>`;
  if(P.sh==='round') return `<svg viewBox="0 0 24 24" width="${h}" height="${h}" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="${P.f}" stroke="${P.e}" stroke-width="1.3"/><circle cx="12" cy="12" r="8.4" fill="none" stroke="${P.e}" stroke-opacity=".3"/>${H(8,7.3,4,2.2)}${tx(12,15.4,String(mg).length>2?7.5:9,mg)}</svg>`;
  if(P.sh==='oval'){const w=h*34/22;return `<svg viewBox="0 0 34 22" width="${w.toFixed(1)}" height="${h}" aria-hidden="true"><ellipse cx="17" cy="11" rx="16" ry="10" fill="${P.f}" stroke="${P.e}" stroke-width="1.3"/><ellipse cx="17" cy="11" rx="12.8" ry="7.4" fill="none" stroke="${P.e}" stroke-opacity=".3"/>${H(10.5,6.6,5,2.1)}${tx(17,14.6,9.5,mg)}</svg>`;}
  const L=P.big?46:42,w=h*L/20;
  return `<svg viewBox="0 0 ${L} 20" width="${w.toFixed(1)}" height="${h}" aria-hidden="true"><path d="M${L/2} 1H10a9 9 0 0 0 0 18H${L/2}Z" fill="${P.c}" stroke="${P.e}" stroke-width="1.2"/><path d="M${L/2} 1H${L-10}a9 9 0 0 1 0 18H${L/2}Z" fill="${P.b}" stroke="${P.e}" stroke-width="1.2"/><line x1="${L/2}" y1="1.5" x2="${L/2}" y2="18.5" stroke="${P.e}" stroke-opacity=".6"/><rect x="5" y="4" width="${L-10}" height="3" rx="1.5" fill="#fff" fill-opacity=".45"/>${tx(L*0.73,13.2,7,'R'+mg)}</svg>`;
}
const pillHtml=(id,mg,h)=>{const P=(PILL[id]||{})[mg];return P?`<span class="pill" title="${AGN[id]} ${mg} mg — ${P.d} (${BRAND[id]})">${pillSvg(id,mg,h)}</span>`:'';};
/* how a dose is made from the strengths on the market, e.g. 10 mg apixaban = 2 × 5 mg, 220 mg dabigatran = 2 × 110 mg */
function pillComp(id,mg){
  const S=Object.keys(PILL[id]||{}).map(Number).sort((a,b)=>b-a);
  if(S.includes(mg))return {s:mg,n:1};
  for(const s of S){if(Math.abs(mg/s-Math.round(mg/s))<1e-9)return {s,n:Math.round(mg/s)};}
  return null;
}
function pillRow(id,mgs,h){
  const seen=new Set();
  return '<div class="pillrow">'+mgs.map(m=>{const c=pillComp(id,m);if(!c||seen.has(c.n+'x'+c.s))return '';seen.add(c.n+'x'+c.s);
    return `<span class="pr">${Array(c.n).fill(pillHtml(id,c.s,h)).join('')}<span><b>${c.n>1?c.n+' × ':''}${c.s} mg</b> ${PILL[id][c.s].d}</span></span>`;}).join('')+'</div>';
}
const MAINMG={api:5,riv:20,edo:60,dab:150};

function collect(){
  const s={};
  CK.forEach(k=>s[k]=$(k).checked);
  ['age','wt','ht','cr','plt'].forEach(k=>s[k]=num(k));
  s.ind=$('ind').value; s.sex=rad('sex'); s.cp=rad('cp'); s.cur=$('cur').value; s.proc=$('proc').value;
  s.crMg=s.cr==null?null:($('crUnit').value==='umol'?s.cr/88.4:s.cr);
  s.crcl=(s.age&&s.wt&&s.crMg)?((140-s.age)*s.wt/(72*s.crMg))*(s.sex==='F'?0.85:1):null;
  s.esrd=s.dialysis||(s.crcl!=null&&s.crcl<15);
  s.bmi=(s.wt&&s.ht)?s.wt/Math.pow(s.ht/100,2):null;
  s.obese=(s.wt!=null&&s.wt>120)||(s.bmi!=null&&s.bmi>40);
  s.vteLike=['vte','ext','tka','tha'].includes(s.ind);
  s.strongDual=s.azole||s.hiv;
  return s;
}

/* ---------- per-agent assessment ---------- */
function assess(id,s){
  const r={id,n:AGN[id],st:'ok',dose:'',ph:'',why:[],notes:[],mg:[]};
  const X=t=>{r.st='x';r.why.push(t);};
  const W=t=>{if(r.st==='ok')r.st='warn';r.why.push(t);};
  const N=t=>r.notes.push(t);
  const NA=t=>{r.st='na';r.dose='Not licensed';r.why=[t];return r;};
  const c=s.crcl,a=s.age,w=s.wt,unk=c==null;

  // availability by indication
  if(s.ind==='cad'&&id!=='riv') return NA('Only rivaroxaban 2.5 mg BID is licensed for vascular protection (COMPASS)');
  if((s.ind==='tka'||s.ind==='tha')&&id==='edo') return NA('Not licensed for orthopaedic prophylaxis in EU/US');

  // absolute contraindications shared by all
  if(s.mech) X('Mechanical heart valve — use warfarin (RE-ALIGN)');
  if(s.ms&&s.ind==='af') X('Moderate–severe mitral stenosis — use warfarin (INVICTUS)');
  if(s.aps) X('Triple-positive antiphospholipid syndrome — more arterial events than warfarin (TRAPS); use warfarin');
  if(s.preg) X('Pregnancy — crosses placenta; use LMWH');
  if(s.bf) X('Breastfeeding — excreted in milk; use LMWH or warfarin');
  if(s.activeBleed) X('Active bleeding — hold anticoagulation');
  if(s.inducer) X('Strong CYP3A4/P-gp inducer — levels fall ~50%; avoid');
  if(s.cp==='C') X('Child-Pugh C — contraindicated');
  if(s.cp==='B'){ if(id==='riv') X('Child-Pugh B — contraindicated for rivaroxaban'); else W('Child-Pugh B — use with caution (limited data)'); }
  if(s.esrd) X(s.dialysis?'Dialysis — not recommended (EU)':'CrCl <15 mL/min — not recommended');
  if(id==='dab'&&c!=null&&c<30&&!s.esrd) X('CrCl <30 mL/min — contraindicated (80% renal clearance)');

  // drug interactions
  if(id==='dab'){
    if(s.azole) X('Ketoconazole/itraconazole — contraindicated with dabigatran');
    if(s.cyclo) X('Ciclosporin/tacrolimus — contraindicated / not recommended with dabigatran');
    if(s.drone) X('Dronedarone — contraindicated with dabigatran (↑ levels 70–100%)');
    if(s.hiv) W('HIV protease inhibitor — not recommended with dabigatran');
    if(s.macro) W('Clarithromycin/erythromycin — ↑ levels; use with caution');
    if(s.amio) N('Amiodarone/quinidine ↑ levels (~12–60%) — no AF dose change; monitor');
  } else {
    if(s.strongDual&&id!=='edo') X('Strong dual CYP3A4 + P-gp inhibitor (azole / HIV PI) — avoid');
    if(s.strongDual&&id==='edo') N('Azole/HIV PI: P-gp inhibition — edoxaban reduced to 30 mg (ketoconazole is a labelled trigger)');
    if(s.drone&&id!=='edo') N('Dronedarone: limited data with '+r.n+' — use with caution');
    if(s.cyclo&&id!=='edo') N('Ciclosporin/tacrolimus ↑ levels — caution, monitor bleeding');
    if(s.macro&&id!=='edo') N('Clarithromycin ↑ levels — caution');
  }
  if(s.apt) N('Antiplatelet/NSAID ↑ bleeding — stop unless indicated; add PPI if combined');
  if(s.ssri) N('SSRI/SNRI modestly ↑ bleeding risk');

  // other cautions
  if(s.plt!=null&&s.plt<50) W('Platelets <50 — high bleeding risk; full-dose anticoagulation generally avoided');
  if(s.bariatric) W('After bariatric surgery absorption is unpredictable (worst for rivaroxaban/dabigatran) — consider drug levels or LMWH/warfarin');
  if(s.obese){
    if(s.vteLike){ if(id==='api'||id==='riv') N('BMI >40 / >120 kg: standard dose acceptable for VTE (ISTH 2021)'); else W('BMI >40 / >120 kg: avoid for VTE unless levels monitored (ISTH 2021)'); }
    else if(s.ind==='af'){ if(id==='api'||id==='riv') N('BMI >40 / >120 kg: limited AF data — apixaban/rivaroxaban have the most'); else W('BMI >40 / >120 kg: limited data — consider apixaban/rivaroxaban or levels'); }
  }
  if(w!=null&&w<50) N('Weight <50 kg — higher drug exposure; monitor for bleeding');
  if(s.ng){ if(id==='dab') X('Capsules must be swallowed whole — opening ↑ bioavailability 75%; not via NG tube'); else N('Tablets may be crushed and given via NG tube'+(id==='riv'?' (follow with food/enteral feed)':'')); }
  if(s.gi&&id==='dab') W('Gastritis/GERD — dabigatran causes dyspepsia (~10%) and more GI bleeding');
  if((s.ind==='vte'||s.ind==='ext')&&(s.cancer||s.giCancer)){
    if(s.giCancer&&(id==='riv'||id==='edo')) W('Luminal GI/GU cancer — more GI/GU bleeding (Hokusai-Cancer, SELECT-D); apixaban or LMWH preferred');
    if(id==='dab') W('Not studied in cancer-associated VTE');
  }

  // dosing
  const crit15_29=c!=null&&c>=15&&c<30;
  if(id==='api'){
    if(s.ind==='af'){
      const cr=[];if(a!=null&&a>=80)cr.push('age ≥80');if(w!=null&&w<=60)cr.push('weight ≤60 kg');if(s.crMg!=null&&s.crMg>=1.5)cr.push('Cr ≥1.5 mg/dL');
      if(cr.length>=2){r.dose='2.5 mg BID';r.mg=[2.5];r.ph='Reduced: '+cr.join(' + ');}
      else if(crit15_29){r.dose='2.5 mg BID';r.mg=[2.5];r.ph='Reduced: CrCl 15–29 (EU label)';N('US label: dose by the 2-of-3 rule regardless of CrCl');}
      else {r.dose='5 mg BID';r.mg=[5];r.ph=cr.length?`Full dose — only 1 criterion (${cr[0]})`:'Full dose — no reduction criteria'+(unk?' (confirm age, weight, Cr)':'');}
      if(s.dialysis) N('US label permits 5 mg BID in dialysis (2.5 mg if age ≥80 or ≤60 kg) — not EU/ESC-endorsed');
    } else if(s.ind==='vte'){r.dose='10 mg BID × 7 days → 5 mg BID';r.mg=[5];r.ph='No renal/weight dose reduction for VTE treatment; treat ≥3 months';if(crit15_29)W('CrCl 15–29 — limited data, use with caution');}
    else if(s.ind==='ext'){r.dose='2.5 mg BID';r.mg=[2.5,5];r.ph='After ≥6 months of full-dose treatment (AMPLIFY-EXT)';}
    else if(s.ind==='tka'){r.dose='2.5 mg BID × 10–14 days';r.mg=[2.5];r.ph='First dose 12–24 h after surgery';}
    else if(s.ind==='tha'){r.dose='2.5 mg BID × 32–38 days';r.mg=[2.5];r.ph='First dose 12–24 h after surgery';}
    if(s.ind!=='af'&&crit15_29&&s.ind!=='vte') W('CrCl 15–29 — use with caution');
  }
  if(id==='riv'){
    if(s.ind==='af'){
      if(c!=null&&c<50){r.dose='15 mg OD with evening meal';r.mg=[15];r.ph=`Reduced: CrCl ${Math.round(c)} (15–49)`;}
      else {r.dose='20 mg OD with evening meal';r.mg=[20];r.ph=unk?'15 mg if CrCl 15–49 — CrCl not calculated':'Full dose — CrCl ≥50';}
      if(crit15_29) W('CrCl 15–29 — use with caution');
    } else if(s.ind==='vte'){
      r.dose='15 mg BID × 21 days → 20 mg OD, with food';r.mg=[20];r.ph='No parenteral lead-in; treat ≥3 months';
      if(c!=null&&c<50){r.mg=[20,15];N('CrCl 15–49: consider 15 mg OD maintenance if bleeding risk outweighs recurrence risk (EU label)');}
      if(crit15_29) W('CrCl 15–29 — use with caution');
    } else if(s.ind==='ext'){r.dose='10 mg OD (20 mg OD if high recurrence risk)';r.mg=[10,20];r.ph='After ≥6 months of treatment (EINSTEIN-CHOICE)';}
    else if(s.ind==='tka'){r.dose='10 mg OD × 2 weeks';r.mg=[10];r.ph='First dose 6–10 h after surgery';}
    else if(s.ind==='tha'){r.dose='10 mg OD × 5 weeks';r.mg=[10];r.ph='First dose 6–10 h after surgery';}
    else if(s.ind==='cad'){r.dose='2.5 mg BID + aspirin 75–100 mg OD';r.mg=[2.5];r.ph='COMPASS: stable CAD or symptomatic PAD';
      N('Avoid if high bleeding risk, stroke within 1 month or any haemorrhagic/lacunar stroke, HF with EF <30% / NYHA III–IV, eGFR <15');
      if(s.bleed) W('Prior major bleed — COMPASS excluded high bleeding risk');}
    if(['af','vte'].includes(s.ind)) N('15/20 mg must be taken with food (absorption ↑ ~40%)');
  }
  if(id==='edo'){
    const red=[];if(c!=null&&c<=50&&c>=15)red.push('CrCl 15–50');if(w!=null&&w<=60)red.push('weight ≤60 kg');if(s.drone||s.cyclo||s.macro||s.azole)red.push('P-gp inhibitor');
    r.mg=red.length?[30]:[60];
    const d=red.length?'30 mg OD':'60 mg OD';
    r.ph=red.length?'Reduced: '+red.join(' + '):'Full dose — no reduction criteria'+(unk?' (confirm CrCl, weight)':'');
    if(s.ind==='af'){r.dose=d;if(c!=null&&c>95)W('CrCl >95 — lower efficacy vs warfarin (US: do not use; EU: only after careful evaluation)');}
    else if(s.ind==='vte'){r.dose='LMWH ≥5 days → '+d;}
    else {r.dose=d;r.ph+=' · continue treatment dose';}
  }
  if(id==='dab'){
    if(['af','vte','ext'].includes(s.ind)){
      const lead=s.ind==='vte'?'Parenteral ≥5 days → ':'';
      if((a!=null&&a>=80)||s.vera){r.dose=lead+'110 mg BID';r.mg=[110];r.ph='Reduced: '+[a>=80?'age ≥80':'',s.vera?'verapamil':''].filter(Boolean).join(' + ');}
      else{
        const rs=[];if(a!=null&&a>=75)rs.push('age 75–79');if(c!=null&&c<=50&&c>=30)rs.push('CrCl 30–50');if(s.gi)rs.push('gastritis/GERD');if(s.bleed)rs.push('bleeding risk');
        if(rs.length){r.dose=lead+'150 or 110 mg BID';r.mg=[110,150];r.ph='Individualise ('+rs.join(', ')+') — 110 mg if bleeding risk dominates';}
        else {r.dose=lead+'150 mg BID';r.mg=[150];r.ph='Full dose — no reduction criteria'+(unk?' (confirm CrCl ≥30)':'');}
      }
      if(s.ind==='af') N('US label: 75 mg BID if CrCl 15–30, or CrCl 30–50 with dronedarone/ketoconazole (not EU)');
    } else {
      const dur=s.ind==='tka'?'10 days':'28–35 days';
      const rs=[];if(c!=null&&c>=30&&c<=50)rs.push('CrCl 30–50');if(a!=null&&a>=75)rs.push('age ≥75');if(s.vera||s.amio)rs.push(s.vera?'verapamil':'amiodarone/quinidine');
      if(rs.length){r.dose=`75 mg 1–4 h post-op → 150 mg OD × ${dur}`;r.mg=[150];r.ph='Reduced: '+rs.join(' + ');if(s.vera&&c!=null&&c<=50)N('CrCl 30–50 + verapamil: consider 75 mg OD');}
      else {r.dose=`110 mg 1–4 h post-op → 220 mg OD × ${dur}`;r.mg=[220];r.ph='Full dose';}
    }
  }
  if(r.st==='x') r.dose=r.why.some(t=>/Active bleeding/.test(t))?'Hold':'Do not use';
  return r;
}

/* ---------- ranking ---------- */
function rank(rs,s){
  rs.forEach(r=>{r.score=-99;r.plus=[];r.bid=AG.find(a=>a.id===r.id).bid;});
  const c=s.crcl;
  rs.filter(r=>r.st==='ok'||r.st==='warn').forEach(r=>{
    let sc=2;const P=(v,t)=>{sc+=v;if(v>0&&t)r.plus.push(t);};
    if(r.id==='api') P(1,'least major bleeding of the DOACs in trials');
    if(r.st==='warn') P(-2);
    if((s.age>=75)||s.bleed||s.gi||(c!=null&&c<50)){
      if(r.id==='api') P(2,[s.age>=75?'age ≥75':'',s.bleed?'prior bleed':'',s.gi?'GI disease':'',c!=null&&c<50?'CrCl <50':''].filter(Boolean).join(', ')+' — favours the agent with least renal clearance and bleeding');
      if(r.id==='dab') P(-2);
      if(r.id==='riv'&&(s.bleed||s.gi)) P(-1);
    }
    if(s.od){ if(r.bid) P(-1); else P(2,'once-daily dosing (adherence)'); }
    if(s.ind==='vte'){ if(r.id==='api'||r.id==='riv') P(1,'no parenteral lead-in needed'); else P(-1); }
    if((s.ind==='vte'||s.ind==='ext')&&(s.cancer||s.giCancer)&&r.id==='api') P(2,'preferred DOAC in cancer-associated VTE (Caravaggio), lowest GI bleeding');
    if(s.obese&&s.vteLike&&(r.id==='api'||r.id==='riv')) P(1,'endorsed at any body weight for VTE (ISTH)');
    if(c!=null&&c>=15&&c<30&&r.id==='api') P(1);
    r.score=sc;
  });
  const ok=rs.filter(r=>r.score>-99).sort((a,b)=>b.score-a.score);
  return ok;
}

/* ---------- peri-procedural ---------- */
function hold(id,s){
  const c=s.crcl,p=s.proc;
  if(p==='min') return {before:'No full interruption — do at trough (≈12 h after BID / 24 h after OD dose) or skip one dose',after:'Resume 6 h after'};
  const hi=p==='high';
  let h;
  if(id==='dab'){
    if(c==null) h=hi?'≥48–96 h (CrCl needed)':'≥24–48 h (CrCl needed)';
    else if(c>=80) h=hi?'≥48 h':'≥24 h';
    else if(c>=50) h=hi?'≥72 h':'≥36 h';
    else h=hi?'≥96 h':'≥48 h';
  } else {
    if(c!=null&&c<30) h=hi?'≥48 h':'≥36 h';
    else h=hi?'≥48 h':'≥24 h';
  }
  return {before:'Last dose '+h+' before',after:hi?'Resume 48–72 h after (prophylactic LMWH in between if VTE risk high)':'Resume 6–24 h after, once haemostasis secure'};
}

/* ---------- html helpers ---------- */
const STL={ok:'Suitable',warn:'Caution',x:'Avoid',na:'Not licensed'};
const li=(t,c,sub,mod)=>`<li class="${mod||''}"><span class="cls ${c||'dot'}">${c||'•'}</span><div class="tx">${t}${sub?`<small>${sub}</small>`:''}</div></li>`;
const ul=a=>a.length?`<ul class="it">${a.join('')}</ul>`:'';
const sec=(k,L,title,desc,body)=>`<section class="sec ${k}"><header><div class="L">${L}</div><div><h3>${title}</h3><p>${desc}</p></div></header><div class="bd">${body}</div></section>`;

const SE={
  api:['Bleeding (least major/GI bleeding vs warfarin in ARISTOTLE)','Nausea, anaemia, bruising','Rare: hypersensitivity, rash, raised LFTs'],
  riv:['Bleeding — more GI bleeding than warfarin (ROCKET-AF)','Heavy menstrual bleeding (more than apixaban)','Must take 15/20 mg with food','Rare: drug-induced liver injury, rash, thrombocytopenia'],
  edo:['Bleeding (less major bleeding than warfarin; more GI bleeding at 60 mg)','Anaemia, rash, raised LFTs','Reduced efficacy if CrCl >95 (AF)'],
  dab:['Dyspepsia/gastritis (~10%) — take with food and water, upright','More GI bleeding at 150 mg (RE-LY)','Capsules whole — never open; keep in original pack (moisture)','Small MI signal in RE-LY (not confirmed in later data)']
};

/* ---------- render ---------- */
function render(){
  const s=collect();
  const rs=AG.map(a=>assess(a.id,s));
  const ok=rank(rs,s);
  const best=ok[0];

  // tiles
  const t=[];
  t.push(`<div class="tile ${s.crcl!=null&&s.crcl<30?'bad':s.crcl!=null&&s.crcl<50?'warn':''}"><div class="k">CrCl (C-G)</div><div class="v">${s.crcl!=null?Math.round(s.crcl):'—'}<small> mL/min</small></div><div class="s">${s.dialysis?'On dialysis':s.crcl==null?'Needs age, weight, Cr, sex':'Cr '+(Math.round(s.crMg*100)/100)+' mg/dL'}</div></div>`);
  t.push(`<div class="tile"><div class="k">Age / weight</div><div class="v">${s.age??'—'}<small> y</small> ${s.wt??'—'}<small> kg</small></div><div class="s">${s.bmi?'BMI '+r1(s.bmi):''}${s.obese?' · extreme weight':''}</div></div>`);
  t.push(`<div class="tile ${s.cp==='C'?'bad':s.cp==='B'?'warn':''}"><div class="k">Liver</div><div class="v">${s.cp==='0'?'OK':'C-P '+s.cp}</div><div class="s">${s.plt!=null?'Plt '+s.plt:''}</div></div>`);
  t.push(`<div class="tile ${best?'good':'bad'}"><div class="k">Suggested</div><div class="v" style="font-size:18px">${best?best.n:'None'}</div><div class="s">${best?best.dose:'see alerts'}</div></div>`);
  $('tiles').innerHTML=t.join('');
  $('mSum').innerHTML=best?`${best.n} ${best.mg[0]??''} mg`:'No DOAC';

  let h='';
  // alerts
  const hard=[];
  if(s.mech) hard.push('Mechanical valve → warfarin only (INR per valve)');
  if(s.ms&&s.ind==='af') hard.push('Moderate–severe MS with AF → warfarin, INR 2–3');
  if(s.aps) hard.push('Triple-positive APS → warfarin, INR 2–3');
  if(s.preg) hard.push('Pregnancy → therapeutic LMWH');
  if(s.bf) hard.push('Breastfeeding → LMWH or warfarin');
  if(s.activeBleed) hard.push('Active bleeding → hold; reverse if life-threatening (see Reference)');
  if(s.esrd) hard.push((s.dialysis?'Dialysis':'CrCl <15')+' → warfarin (or apixaban per US label for AF)');
  if(s.inducer) hard.push('Strong inducer → warfarin or LMWH; or change the interacting drug');
  if(s.cp==='C') hard.push('Child-Pugh C → avoid all DOACs; specialist advice');
  if(hard.length) h+=`<div class="alert"><b class="h">DOAC CONTRAINDICATION</b><ul>${hard.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;

  // summary
  let sb='';
  if(best){
    const alts=ok.slice(1).map(r=>`${r.n} ${r.dose}`);
    sb+=`<div class="sugg"><div class="k">Suggested for ${IND[s.ind]}</div><div class="drugrow"><div class="drug">${best.n}<span>${best.dose}</span></div>${pillRow(best.id,best.mg.length?best.mg.slice(0,1):[MAINMG[best.id]],30)}</div><div class="plan">${best.ph}</div>
      <ul>${best.plus.map(p=>`<li>${p}</li>`).join('')}${best.why.map(p=>`<li>Caution: ${p}</li>`).join('')}</ul>
      ${alts.length?`<div class="plan muted" style="margin-top:6px">Alternatives: ${alts.join(' · ')}</div>`:''}</div>`;
  } else {
    sb+=`<div class="sugg none"><div class="k">Suggested</div><div class="drug">No DOAC suitable</div><div class="plan">${hard.length?hard[0]:'All agents have a contraindication or are not licensed for this indication — see cards below.'}</div></div>`;
  }
  // current dose check
  if(s.cur){
    const [ag,mgS]=s.cur.split('|'),mg=parseFloat(mgS),A=rs.find(r=>r.id===ag);
    let txt,mod;
    if(A.st==='x'){txt=`<b>${A.n} should not be used:</b> ${A.why[0]}`;mod='x';}
    else if(A.st==='na'){txt=`<b>${A.n} is not licensed</b> for ${IND[s.ind].toLowerCase()}`;mod='x';}
    else if(A.mg.includes(mg)){txt=`<b>Current ${A.n} ${mgS} mg is appropriate</b> — ${A.ph}`;mod='ok';}
    else if(mg<Math.min(...A.mg)){txt=`<b>Under-dosed:</b> ${A.n} ${mgS} mg, but recommended is ${A.dose} (${A.ph}). Inappropriate dose reduction raises stroke/VTE risk.`;mod='warn';}
    else {txt=`<b>Dose too high:</b> ${A.n} ${mgS} mg, recommended ${A.dose} (${A.ph}).`;mod='warn';}
    sb+=`<div class="verdict ${mod==='x'?'bad':mod==='ok'?'':'none'}" style="${mod==='warn'?'background:var(--warn-wash);border-color:var(--warn-line)':''}">${txt}</div>`;
  }
  sb+=`<div class="agents">${rs.map(r=>`<div class="ag dc-${r.id} ${best&&r.id===best.id?'best':''} ${r.st==='x'?'x':''}">
      <h5>${(r.st==='ok'||r.st==='warn')&&r.mg.length?'':pillHtml(r.id,MAINMG[r.id],18)}${r.n}<span class="st ${r.st}">${STL[r.st]}</span></h5>
      <div class="dose">${r.dose}</div>${(r.st==='ok'||r.st==='warn')&&r.mg.length?pillRow(r.id,r.mg,22):''}${r.st==='ok'||r.st==='warn'?`<div class="ph">${r.ph}</div>`:''}
      ${(r.why.length||r.notes.length)?`<ul>${r.why.map(x=>`<li>${x}</li>`).join('')}${r.st!=='na'?r.notes.map(x=>`<li class="muted">${x}</li>`).join(''):''}</ul>`:''}
    </div>`).join('')}</div>`;
  h+=sec('d','Rx','Case summary — which DOAC, what dose',IND[s.ind],sb);

  // counselling for suggested
  const focus=best||(s.cur?rs.find(r=>r.id===s.cur.split('|')[0]):null);
  if(focus){
    const se=SE[focus.id].map(x=>li(x));
    const bid=AG.find(a=>a.id===focus.id).bid;
    se.push(li(bid?'Missed dose: take if ≥6 h before the next dose, otherwise skip — never double up':'Missed dose: take if ≥12 h before the next dose, otherwise skip — never double up'));
    se.push(li('Bleeding warning signs: black stools, blood in urine, vomiting blood, severe headache — seek care'));
    se.push(li('Avoid NSAIDs and herbal supplements (St John\'s wort, ginkgo); carry anticoagulant card'));
    h+=sec('s','!','Side effects & counselling — '+focus.n,'What to tell the patient',ul(se));
  }

  // peri-procedural
  if(s.proc){
    const list=(s.cur?[rs.find(r=>r.id===s.cur.split('|')[0])]:ok).filter(Boolean);
    const rows=list.map(r=>{const p=hold(r.id,s);return `<tr><td>${r.n}</td><td>${p.before}</td><td>${p.after}</td></tr>`;}).join('');
    h+=sec('p','⏱','Peri-procedural plan',({min:'Minor procedure',low:'Low bleeding-risk procedure',high:'High bleeding-risk procedure'})[s.proc]+(s.crcl!=null?` · CrCl ${Math.round(s.crcl)}`:''),
      (rows?`<div class="tblwrap"><table class="dose"><thead><tr><th>Agent</th><th>Stop</th><th>Restart</th></tr></thead><tbody>${rows}</tbody></table></div>`:'')+
      ul([li('No heparin bridging for DOACs'),li('Neuraxial anaesthesia: follow ESAIC/ASRA intervals — longer for dabigatran with reduced CrCl (up to 120 h)'),li('Emergency surgery: check drug level / time since last dose; reversal agent if needed')]));
  }

  // monitoring
  const m=[];
  if(s.crcl!=null&&s.crcl<60) m.push(li(`Renal function every <b>${Math.max(1,Math.floor(s.crcl/10))} months</b> (CrCl ÷ 10), and with any acute illness`));
  else m.push(li('Creatinine/CrCl, Hb and LFT at least yearly'));
  if(s.age>=75) m.push(li('Age ≥75 / frail: review every 6 months'));
  m.push(li('Re-check dose criteria whenever weight, renal function or interacting drugs change'));
  m.push(li('Adherence check each visit — short half-lives mean missed doses leave the patient unprotected'));
  h+=sec('m','↻','Monitoring','Follow-up',ul(m));

  $('plan').innerHTML=h;
  if(!$('dsModal').hidden) renderDS();
}

  L.push(`Patient: ${s.age??'?'} y ${s.sex}, ${s.wt??'?'} kg, CrCl ${s.crcl!=null?Math.round(s.crcl)+' mL/min':'n/a'}${s.cp!=='0'?', Child-Pugh '+s.cp:''}`);

<script>
/* ---------- sun/moon theme button (drives the app's own light/dark controls, kept hidden) ---------- */
(function(){
var C={"hide":".seg-theme","light":"[data-theme-set=\"light\"]","dark":"[data-theme-set=\"dark\"]"},root=document.documentElement;
var old=document.querySelector(C.hide);if(old&&C.parent)old=old.parentElement;if(!old)return;
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
var btn=document.createElement('button');btn.type='button';btn.className='zth';
old.classList.add('zth-hidden');old.insertAdjacentElement('afterend',btn);
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function cur(){var a=root.getAttribute('data-theme');if(a==='light'||a==='dark')return a;return mq&&mq.matches?'dark':'light';}
function thai(){return (root.getAttribute('lang')||'').slice(0,2)==='th';}
function paint(){var d=cur()==='dark';btn.innerHTML=d?SUN:MOON;
  var l=d?(thai()?'เปลี่ยนเป็นโหมดสว่าง':'Switch to light mode'):(thai()?'เปลี่ยนเป็นโหมดมืด':'Switch to dark mode');
  btn.setAttribute('aria-label',l);btn.title=l;}
btn.addEventListener('click',function(){var t=document.querySelector(cur()==='dark'?C.light:C.dark);if(t)t.click();paint();});
new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme','lang']});
if(mq){if(mq.addEventListener)mq.addEventListener('change',paint);else if(mq.addListener)mq.addListener(paint);}
paint();
})();

<script id="zfold">
/* ---------- collapsible blocks ---------- */
(function(){
  var SEL='.card,.sec,.simple>div.sm-card,section.panel,div.panel,section.section';
  var KEY='zfold2:'+(document.title||'app'),st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function headOf(b){
    var h=b.querySelector(':scope>h2,:scope>header,:scope>.sm-h,:scope>.panel-head,:scope>.section-head,:scope>h3');
    if(h)return h;
    var x=b.querySelector('h2,h3');if(!x)return null;
    var k=x;while(k.parentElement&&k.parentElement!==b)k=k.parentElement;
    if(k.parentElement!==b)return null;
    return (k===x||k.children.length<=2)?k:null;   /* heading buried in a content wrapper: leave the block alone */
  }
  function name(b,h){var t=h.querySelector('h1,h2,h3,h4')||h;return (t.textContent||'').replace(/\s+/g,' ').trim().replace(/^[0-9]+[a-z]?\s+/i,'').slice(0,48);}
  function setState(b,closed){
    if(closed)b.setAttribute('data-zf','closed');else b.removeAttribute('data-zf');
    var h=b.querySelector('.zf-head');if(h)h.setAttribute('aria-expanded',String(!closed));
  }
  /* everything starts folded except the main block(s) */
  function defOpen(b){
    if(/^(history|consult note|current meds|setting & situation|picbox|dose calculator|new weekly schedule)/i.test(b.dataset.zfn))return true;
    return document.querySelector('[data-zfn]')===b;
  }
  function prep(){
    document.querySelectorAll(SEL).forEach(function(b){
      if(b.tagName==='DETAILS'||b.closest('[role=dialog],dialog,.modal,.zcl-back,.zcl-modal,.sheet,.sheet-doc'))return;
      var h=headOf(b);if(!h)return;
      if(!h.classList.contains('zf-head')){
        h.classList.add('zf-head','zf-keep');h.setAttribute('role','button');h.setAttribute('tabindex','0');
        var p=h.previousElementSibling;while(p){p.classList.add('zf-keep');p=p.previousElementSibling;}
        b.dataset.zfn=name(b,h);
        var s0=st[b.dataset.zfn];setState(b,s0?s0==='c':!defOpen(b));
      }
    });
    paintAll();
  }
  function toggle(b,force){
    var closed=force!=null?force:b.getAttribute('data-zf')!=='closed';
    setState(b,closed);
    st[b.dataset.zfn]=closed?'c':'o';
    save();paintAll();
    if(!closed)setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},30);
  }
  function blocks(){return [].filter.call(document.querySelectorAll(SEL),function(b){return b.dataset.zfn!=null&&b.offsetParent!==null;});}
  var allBtn=null;
  function anyOpen(){return blocks().some(function(b){return b.getAttribute('data-zf')!=='closed';});}
  function paintAll(){if(allBtn)allBtn.textContent=anyOpen()?'Collapse all':'Expand all';}
  function addAll(){
    var host=document.querySelector('.top,header.mast,header.masthead,.masthead');if(!host||allBtn)return;
    allBtn=document.createElement('button');allBtn.type='button';allBtn.className='zf-all btn';
    allBtn.addEventListener('click',function(){var c=anyOpen();blocks().forEach(function(b){toggle(b,c);});});
    var anchor=host.querySelector('.zth,[data-new]');
    if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(allBtn,anchor);else host.appendChild(allBtn);
    paintAll();
  }
  function act(e){
    var h=e.target.closest&&e.target.closest('.zf-head');if(!h)return;
    if(e.target.closest('button,a,input,select,textarea,label,summary')&&e.target.closest('button,a,input,select,textarea,label,summary')!==h)return;
    var b=h.closest('[data-zfn]');if(!b)return;
    if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;if(e.target!==h)return;e.preventDefault();}
    toggle(b);
  }
  document.addEventListener('click',act);document.addEventListener('keydown',act);
  /* Copy / Print read the page text, so unfold everything for a moment */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.classList.contains('zf-all'))return;
    if(!/copy|print|คัดลอก|พิมพ์/i.test((b.textContent||'')+' '+(b.id||'')))return;
    var c=[].slice.call(document.querySelectorAll('[data-zf="closed"]'));if(!c.length)return;
    c.forEach(function(x){x.removeAttribute('data-zf');});
    setTimeout(function(){c.forEach(function(x){if(x.isConnected)x.setAttribute('data-zf','closed');});},1200);
  },true);
  window.addEventListener('beforeprint',function(){});
  var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;prep();},0);}
  function start(){prep();addAll();new MutationObserver(later).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>

<!doctype html>
<html lang="en">

<style>
:root{
  color-scheme: light;
  --ground:#EFF1F5; --surface:#FFFFFF; --surface-2:#E7EAF1; --surface-3:#DBE0EA;

    --ink:#ECEFF6; --ink-2:#A6AEC2; --ink-3:#7C8499;

    --acc:#8CA5E8; --acc-wash:#1A2340; --acc-line:#2E3B63; --on-accent:#0E1016;
    --good:#45C585; --good-wash:#102C1E; --good-line:#1F4A33;
    --warn:#E0A93C; --warn-wash:#2E2412; --warn-line:#50401B;
    --bad:#EE7A76;  --bad-wash:#301715;  --bad-line:#522522;
    --c-c:#58B8D2; --c-a:#EE7A76; --c-r:#A99BE8; --c-e:#45C585; --c-w:#DCA24E;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0E1016; --surface:#161A24; --surface-2:#1E2331; --surface-3:#282E3E;
  --ink:#ECEFF6; --ink-2:#A6AEC2; --ink-3:#7C8499;
  --rule:#262C3A; --rule-2:#3A4256;
  --acc:#8CA5E8; --acc-wash:#1A2340; --acc-line:#2E3B63; --on-accent:#0E1016;
  --good:#45C585; --good-wash:#102C1E; --good-line:#1F4A33;
  --warn:#E0A93C; --warn-wash:#2E2412; --warn-line:#50401B;
  --bad:#EE7A76;  --bad-wash:#301715;  --bad-line:#522522;
  --c-c:#58B8D2; --c-a:#EE7A76; --c-r:#A99BE8; --c-e:#45C585; --c-w:#DCA24E;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.top h1{margin:0;font:700 19px/1.2 var(--cond);letter-spacing:.2px}

.top .sp{flex:1}
.seg-theme{display:inline-flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.seg-theme button{border:0;background:transparent;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.seg-theme button.on{background:var(--acc);color:var(--on-accent)}
.wrap{display:grid;grid-template-columns:minmax(360px,470px) 1fr;gap:18px;padding:18px 20px 40px;max-width:1500px;margin:0 auto}

@media (max-width:980px){
  .wrap{grid-template-columns:1fr;padding:14px 16px 40px}
  .inputs{position:static;max-height:none;overflow:visible;padding-right:0}
}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px}
.card>h2{margin:0;padding:10px 14px;font:600 13px/1.3 var(--cond);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.card>h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.card .bd{padding:12px 14px}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--rule-2);border-radius:7px;background:var(--surface);padding:8px 10px;line-height:1.45}
textarea:focus,input:focus,select:focus{outline:2px solid var(--acc-line);outline-offset:0;border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11.5px;color:var(--ink-3);font-weight:500}
.fld input,.fld select{width:100%;border:1px solid var(--rule-2);border-radius:7px;background:var(--surface);padding:6px 8px;min-width:0}
.fld .dual{display:flex;gap:4px}
.fld .dual input{flex:1}
.fld .dual select{width:auto;flex:0 0 auto;padding:6px 4px}
.lbl{font-size:11.5px;color:var(--ink-3);font-weight:500;margin:10px 0 5px}
.lbl:first-child{margin-top:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg label{cursor:pointer;position:relative}
.seg input,.fld .seg input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;padding:0;opacity:0;pointer-events:none}
.seg span{display:block;padding:5px 10px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--acc);color:var(--on-accent)}
.seg input:focus-visible+span{outline:2px solid var(--acc-line);outline-offset:-2px}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{cursor:pointer;user-select:none;position:relative}
.ck input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.ck span{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--rule-2);border-radius:999px;font-size:12.5px;color:var(--ink-2);background:var(--surface);line-height:1.3}

.ck input:focus-visible+span{outline:2px solid var(--acc-line)}
.ck input:disabled+span{opacity:.45;cursor:not-allowed}
.ck.danger input:checked+span{background:var(--bad-wash);border-color:var(--bad)}
.ck.danger input:checked+span::before{background:var(--bad);border-color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.hint.w{color:var(--warn)}
.found{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.found .tag{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--good-wash);border:1px solid var(--good-line);color:var(--good)}
.found .tag.m{background:var(--surface-2);border-color:var(--rule);color:var(--ink-3)}

/* plan */
.plan-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.plan-head h2{margin:0;font:700 17px/1.2 var(--cond);flex:1;min-width:180px}

.alert{border:1px solid var(--bad-line);background:var(--bad-wash);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:10px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec>header .L{color:#0E1016}}
.sec .bd{padding:6px 14px 12px}
.sec h4{margin:12px 0 4px;font:600 12.5px/1.3 var(--cond);letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2)}

.verdict.none{background:var(--surface-2);border-color:var(--rule)}
.verdict.bad{background:var(--bad-wash);border-color:var(--bad-line)}
ul.it{list-style:none;margin:0;padding:0}
ul.it li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed var(--rule);align-items:flex-start}
ul.it li:last-child{border-bottom:0}
ul.it li .tx{flex:1;min-width:0}
ul.it li .tx small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
ul.it li.no .tx{color:var(--ink-2)}

.cls{flex:0 0 auto;min-width:34px;text-align:center;font:600 11px/1 var(--mono);padding:4px 5px;border-radius:5px;margin-top:1px;border:1px solid}
.cls.I{color:var(--good);background:var(--good-wash);border-color:var(--good-line)}
.cls.IIa{color:var(--acc);background:var(--acc-wash);border-color:var(--acc-line)}
.cls.IIb{color:var(--warn);background:var(--warn-wash);border-color:var(--warn-line)}
.cls.III{color:var(--bad);background:var(--bad-wash);border-color:var(--bad-line)}
.cls.dot{color:var(--ink-3);background:transparent;border-color:transparent}
table.dose{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
table.dose th,table.dose td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}

.brk span{font:500 11.5px/1 var(--mono);padding:4px 6px;border-radius:5px;border:1px solid var(--rule);color:var(--ink-3)}
.brk span.on{border-color:var(--acc);background:var(--acc-wash);color:var(--acc)}

.tt-key .b::before{background:var(--acc)}.tt-key .i::before{background:var(--good)}.tt-key .a::before{background:var(--bad)}
.tt-chart{display:block;width:100%;height:auto;margin-top:12px}
.tt-meth{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.sm-mg{font:600 16px/1.2 var(--mono);padding:2px 4px}
.sm-tx{font-size:11px;color:var(--ink-3);padding:0 4px 8px}

@media (max-width:640px){

  .sm-week{grid-template-columns:1fr}

  .sm-dh{width:92px;flex:0 0 92px;align-self:stretch;justify-content:center}
  .sm-pills{padding:6px;min-height:0;justify-content:flex-start}
  .sm-mg{margin-left:auto;padding-right:10px}
  .sm-tx{display:none}
  .tt-in{grid-template-columns:1fr}
  .nm-row{grid-template-columns:78px minmax(0,1fr)}

  body.sm-print #sOut{border:0;box-shadow:none;padding:0}
  body.sm-print .simple{display:block!important;padding:0;max-width:none}
  body.sm-print .sm-printhead{display:block;font:700 18px/1.3 var(--sans);margin-bottom:10px}
  body.sm-print .sm-week{grid-template-columns:repeat(7,minmax(0,1fr))}
}

.sec.c>header{background:color-mix(in srgb,var(--c-c) 10%,var(--surface))}.sec.a>header{background:color-mix(in srgb,var(--c-a) 9%,var(--surface))}.sec.r>header{background:color-mix(in srgb,var(--c-r) 10%,var(--surface))}.sec.e>header{background:color-mix(in srgb,var(--c-e) 10%,var(--surface))}.sec.w>header{background:color-mix(in srgb,var(--c-w) 11%,var(--surface))}

.sec.c h4{border-left-color:var(--c-c)}.sec.a h4{border-left-color:var(--c-a)}.sec.r h4{border-left-color:var(--c-r)}.sec.e h4{border-left-color:var(--c-e)}.sec.w h4{border-left-color:var(--c-w)}
.tile{border-top:3px solid var(--acc)}

.act.no{background:color-mix(in srgb,var(--good) 6%,var(--surface))}
.sched .d{border-top:4px solid var(--rule-2)}
.sched .d:nth-child(1){border-top-color:#FFD43B}.sched .d:nth-child(2){border-top-color:#F7A8C4}.sched .d:nth-child(3){border-top-color:#2E9E5B}.sched .d:nth-child(4){border-top-color:#F59E3B}.sched .d:nth-child(5){border-top-color:#3D7BE0}.sched .d:nth-child(6){border-top-color:#8E5CC9}.sched .d:nth-child(7){border-top-color:#E5484D}
/* simple mode */

.sm-h,details.sm-card>summary{margin:-14px -16px 12px;padding:11px 16px;background:var(--surface-2);background:color-mix(in srgb,var(--k) 16%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--k) 32%,var(--rule));border-radius:0 11px 0 0;color:var(--ink)}
.sm-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;font:600 13px/1.3 var(--cond);letter-spacing:.6px;text-transform:uppercase}

#sIn .lbl{color:var(--ink-2);font-weight:600}
.sm-row .fld input,.sm-row .fld select{background:color-mix(in srgb,var(--acc) 4%,var(--surface))}

.sm-adj button:not([aria-pressed="true"]):hover{filter:brightness(.97)}
.sm-disp{background:color-mix(in srgb,var(--c-c) 8%,var(--surface));border-color:color-mix(in srgb,var(--c-c) 45%,var(--rule))}
.sm-legend{padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.nm-row.k-vlow,.nm-row.k-low{background:color-mix(in srgb,var(--acc) 5%,var(--surface))}
.nm-row.k-in{background:color-mix(in srgb,var(--good) 7%,var(--surface))}

.tt-row input{background:color-mix(in srgb,var(--c-r) 4%,var(--surface))}
/* tablet picture inside a stock chip must not take the chip's own styling */
.ck span.sm-tp{padding:0;border:0;background:none;border-radius:0;display:inline-flex}

<body>
<div class="top">
  <div>
    <h1>Warfarin Planner<button type="button" class="ver" id="verBtn" title="What's new"></button></h1>
    <div class="sub">INR-guided dose adjustment with a ready-to-dispense weekly schedule · drug-interaction auto-adjust · when to stop / vitamin K / FFP / PCC · OPD &amp; IPD · CHEST 2012/2022 · ASH 2018 · ACC 2020 · AHA/ASA 2022</div>
  </div>
  <div class="sp"></div>
  <div class="modeseg" role="group" aria-label="App view"><button type="button" data-mode-set="simple" aria-pressed="true">Simple</button><button type="button" data-mode-set="detailed" aria-pressed="false">Detailed</button></div>
  <button type="button" class="btn new" data-new>+ New case</button>
  <div class="seg-theme" role="group" aria-label="Theme">
    <button data-theme-set="light">Light</button><button data-theme-set="auto" class="on">Auto</button><button data-theme-set="dark">Dark</button>
  </div>
</div>

<section class="simple" id="simple" hidden aria-label="Simple dose calculator">
  <div class="sm-card" id="sIn">
    <div class="sm-h">Dose calculator <small>ปรับขนาดยาวาร์ฟาริน · weekly total</small></div>
    <div class="sm-ex" id="sEx"><span class="lbl">Sample cases</span></div>
    <div class="sm-row">
      <label class="fld sm-big"><span>Total weekly dose now (mg/week)</span><input id="sW" type="number" min="0" max="140" step="0.25" inputmode="decimal" placeholder="e.g. 21"></label>
      <label class="fld"><span>Next visit (นัดติดตาม)</span><select id="sWeeks"><option value="1">1 week</option><option value="2" selected>2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option><option value="5">5 weeks</option><option value="6">6 weeks</option><option value="7">7 weeks</option><option value="8">8 weeks</option><option value="9">9 weeks</option><option value="10">10 weeks</option></select></label>
      <label class="fld"><span>INR today (optional)</span><input id="sInr" type="number" min="0.8" max="25" step="0.1" inputmode="decimal" placeholder="—"></label>
      <label class="fld"><span>Target INR</span><select id="sTgt"><option value="2-3">2.0 – 3.0</option><option value="2.5-3.5">2.5 – 3.5</option><option value="1.5-2">1.5 – 2.0</option><option value="1.8-2.5">1.8 – 2.5</option></select></label>
    </div>
    <div class="lbl">Tablets in stock</div>
    <div class="cks" id="sTabs">
      <label class="ck"><input type="checkbox" data-v="1"><span>1 mg</span></label>
      <label class="ck"><input type="checkbox" data-v="2" checked><span>2 mg</span></label>
      <label class="ck"><input type="checkbox" data-v="3" checked><span>3 mg</span></label>
      <label class="ck"><input type="checkbox" data-v="5" checked><span>5 mg</span></label>
      <label class="ck"><input type="checkbox" data-v="h" checked><span>Allow ½ tablets</span></label>
    </div>
    <div class="lbl">Change the weekly dose</div>
    <div class="sm-adj" id="sAdj" role="group" aria-label="Dose change"></div>
    <div id="sHint"></div>
  </div>
  <div class="sm-card" id="sOut"></div>
  <details class="sm-card" id="sNomo" open><summary>Thai warfarin nomogram <small>ตารางที่ 3 · dose adjustment by INR · Thai HA 2010</small></summary><div id="nmOut"></div></details>
  <details class="sm-card" id="ttCard" open><summary>TTR calculator <small>Time in therapeutic range · Rosendaal method</small></summary>
    <div class="tt-in">
      <div>
        <div class="lbl" style="margin-top:0">INR results — date and INR (target from the box above)</div>
        <div class="tt-rows" id="ttRows"></div>
        <div class="sm-actions" style="margin-top:8px"><button type="button" class="btn sm" id="ttAdd">+ Add INR</button><button type="button" class="btn sm" id="ttToday">+ Today’s INR</button><button type="button" class="btn sm" id="ttClear">Clear list</button></div>
        <details class="tt-paste"><summary>Paste a list from the lab report</summary><textarea id="ttPaste" placeholder="One result per line, e.g.&#10;12/08/2026  2.4&#10;9/9/2569  3.1&#10;2026-10-07  1.8"></textarea><button type="button" class="btn sm" id="ttParse">Add to list</button><div class="hint">Day/month/year (Thai Buddhist years are converted) or yyyy-mm-dd, then the INR.</div></details>
      </div>
      <div id="ttOut"></div>
    </div>
  </details>
</section>
<div class="wrap">
<form class="inputs" id="f" autocomplete="off" onsubmit="return false">

  <section class="card k-set">
    <h2><span class="n">01</span> Setting &amp; situation <button type="button" class="btn sm new" data-new>Clear · new case</button></h2>
    <div class="bd">
      <div class="lbl">Setting</div>
      <div class="seg"><label><input type="radio" name="setting" value="opd" checked><span>OPD (clinic)</span></label><label><input type="radio" name="setting" value="ipd"><span>IPD (inpatient)</span></label></div>
      <div class="lbl">Situation</div>
      <div class="seg"><label><input type="radio" name="sit" value="maint" checked><span>Dose adjustment</span></label><label><input type="radio" name="sit" value="init"><span>Initiation</span></label><label><input type="radio" name="sit" value="bleed"><span>Bleeding / reversal</span></label><label><input type="radio" name="sit" value="proc"><span>Procedure / surgery</span></label></div>
    </div>
  </section>

  <section class="card k-meds">
    <h2><span class="n">02</span> Current meds &amp; case text</h2>
    <div class="bd">
      <textarea id="hx" placeholder="Paste the med list / note, e.g.&#10;Warfarin (3 mg) 1 tab Mon–Fri, ½ tab Sat–Sun&#10;Amiodarone 200 mg 1x1 (started today)&#10;Omeprazole 20 mg ac&#10;INR 3.8, wt 58 kg, AF"></textarea>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn pri" id="parseBtn">Auto-read meds</button>
        <span class="muted" style="font-size:12px">Examples:</span>
        <button type="button" class="btn sm" data-ex="0">OPD + amiodarone</button>
        <button type="button" class="btn sm" data-ex="1">IPD INR 11</button>
        <button type="button" class="btn sm" data-ex="2">UGIB, MVR</button>
        <button type="button" class="btn sm" data-ex="3">Elective surgery</button>
        <button type="button" class="btn sm" data-ex="4">ICH</button>
        <button type="button" class="btn sm" data-ex="5">Post-op restart</button>
      </div>
      <div class="found" id="found"></div>
      <div class="hint">Reads the warfarin regimen (tabs × strength × days, or mg per day), interacting drugs, INR, age, weight, Cr, Hb and indication. Always check the fields below — they drive the plan.</div>
    </div>
  </section>

  <section class="card k-reg">
    <h2><span class="n">03</span> Warfarin regimen now</h2>
    <div class="bd">
      <div class="lbl">mg per day (current)</div>
      <div class="days" id="days">
        <label>Mon<input data-day="0" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
        <label>Tue<input data-day="1" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
        <label>Wed<input data-day="2" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
        <label>Thu<input data-day="3" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
        <label>Fri<input data-day="4" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
        <label>Sat<input data-day="5" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
        <label>Sun<input data-day="6" type="number" min="0" max="30" step="0.25" inputmode="decimal"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="fld" style="flex-direction:row;align-items:center;gap:6px"><span>Same dose every day</span><input id="fillAll" type="number" min="0" max="30" step="0.25" inputmode="decimal" style="width:80px"></label>
        <button type="button" class="btn sm" id="fillBtn">Fill week</button>
      </div>
      <div class="wk" id="wkCur"></div>
      <div class="lbl">Tablet strengths in stock</div>
      <div class="cks" id="tabs">
        <label class="ck"><input type="checkbox" value="1"><span>1 mg</span></label>
        <label class="ck"><input type="checkbox" value="2" checked><span>2 mg</span></label>
        <label class="ck"><input type="checkbox" value="3" checked><span>3 mg</span></label>
        <label class="ck"><input type="checkbox" value="5" checked><span>5 mg</span></label>
        <label class="ck"><input type="checkbox" id="halves" checked><span>Allow ½ tablets</span></label>
      </div>
    </div>
  </section>

  <section class="card k-pt">
    <h2><span class="n">04</span> Patient &amp; INR</h2>
    <div class="bd">
      <div class="grid">
        <label class="fld"><span>INR today</span><input id="inr" type="number" min="0.8" max="25" step="0.1" inputmode="decimal"></label>
        <label class="fld"><span>Previous INR</span><input id="inrPrev" type="number" min="0.8" max="25" step="0.1" inputmode="decimal"></label>
        <label class="fld"><span>Days between INRs</span><input id="inrGap" type="number" min="1" max="60" step="1" inputmode="numeric" placeholder="e.g. 1"></label>
        <label class="fld"><span>Age (y)</span><input id="age" type="number" min="15" max="110" inputmode="numeric"></label>
        <div class="fld"><span>Sex</span><div class="seg"><label><input type="radio" name="sex" value="M" checked><span>M</span></label><label><input type="radio" name="sex" value="F"><span>F</span></label></div></div>
        <label class="fld"><span>Weight (kg)</span><input id="wt" type="number" min="25" max="250" step="0.1" inputmode="decimal"></label>
        <div class="fld"><span>Creatinine</span><div class="dual"><input id="cr" type="number" min="0.1" step="0.01" inputmode="decimal"><select id="crUnit"><option value="mg">mg/dL</option><option value="umol">µmol/L</option></select></div></div>
        <label class="fld"><span>Hb (g/dL)</span><input id="hb" type="number" min="2" max="22" step="0.1" inputmode="decimal"></label>
        <label class="fld"><span>Platelets (×10³)</span><input id="plt" type="number" min="1" max="1500" inputmode="numeric"></label>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:8px">
        <label class="fld"><span>Indication</span><select id="ind">
          <option value="af">Atrial fibrillation (incl. bioprosthetic)</option>
          <option value="ms">AF + moderate–severe rheumatic MS</option>
          <option value="vte">VTE (DVT / PE)</option>
          <option value="mav">Mechanical AVR — bileaflet, no risk factor</option>
          <option value="mavr">Mechanical AVR + risk factor / older valve</option>
          <option value="mmv">Mechanical mitral (or tricuspid) valve</option>
          <option value="onx">On-X AVR (&gt;3 mo, with aspirin)</option>
          <option value="lvt">LV thrombus</option>
          <option value="aps">Antiphospholipid syndrome</option>
          <option value="oth">Other</option>
        </select></label>
        <label class="fld"><span>Target INR</span><select id="tgt">
          <option value="auto">Auto (by indication)</option>
          <option value="2-3">2.0 – 3.0</option>
          <option value="2.5-3.5">2.5 – 3.5</option>
          <option value="1.5-2">1.5 – 2.0</option>
          <option value="1.8-2.5">1.8 – 2.5 (elderly Asian, local practice)</option>
        </select></label>
      </div>
      <div class="lbl">INR context</div>
      <div class="cks">
        <label class="ck"><input type="checkbox" id="stable"><span>Previously stable (≥3 INRs in range, same dose)</span></label>

function dayIdx(t){
  t=t.toLowerCase();
  const m={mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6};
  if(m[t.slice(0,3)]!=null) return [m[t.slice(0,3)]];
  if(t.startsWith('weekday')) return [0,1,2,3,4];
  if(t.startsWith('weekend')) return [5,6];
  const th=['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];
  for(let i=0;i<7;i++) if(t.startsWith(th[i])) return [i];

function qtyVal(s){
  s=s.trim().toLowerCase();
  let m;
  if(/^(½|1\/2|half|ครึ่ง)$/.test(s)) return 0.5;
  if((m=s.match(/^(\d+)\s*(?:½|1\/2)$/))) return +m[1]+0.5;
  if((m=s.match(/^(\d+(?:\.\d+)?)\s*(?:¼|1\/4)$/))) return +m[1]+0.25;
  if(/^(¼|1\/4)$/.test(s)) return 0.25;

function warfSegments(text){
  const lines=text.split(/\r?\n/), segs=[];
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/\b(warfarin|orfarin|coumadin|marevan|maforan)\b/i);
    if(!m) continue;
    let seg=lines[i].slice(m.index);
    for(let j=i+1;j<lines.length;j++){
      if(/^\s*([-•*]\s*)?(\d|½|mon|tue|wed|thu|fri|sat|sun|จันทร์|อังคาร|พุธ|พฤหัส|ศุกร์|เสาร์|อาทิตย์|weekday|weekend|except|then|and)/i.test(lines[j])) seg+=' '+lines[j];

    const cut=seg.search(/\bINR\b|\.\s+(?=[A-Z])/);

function parseSeg(seg){

      const gap=seg.slice(prev.end,d.pos);
      if(/^\s*(-|–|—|to|ถึง)\s*$/i.test(gap)){const a=prev.last,b=d.idx[0];if(a!=null&&b!=null){for(let k=a+1;k!==((b+1)%7);k=(k+1)%7)prev.days.add(k);prev.days.add(b);}prev.end=d.end;prev.last=d.idx[d.idx.length-1];continue;}
      if(/^[\s,&/+.]*(and|และ|,|&|\/|\+)?[\s,&/+.]*$/i.test(gap)){d.idx.forEach(i=>prev.days.add(i));prev.end=d.end;prev.last=d.idx[d.idx.length-1];continue;}
    }
    G.push({pos:d.pos,end:d.end,days:new Set(d.idx),last:d.idx[d.idx.length-1]});
  }
  Q.forEach(q=>{q.days=null;});
  if(G.length){
    const daysBefore=G[0].pos<Q[0].pos;
    if(daysBefore){ G.forEach(g=>{const q=Q.find(q=>q.pos>g.pos);if(q)q.days=new Set([...(q.days||[]),...g.days]);}); }
    else { G.forEach(g=>{let q=null;for(const x of Q) if(x.pos<g.pos) q=x; if(q) q.days=new Set([...(q.days||[]),...g.days]);}); }
  }

  Q.forEach((q,i)=>{const nxt=i+1<Q.length?Q[i+1].pos:seg.length;const t=seg.slice(q.end,nxt);const c=t.match(/[x×]?\s*(\d)\s*(?:days?|d)\s*(?:\/|per|a|ต่อ)\s*(?:wk|week|สัปดาห์)/i);if(c&&!q.days)q.count=+c[1];});
  const out=Array(7).fill(null);
  Q.forEach(q=>{if(q.days)q.days.forEach(d=>{out[d]=q.mg;});});
  Q.forEach(q=>{if(!q.days&&q.count){let n=q.count;for(let d=0;d<7&&n>0;d++)if(out[d]==null){out[d]=q.mg;n--;}}});
  const fill=Q.find(q=>!q.days&&!q.count);
  if(fill) for(let d=0;d<7;d++) if(out[d]==null) out[d]=fill.mg;
  if(out.some(v=>v==null)) return {err:'days',partial:out};
  return {days:out,strength,seg};
}

function crcl(){

function band(inr,lo,hi){
