const BAND_LBL={vlow:'Well below range',low:'Slightly below range',in:'In range',h1:'Slightly above range',h2:'Above range',h3:'INR 5 – 9.9',crit:'INR ≥ 10'};

/* ---------- tablet schedule ---------- */
function tabletOptions(){
  const st=[...$('tabs').querySelectorAll('input[type=checkbox]:checked')].filter(e=>e.id!=='halves').map(e=>+e.value).sort((a,b)=>a-b);
  const halves=$('halves').checked;
  const pcs=[];st.forEach(s=>{pcs.push({mg:s,s,f:1});if(halves)pcs.push({mg:s/2,s,f:.5});});
  const best=new Map();
  const add=combo=>{
    const mg=r2(combo.reduce((a,p)=>a+p.mg,0));
    const parts={};combo.forEach(p=>parts[p.s]=(parts[p.s]||0)+p.f);
    const k=Object.keys(parts).length; if(k>2) return;
    const h=combo.filter(p=>p.f<1).length;
    const cost=combo.length+0.3*h+0.5*(k-1);
    const cur=best.get(mg); if(!cur||cost<cur.cost) best.set(mg,{mg,parts,cost,n:combo.length,h});
  };
  for(let i=0;i<pcs.length;i++){add([pcs[i]]);for(let j=i;j<pcs.length;j++){add([pcs[i],pcs[j]]);for(let k=j;k<pcs.length;k++)add([pcs[i],pcs[j],pcs[k]]);}}
  return {opts:[...best.values()].filter(o=>o.mg<=20).sort((a,b)=>a.mg-b.mg),st,halves};
}
const tabTxt=o=>{if(!o||o.mg===0)return 'no dose';return Object.keys(o.parts).sort((a,b)=>b-a).map(s=>{const c=o.parts[s];const w=Math.floor(c),h=c-w>0;return (w?w:'')+(h?'½':'')+' × '+s+' mg';}).join(' + ');};
function buildSchedule(W,simple){
  const {opts}=tabletOptions(); if(!opts.length||!(W>0)) return null;
  const mean=W/7; let best=null;
  const consider=(a,b,k,allowZero)=>{
    if(!allowZero&&(a.mg===0)) return;
    const tot=b?k*b.mg+(7-k)*a.mg:7*a.mg;
    const err=Math.abs(tot-W)/W;
    const spread=b?(b.mg-a.mg)/mean:0;
    const pieces=b?(k*b.n+(7-k)*a.n)/7:a.n;
    const halves=b?(k*b.h+(7-k)*a.h)/7:a.h;
    const mx=o=>Object.keys(o.parts).length>1?1:0, mix=b?(k*mx(b)+(7-k)*mx(a))/7:mx(a);
    const cost=simple?err*100+(b?0.6:0)+spread*0.5+pieces*0.8+halves*0.6+mix*0.8:err*100+(b?0.6:0)+spread*1.5+pieces*0.15+halves*0.1;
    if(!best||cost<best.cost) best={a,b,k,tot,err,cost};
  };
  const all=[{mg:0,parts:{},n:0,h:0},...opts];
  for(const az of [false,true]){
    for(let i=0;i<all.length;i++){consider(all[i],null,7,az);for(let j=i+1;j<all.length;j++)for(let k=1;k<=6;k++)consider(all[i],all[j],k,az);}
    if(best&&best.err<=0.05) break;
  }
  if(!best) return null;
  const days=Array(7).fill(best.a);
  if(best.b){
    const minority=best.k<=3?best.b:best.a, majority=best.k<=3?best.a:best.b, m=best.k<=3?best.k:7-best.k;
    days.fill(majority);
    const pos=m===1?[2]:m===2?[0,3]:Array.from({length:m},(_,i)=>Math.round(i*7/m));
    pos.forEach(p=>days[p]=minority);
    best.alt=minority;
  }
  return {days,total:best.tot,err:best.err,alt:best.alt};
}
function schedHtml(s,holdN){
  if(!s) return '<div class="hint w">Choose at least one tablet strength in 03 to build a schedule.</div>';
  const td=todayIdx();
  let h='<div class="sched">'+s.days.map((o,i)=>`<div class="d${s.alt&&o===s.alt?' alt':''}"><div class="n">${DAYS[i]}${i===td?' · today':''}</div><div class="mg">${fmt(o.mg)}<small style="font-size:11px;color:var(--ink-3)"> mg</small></div><div class="tb">${tabTxt(o)}</div></div>`).join('')+'</div>';
  h+=`<div class="hint">Weekly total <b>${fmt(s.total)} mg</b>${s.err>0.005?` (${s.err*100<0.5?'≈':''}${(s.err*100).toFixed(1)}% from the calculated dose — nearest achievable with the tablets in stock)`:''}. Shaded days carry the odd dose; keep them on fixed weekdays.</div>`;
  return h;
}

/* ---------- maintenance logic (CHEST 2012 · ASH 2018 · Thai HA nomogram) ---------- */
function maintPlan(inr,tg,ctx){
  const b=band(inr,tg.lo,tg.hi), P={band:b,notes:[],refs:[]};
  const hiBleed=ctx.bleedRf.size>0||(ctx.age!=null&&ctx.age>=75);
  const mild=ctx.stable||ctx.missed||ctx.transient;

      if(!ctx.missed) P.notes.push('Optional one-off booster today: 1.5–2× the usual daily dose (Thai HA / common nomograms), then the new weekly dose.');
      if(isValve()||ctx.tehi) P.notes.push('High thrombotic-risk indication with sub-therapeutic INR: consider LMWH cover until INR is back in range (individualise).');

      break;
    case 'in':

    case 'h1':

      break;
    case 'h2':

    case 'h3':

      P.vitK=hiBleed?{st:'cons',v:'Consider 1–2.5 mg PO',s:'High bleeding risk present. Routine vitamin K not advised for INR 4.5–10 without bleeding (CHEST 2012 2B; ASH 2018)'}:{st:'no',v:'Not routinely',s:'INR 4.5–10 without bleeding: hold only — vitamin K does not reduce bleeding (CHEST 2012 2B; ASH 2018)'};

/* INR trajectory: UW Health inpatient rule + restart-after-interruption context. Each line carries its source. */
const SRC=(...n)=>n.map(x=>`<span class="srcl">${x}</span>`).join('');
function trendAdjust(P,c,tg,b,cw){
  const R={notes:[],flags:[],next:null,nextS:''};
  const delta=(c.inrPrev!=null&&c.inr!=null)?r1(c.inr-c.inrPrev):null;
  const gap=c.inrGap;
  const rate=(delta!=null&&gap)?r2(delta/gap):null;
  const below=['vlow','low'].includes(b);
  const perDay=cw?fmt(r2(cw.total/7))+' mg/day':'the current dose';
  const dropBoost=()=>{P.notes=P.notes.filter(n=>!/booster/i.test(n));};
  const ipd=c.setting==='ipd';

  // 1. UW Health inpatient rule of thumb: rise > 0.5 → consider decreasing; rise ≥ 1 → consider holding one dose
  if(rate!=null&&delta>0){
    const span=gap===1?'in 1 day':`over ${gap} days (≈ +${fmt(rate)}/day)`;
    const extrap=gap>1?' The rule is applied to consecutive inpatient INRs; with INRs '+gap+' days apart the average daily rise is used — the rise may have been uneven.':'';
    if(rate>=1){
      R.flags.push(`INR ${fmt(c.inrPrev)} → ${fmt(c.inr)} (+${fmt(delta)}) ${span}: rise ≥ 1 → consider holding one dose.${extrap} ${SRC('UW Health 2021')}`);
      if(!['h3','crit'].includes(b)){P.hold=Math.max(P.hold||0,1);P.pct=Math.min(P.pct,below?0:-10);P.warf={st:'hold',v:'Hold 1 dose',s:'INR rose ≥ 1/day (UW Health 2021) — then resume '+(below?'at the same dose':'about 10% lower (Thai HA 5–20% step)')};dropBoost();}
      R.next=ipd?'Daily':'1–2 days';R.nextS='Rapid INR rise';
    } else if(rate>0.5){
      R.flags.push(`INR ${fmt(c.inrPrev)} → ${fmt(c.inr)} (+${fmt(delta)}) ${span}: rise > 0.5 → consider decreasing the dose.${extrap} ${SRC('UW Health 2021')}`);
      if(below){if(P.pct>0)P.pct=0;P.hold=0;P.warf={st:'no',v:'Do not increase',s:'Below range but rising > 0.5/day — keep the dose (or reduce slightly); it will reach range on its own (UW Health 2021)'};dropBoost();}
      else if(!['h2','h3','crit'].includes(b)){P.pct=Math.min(P.pct,-10);P.hold=P.hold||0;P.warf={st:'no',v:'Reduce ~10%',s:'Rising > 0.5/day (UW Health 2021); change within the 5–20% weekly step (Thai HA 2010)'};}
      R.next=ipd?'Daily':'2–3 days';R.nextS='Rising INR';
    }
  } else if(delta!=null&&delta>=0.5&&gap==null){
    R.notes.push(`INR +${fmt(delta)} since the previous value — enter <b>days between INRs</b> (04) to apply the inpatient rule: rise > 0.5/day → reduce, ≥ 1/day → hold one dose. ${SRC('UW Health 2021')}`);
  }

  // 2. Restart after interruption
  if(c.restart){
    const d=c.rsDays;
    const uwActed=rate!=null&&rate>0.5;
    if(d!=null&&d>=7) R.notes.push(`≥ 7 days since restart — approaching steady state; the usual nomogram applies. ${SRC('Thai HA 2010 p.12')}`);
    else{
      R.flags.push(`Day ${d!=null?d:'?'} after restart — not at steady state. Factor VII (t½ ≈ 6 h) falls first, factor II (t½ ≈ 60 h) later; full effect takes 7–10 days after starting or changing the dose, so the INR usually keeps rising on the same dose. ${SRC('Thai HA 2010 p.12')}`);
      if(!uwActed&&delta!=null&&delta>=0.5){
        R.flags.push(`Early rise ${fmt(c.inrPrev)} → ${fmt(c.inr)} (+${fmt(delta)}) on only ${perDay}. Restarted on the usual maintenance dose, only ~13% reach INR ≥ 2 by day 5 — a faster response marks a sensitive patient. ${SRC('Schulman 2014 RCT')}`);
        if(below||b==='in'){P.pct=Math.min(P.pct,0);if(P.pct===0){P.hold=0;P.warf={st:'no',v:'Continue — do not increase',s:'Keep the same daily dose; the INR will keep rising toward steady state'};}dropBoost();}
        R.notes.push(`Initiation nomograms cut the dose when range is reached early (day-3 INR 2.0–3.0 → 0–2.5 mg after a 5-mg start). ${SRC('Crowther 1999')}`);
        R.notes.push(`Adjusting the dose too fast (up or down) is listed as a common warfarin error. ${SRC('Thai HA 2010 p.23')}`);
        if(!R.next){R.next=ipd?'Daily':'2–3 days';R.nextS='INR still rising early after restart';}
      } else if(!uwActed&&below&&d!=null&&d<5){
        P.pct=0;P.hold=0;P.warf={st:'no',v:'Continue',s:`Day ${d} is too early to judge a low INR — keep the dose, recheck in 2–3 days`};dropBoost();
        R.notes.push(`Restarted on the usual dose, ~13% reach INR ≥ 2 by day 5 and ~68% by day 10 — a low INR this early is expected. ${SRC('Schulman 2014 RCT')}`);
        if(!R.next){R.next=ipd?'Daily':'2–3 days';}
      }
    }
    R.notes.push(`About one-third of patients respond differently after surgery (13.5% more sensitive, 18.5% more resistant); starting amiodarone post-op predicts sensitivity. ${SRC('Schulman 2008')}`);
    if(c.preW&&cw){
      const less=1-cw.total/c.preW;
      if(less>=0.25&&!below) R.notes.push(`INR ${fmt(c.inr)} on ${fmt(cw.total)} mg/wk vs the usual ${fmt(c.preW)} mg/wk (${Math.round(less*100)}% less) — post-operative sensitivity (poor intake/low vitamin K, antibiotics, low albumin, hepatic congestion). Don't jump back to the pre-op dose; the requirement usually climbs again as eating recovers — recheck INR within 1 week of discharge. ${SRC('Teaching note')}`);
      else if(less>=0.25) R.notes.push(`Restarted below the usual ${fmt(c.preW)} mg/wk. Warfarin is resumed 12–24 h after the procedure if there is no bleeding (CHEST: at the usual dose); a lower restart is reasonable with poor intake or interacting antibiotics. ${SRC('Thai HA 2010 p.29','CHEST 2022')}`);
    }
  }
  return R;
}
function drugAdjust(inrPct){
  const nw=[],stopped=[];
  for(const id in ixState){const d=IX.find(x=>x.id===id);if(ixState[id]==='new')nw.push(d);else if(ixState[id]==='stopped')stopped.push(d);}
  const active=nw.filter(d=>d.pct);
  let dp=active.reduce((f,d)=>f*(1+d.pct/100),1)-1;
  let total,how;
  if(!active.length){total=inrPct;how='';}
  else if(dp<0&&inrPct<0){total=Math.min(dp,inrPct);how='INR already rising — the larger reduction is used (not stacked)';}
  else if(dp>0&&inrPct>0){total=Math.max(dp,inrPct);how='INR already falling — the larger increase is used (not stacked)';}
  else {total=(1+inrPct)*(1+dp)-1;how='INR-based change × empiric drug adjustment';}
  return {nw,active,stopped,dp,total,how};
}

      if(c.inr==null) h+=`<div class="hint w">Enter today's INR (04) to read the nomogram.</div>`;
      else{
        const rows=NOMO[day];const row=rows.find(r=>r1(c.inr)<r[0]);
        const lo=row[2]*sc,hi=row[3]*sc;
        dose=roundHalf(sensitive?lo+(hi-lo)*0.25:(lo+hi)/2);rangeTxt=lo===hi?`${fmt(roundHalf(lo))} mg`:`${fmt(roundHalf(lo))}–${fmt(roundHalf(hi))} mg`;
        if(r1(c.inr)>=5){const mp=maintPlan(c.inr,tg,c);acts.vitK=mp.vitK;}
      }
    }
    if(day<7){
      acts.warf=dose==null?{st:'cons',v:'Awaiting INR',s:''}:dose===0?{st:'hold',v:'Hold tonight',s:'INR above nomogram threshold'}:{st:'no',v:`Give ${fmt(dose)} mg tonight`,s:`Day ${day} · nomogram range ${rangeTxt}`};
      tiles.push(tile('Dose tonight',dose==null?'—':fmt(dose)+'<small> mg</small>',`day ${day} · start ${sd.d} mg (${sd.why})`,dose===0?'warn':''));
      tiles.push(tile('Next INR',c.setting==='ipd'?'Daily':(day<3?'Day 3–5':'2–3 days'),c.setting==='ipd'?'until in range ×2':'then weekly until stable (Thai HA)'));
      const rows=day>=2&&day<=6?NOMO[day]:null;
      h+=`<div class="verdict">Day ${day}: give <b>${dose==null?'—':fmt(dose)+' mg'}</b> tonight${sc!==1?` <span class="muted">(Crowther 5-mg nomogram scaled ×${fmt(sc)} to a ${sd.d}-mg start)</span>`:''}</div>`;
      h+=`<div class="tblwrap"><table class="dose"><thead><tr><th>Day</th><th>INR</th><th>Dose (5-mg nomogram)</th>${sc!==1?`<th>Scaled to ${sd.d} mg start</th>`:''}</tr></thead><tbody>`;
      h+=`<tr${day===1?' class="pick"':''}><td>1</td><td>—</td><td class="d">5 mg</td>${sc!==1?`<td class="d">${sd.d} mg</td>`:''}</tr>`;
      for(let d=2;d<=6;d++) NOMO[d].forEach((r,i)=>{const pick=d===day&&c.inr!=null&&NOMO[d].find(x=>r1(c.inr)<x[0])===r;h+=`<tr${pick?' class="pick"':''}><td>${i===0?d:''}</td><td>${r[1]}</td><td class="d">${r[2]===r[3]?fmt(r[2]):fmt(r[2])+'–'+fmt(r[3])} mg</td>${sc!==1?`<td class="d">${r[2]===r[3]?fmt(roundHalf(r[2]*sc)):fmt(roundHalf(r[2]*sc))+'–'+fmt(roundHalf(r[3]*sc))} mg</td>`:''}</tr>`;});
      h+=`</tbody></table></div><div class="hint">Day 7 onward: enter the past week's doses in 03 — the plan switches to the maintenance nomogram. ${sensitive?'Sensitivity factor / low start → lower part of each range used.':'Mid-range used.'}</div>`;
    }
    h+=`<h4>Starting rules</h4><ul class="it">`;
    h+=li('dot',`Start ${sd.d} mg/day (${sd.why}). Thai HA: 3–5 mg/day; ≤ 3 mg if elderly, low weight, liver disease, HF, malnourished, interacting drugs. CHEST 2012: 10 mg ×2 days acceptable only for healthy outpatients with VTE (not typical in Thai/Asian patients).`);
    const ind=$('ind').value;
    if(ind==='vte') h+=li('I','Overlap with parenteral anticoagulant (LMWH / UFH / fondaparinux) for ≥ 5 days AND until INR ≥ 2.0 for ≥ 24 h','CHEST 2012 · ASH 2018');
    else if(isValve()) h+=li('I','Mechanical valve: UFH/LMWH until INR in target range (early post-op or interruption) — ACC/AHA 2020 VHD','');
    else if(ind==='af'||ind==='ms') h+=li('dot','AF: no parenteral bridge needed when starting warfarin (unless recent stroke/LA thrombus — individualise).');
    h+=li('dot','The INR of days 1–3 reflects factor VII fall, not full anticoagulation — avoid escalating aggressively; a rise ≥ 2 by day 3 predicts a low maintenance dose (≤ 3 mg/day).');
    if(c.inr!=null&&day<=3&&r1(c.inr)>=2) h+=li('flag','INR already ≥ 2 by day '+day+' — highly sensitive patient; expect maintenance ≈ 1.5–3 mg/day.');
    h+=li('dot',c.setting==='ipd'?'IPD: INR daily; discharge when stable plan in place, INR within 3–5 days of discharge.':'OPD: INR on day 3–5, then every 3–7 days until 2 consecutive INRs in range, then every 1–4 weeks.');
    h+='</ul>';
    body=sec('r','I','Initiation','Crowther 5-mg nomogram (Arch Intern Med 1999) · Thai HA · CHEST 2012',h)+body;
    note.push(`Initiation day ${day}: start ${sd.d} mg; tonight ${dose==null?'—':fmt(dose)+' mg'}.`);
  }

  /* ===== BLEEDING ===== */
  if(c.sit==='bleed'){
    let sev=rv('bsev');const mc=cks('majc');
    let up='';
    if(sev==='minor'&&mc.size){sev='major';up=' (upgraded — major-bleed criterion ticked)';}
    const wt=c.wt, inr=c.inr, av=cks('avail');
    const ich=sev==='ich', major=sev==='major'||ich;
    let h='';
    if(sev==='none'){h+=`<div class="verdict none">No bleeding selected — supratherapeutic-INR management is shown below in Dose adjustment.</div>`;}
    else if(!major){
      const supra=inr!=null&&r1(inr)>tg.hi;
      acts.warf={st:'hold',v:'Hold 1–2 doses',s:supra?'Resume at a reduced dose once INR in range and bleeding settled':'Resume when bleeding controlled'};
      acts.vitK=inr!=null&&r1(inr)>=4.5?{st:'give',v:'1–2.5 mg PO',s:'Non-major bleed with INR ≥ 4.5 (IV 0.5–1 mg slow if cannot take PO)'}:{st:'no',v:'Not needed',s:'INR < 4.5 — local measures, hold dose'};
      acts.pcc={st:'no',v:'No',s:'Reversal agents are not used for non-major bleeding (ACC 2020)'};
      acts.ffp={st:'no',v:'No',s:'Not for non-major bleeding'};
      h+=`<div class="verdict">Non-major bleed${up} — local haemostasis, hold warfarin, look for the source.</div><ul class="it">`;
      h+=li('dot','Local measures: pressure, packing (epistaxis), tranexamic acid mouthwash (oral), topical haemostatics.');
      h+=li('dot','Bleeding at a therapeutic INR (GI, haematuria) — investigate for an underlying lesion.');
      h+=li('dot','Review contributors: antiplatelets/NSAIDs, interacting drugs, labile INR (consider DOAC if no mechanical valve / moderate–severe MS).');
      h+=li('dot',`Recheck INR ${c.setting==='ipd'?'in 24 h':'in 2–3 days'}; restart once bleeding has stopped${supra?' at a 10–15% lower weekly dose':''}.`);
      h+='</ul>';
      tiles.push(tile('Severity','Non-major','ACC 2020 ECDP','warn'));
      tiles.push(tile('Next INR',c.setting==='ipd'?'24 h':'2–3 days',''));
    } else {
      const thr=ich?1.3:1.5;
      const pd=pccDose(inr,wt), fv=ffpVol(wt);
      acts.warf={st:'give',v:'STOP warfarin',s:'Stop now; resumption decided after haemostasis (see below)'};
      acts.vitK={st:'give',v:ich?'10 mg IV':'5–10 mg IV',s:'Slow IV over 20–30 min (anaphylactoid risk). Effect starts 2–6 h, full at 12–24 h; sustains PCC effect. Repeat q12h if INR rebounds'};
      let pccTxt='', pccState='give';
      if(inr==null){acts.pcc={st:'cons',v:'Check INR stat',s:'Do not delay if life-threatening: fixed dose 1000 IU (1500 IU for ICH)'};}
      else if(r1(inr)>=2){
        acts.pcc={st:'give',v:pd?`${pd.iu} IU 4F-PCC`:'4F-PCC',s:pd?`${pd.iuKg} IU/kg × ${fmt(Math.min(wt,100))} kg (max ${pd.cap}) — or fixed ${ich?1500:1000} IU (ACC 2020). Recheck INR 15–60 min after`:'Enter weight for INR-based dose; fixed '+(ich?1500:1000)+' IU (ACC 2020)'};
      } else if(r1(inr)>=thr){
        acts.pcc={st:'cons',v:`Consider ${ich?1500:1000} IU`,s:`INR ${fmt(inr)} (${fmt(thr)}–1.9): fixed low-dose 4F-PCC ${ich?'may be reasonable (AHA/ASA 2022)':'per clinical judgement'} — limited data`};
      } else {acts.pcc={st:'no',v:'Not needed',s:`INR < ${fmt(thr)} — anticoagulant effect minimal; supportive care`};acts.vitK={st:'cons',v:'Optional',s:'INR already near normal'};}
      if(!av.has('pcc4')&&acts.pcc.st!=='no'){
        acts.pcc=av.has('pcc3')?{st:acts.pcc.st,v:'3F-PCC 25–50 IU/kg',s:`4F-PCC unavailable: 3F-PCC${wt?` (${Math.round(25*Math.min(wt,100))}–${Math.round(50*Math.min(wt,100))} IU)`:''} + FFP for factor VII — limited evidence`}:{st:'no',v:'Unavailable',s:'No PCC in stock → FFP (see next card)'};
      }
      const needFfp=acts.pcc.st!=='no'||inr==null;
      if(!av.has('pcc4')&&needFfp&&av.has('ffp')){
        acts.ffp={st:'give',v:fv?(av.has('pcc3')?'FFP 2–3 units':`${fv.a}–${fv.b} mL`):'10–15 mL/kg',s:av.has('pcc3')?'With 3F-PCC to replace factor VII':`10–15 mL/kg${fv?` ≈ ${fv.ua}–${fv.ub} units`:''}. Thaw time ~30–45 min; watch volume overload; cannot correct INR below ~1.5`};
      } else if(needFfp&&av.has('pcc4')){
        acts.ffp={st:'no',v:'Only if no PCC',s:`4F-PCC preferred over plasma (CHEST 2012, ACC 2020, AHA/ASA 2022): faster, no volume load${fv?`. Fallback: ${fv.a}–${fv.b} mL (10–15 mL/kg)`:''}`};
      } else if(needFfp&&!av.has('ffp')) acts.ffp={st:'cons',v:'Not available',s:'Arrange transfer / blood bank'};
      h+=`<div class="verdict bad">${ich?'Intracranial / life-threatening':'Major'} bleeding${up} — stop warfarin and reverse${inr!=null&&r1(inr)<thr?' (INR already near-normal: reversal agents not needed)':''}.</div><ul class="it">`;
      h+=li('I','Stop warfarin; resuscitate (2 large-bore IV, crossmatch, PRC to Hb ≥ 7 g/dL — ≥ 8 if ACS); identify & control source (endoscopy / IR / surgery).','ACC 2020 ECDP');
      h+=li('I',`Vitamin K ${ich?'10':'5–10'} mg IV slowly${isValve()?' — still give in life-threatening bleed; for non-life-threatening use the lower dose to ease re-anticoagulation':''}.`,ich?'AHA/ASA 2022 ICH (COR 1)':'ACC 2020 · CHEST 2012');
      if(inr!=null&&r1(inr)>=thr) h+=li('I',`4F-PCC preferred over FFP${ich&&r1(inr)>=2?' (AHA/ASA 2022 COR 1 for INR ≥ 2)':''}. Dose: ${pd&&r1(inr)>=2?`<b>${pd.iu} IU</b> (${pd.iuKg} IU/kg, INR ${r1(inr)<4?'2–3.9':r1(inr)<=6?'4–6':'> 6'})`:'—'} or fixed <b>${ich?1500:1000} IU</b>.`,'Label: INR 2–3.9 → 25 IU/kg (max 2500) · 4–6 → 35 (max 3500) · > 6 → 50 (max 5000); weight capped at 100 kg');
      h+=li('dot',`Recheck INR 15–60 min after PCC, then at 6–8 h and 24 h. Target INR ${ich?'< 1.3–1.4 (NCS/SCCM 2016)':'< 1.5'}. Repeat-dosing PCC is generally not recommended.`);
      h+=li('dot','Thrombotic risk after PCC ≈ 1–2% — plan early thromboprophylaxis / re-anticoagulation once haemostasis secure.');
      if(ich) h+=li('dot','ICH bundle: SBP 130–150 mmHg target, neurosurgical review, avoid platelet transfusion unless surgery/thrombocytopenia.');
      h+=`</ul><h4>When to restart</h4><ul class="it">`;
      if(ich) h+=li('IIb','After ICH: commonly 4–8 weeks (AF), individualised; mechanical valve earlier (≈ 1–2 weeks) with specialist input. Consider LAA occlusion if long-term OAC not resumable.','AHA/ASA 2022 · ACC 2020');
      else h+=li('IIa','After GI or other major bleed: restart once haemostasis secured, typically 7–14 days (earlier — ~3–7 days — for mechanical valve / very high TE risk).','ACC 2020 ECDP');
      h+=li('dot','Restart at the previous maintenance dose (or 10–20% less if INR was supratherapeutic); stop antiplatelet unless clearly indicated; add PPI after GI bleed.');
      h+='</ul>';
      tiles.push(tile('Severity',ich?'ICH / life-threat':'Major',up?'criterion ticked':'ACC 2020 ECDP','bad'));
      tiles.push(tile('4F-PCC',pd&&inr!=null&&r1(inr)>=2?pd.iu+'<small> IU</small>':(acts.pcc.st==='no'?'—':ich?'1500<small> IU</small>':'1000<small> IU</small>'),pd&&inr!=null&&r1(inr)>=2?`${pd.iuKg} IU/kg`:'fixed dose',acts.pcc.st==='give'?'bad':''));
    }
    body=sec('a','B','Bleeding management','ACC 2020 ECDP · AHA/ASA 2022 ICH · NCS/SCCM 2016 · CHEST 2012',h)+body;
    note.push(`Bleeding: ${sev}. Warfarin: ${acts.warf.v}. Vit K: ${acts.vitK.v}. PCC: ${acts.pcc.v}. FFP: ${acts.ffp.v}.`);
  }

  /* ===== PROCEDURE ===== */
  if(c.sit==='proc'){
    const urg=rv('urg'),pbr=rv('pbr'),nx=$('neurax').checked,inr=c.inr,wt=c.wt;
    const inrGoal=nx?'≤ 1.4':'< 1.5';
    const te=new Set(c.tehiSet); if($('ind').value==='mmv') te.add('mmv');
    const bridge=te.size>0;
    let h='';
    if(urg==='emerg'){
      const pd=pccDose(inr,wt), fv=ffpVol(wt);
      acts.warf={st:'give',v:'STOP warfarin',s:'Resume 12–24 h post-op when haemostasis secure'};
      acts.vitK={st:'give',v:'5–10 mg IV',s:'Slow IV; sustains correction after PCC'};
      acts.pcc=inr!=null&&r1(inr)<1.5?{st:'no',v:'Not needed',s:`INR ${fmt(inr)} already ${inrGoal}`}:{st:'give',v:pd&&inr!=null&&r1(inr)>=2?`${pd.iu} IU 4F-PCC`:'4F-PCC',s:pd&&inr!=null&&r1(inr)>=2?`${pd.iuKg} IU/kg; recheck INR before incision`:'Dose by INR/weight (25–50 IU/kg) or fixed 1000 IU'};
      acts.ffp=acts.pcc.st==='no'?{st:'no',v:'Not needed',s:''}:{st:'cons',v:'Only if no PCC',s:fv?`${fv.a}–${fv.b} mL (10–15 mL/kg)`:'10–15 mL/kg'};
      h+=`<div class="verdict bad">Emergency surgery (&lt; 6–12 h): reverse now — vitamin K IV + 4F-PCC; target INR ${inrGoal} before incision.</div>`;
      tiles.push(tile('Target INR pre-op',inrGoal,'recheck after PCC','bad'));
    } else if(urg==='urgent'){
      acts.warf={st:'hold',v:'Hold warfarin',s:'From now until after the procedure'};
      acts.vitK={st:'give',v:'1–2.5 mg IV',s:`Or 2.5–5 mg PO. Recheck INR at 12–24 h; repeat dose if INR still > ${nx?'1.4':'1.5'}`};
      acts.pcc={st:'no',v:'Not usually',s:'Only if INR still high when surgery cannot wait'};
      acts.ffp={st:'no',v:'Not usually',s:'Plasma only if no PCC and immediate correction needed'};
      h+=`<div class="verdict">Urgent (24–48 h): hold warfarin + low-dose vitamin K; recheck INR 12–24 h before theatre (goal ${inrGoal}).</div>`;
      tiles.push(tile('Target INR pre-op',inrGoal,'recheck at 12–24 h','warn'));
    } else if(pbr==='min'){
      acts.warf={st:'no',v:'Continue',s:'Do not interrupt for minimal-bleed procedures (CHEST 2022)'};
      acts.vitK={st:'no',v:'No',s:''};acts.pcc={st:'no',v:'No',s:''};acts.ffp={st:'no',v:'No',s:''};
      h+=`<div class="verdict">Minimal-bleed procedure — <b>continue warfarin</b>; check INR within the week before (≤ upper target).</div><ul class="it">`;
      h+=li('IIa','Dental: continue warfarin + tranexamic acid mouthwash (or 2–3 day stop); cataract, minor skin: continue.','CHEST 2022');
      h+=li('IIa','Pacemaker / ICD implant: continue warfarin — less pocket haematoma than heparin bridging (BRUISE CONTROL).','CHEST 2022');
      h+=li('dot','If INR above range on the day: defer or reduce per maintenance nomogram.');
      h+='</ul>';
      tiles.push(tile('Warfarin','Continue','minimal bleed risk','good'));
    } else {
      // elective, interrupt
      const cc=c.crcl, enoxMg=wt?Math.round(wt/10)*10:null, q24=cc!=null&&cc<30;
      acts.warf={st:'hold',v:'Stop 5 days before',s:'Last dose on day −6; resume 12–24 h post-op at usual dose'};
      acts.vitK={st:'cons',v:'If INR > 1.5 on day −1',s:'Vitamin K 1–2 mg PO, recheck morning of surgery'};
      acts.pcc={st:'no',v:'No',s:'Elective — not indicated'};acts.ffp={st:'no',v:'No',s:'Elective — not indicated'};
      const pd=num('pdays');
      const dt=k=>{if(pd==null)return '';const d=new Date();d.setDate(d.getDate()+pd+k);return ` <span class="muted">${DAYS[(d.getDay()+6)%7]} ${d.getDate()}/${d.getMonth()+1}</span>`;};
      h+=`<div class="verdict">Elective, ${pbr==='high'?'high':'low–moderate'}-bleed procedure — stop warfarin 5 days before. Bridging: <b>${bridge?'consider (high thrombotic risk)':'not recommended'}</b>.</div>`;
      h+=`<div class="tblwrap"><table class="dose"><thead><tr><th>Day</th><th>Warfarin</th>${bridge?'<th>Bridge (enoxaparin)</th>':''}</tr></thead><tbody>`;
      const ex=enoxMg?`${enoxMg} mg SC ${q24?'q24h':'q12h'}`:`1 mg/kg SC ${q24?'q24h':'q12h'}`;
      const rows=[
        ['−6','Last dose (evening)',bridge?'—':''],
        ['−5','No warfarin',bridge?'—':''],
        ['−4','No warfarin',bridge?'—':''],
        ['−3','No warfarin',bridge?`Start ${ex}`:''],
        ['−2','No warfarin',bridge?ex:''],
        ['−1',`No warfarin · <b>INR</b>: if > ${nx?'1.4':'1.5'} → vitamin K 1–2 mg PO`,bridge?`Last dose in the morning, ≥ 24 h pre-op: ${enoxMg?enoxMg+' mg':'1 mg/kg'} once (half daily dose)`:''],
        ['0',`Surgery (INR ${inrGoal}) · resume usual dose in the evening if haemostasis secure`,bridge?'No LMWH':''],
        ['+1','Usual dose',bridge?(pbr==='high'?'No LMWH (high bleed risk: start 48–72 h)':`Restart ${ex} (≥ 24 h post-op)`):''],
        ['+2–3','Usual dose',bridge?(pbr==='high'?`Restart ${ex} at 48–72 h`:'Continue'):''],
        ['+5–7','Usual dose · INR check',bridge?`Stop LMWH when INR in range${$('ind').value==='vte'?' (≥ 2.0 for 24 h)':''}`:'']
      ];
      rows.forEach(r=>{h+=`<tr${r[0]==='0'?' class="pick"':''}><td class="d">D${r[0]}${dt(r[0]==='+2–3'?2:r[0]==='+5–7'?5:+r[0].replace('−','-'))}</td><td>${r[1]}</td>${bridge?`<td>${r[2]}</td>`:""}</tr>`;});
      h+=`</tbody></table></div><ul class="it">`;
      h+=li('IIa','Stop warfarin ≥ 5 days before; resume 12–24 h after surgery at the usual dose (no loading).','CHEST 2022');
      if(bridge){
        h+=li('IIb',`High thrombotic-risk feature(s): ${[...te].map(x=>({mmv:'mechanical mitral',oldv:'old-generation / multiple valves',cva:'recent stroke/TIA',vte3:'VTE < 3 mo',thrphil:'severe thrombophilia',rhd:'rheumatic MS / CHA₂DS₂-VASc ≥ 7',prevte:'prior peri-interruption TE'}[x])).join(', ')} → bridging reasonable if bleeding risk acceptable.`,'ACC 2017 ECDP · ACC/AHA 2020 VHD (mitral / AVR + risk factor). CHEST 2022 suggests against routine bridging even for mechanical valves (conditional) — individualise.');
        h+=li('dot',`Enoxaparin ${ex}${q24?' (CrCl < 30)':''}${cc!=null?` — CrCl ${cc} mL/min`:''}. Alternative: IV UFH (aPTT-guided), stop 4–6 h pre-op — preferred if CrCl < 30 or very high bleed risk.`);
      } else {
        h+=li('I','No heparin bridging for AF (strong) or VTE > 3 months / bileaflet mechanical AVR without risk factors (conditional).','CHEST 2022 (BRIDGE, PERIOP2) · ACC 2017');
      }
      if(nx) h+=li('flag','Neuraxial / neurosurgery: INR ≤ 1.4 required; no LMWH within 24 h of needle (therapeutic dose) per ASRA.');
      h+=li('dot',c.setting==='ipd'?'IPD: INR on D−1 and morning of surgery; post-op INR daily until in range.':'OPD: give the patient this dated table; INR on D−1 at clinic/lab.');
      h+='</ul>';
      tiles.push(tile('Last warfarin','D−6'+(pd!=null?'':''),pd!=null?dt(-6).replace(/<[^>]+>/g,'').trim():'5 clear days before','warn'));
      tiles.push(tile('Bridging',bridge?'Consider':'No',bridge?'high thrombotic risk':'CHEST 2022',bridge?'bad':'good'));
    }
    body=sec('w','P','Peri-procedural plan','CHEST 2022 perioperative · ACC 2017 periprocedural ECDP · ACC 2020 ECDP',h)+body;
    note.push(`Procedure (${urg}, ${pbr} bleed risk): warfarin ${acts.warf.v}; vit K ${acts.vitK.v}; PCC ${acts.pcc.v}; bridging ${bridge?'consider':'no'}.`);
  }

  /* ===== interactions summary ===== */
  const ixIds=Object.keys(ixState);
  if(ixIds.length){
    let h='<div class="tblwrap"><table class="dose"><thead><tr><th>Drug</th><th>Effect</th><th>Action</th></tr></thead><tbody>';
    ixIds.forEach(id=>{const d=IX.find(x=>x.id===id),st=ixState[id];h+=`<tr${st==='new'?' class="pick"':st==='stopped'?' class="x"':''}><td>${esc(d.name)}<br><span class="muted" style="font-size:11.5px">${st==='new'?'starting now':st==='stopped'?'recently stopped':'chronic'}</span></td><td class="d">${d.eff==='up'?'↑ INR':d.eff==='down'?'↓ INR':d.eff==='mixed'?'± INR':'bleeding'}<br><span style="font-weight:500">${esc(d.rng)}</span></td><td>${esc(d.note)}</td></tr>`;});
    h+='</tbody></table></div>';
    body+=sec('e','X','Drug interactions',`${ixIds.length} found · empiric changes apply only to drugs marked “starting now”`,h);
  }

  /* ===== quick reference ===== */
  let q=`<div class="tblwrap"><table class="dose"><thead><tr><th>Situation</th><th>Warfarin</th><th>Vitamin K</th><th>PCC / FFP</th></tr></thead><tbody>
  <tr><td>INR above range, &lt; 5, no bleed</td><td>Hold 0–1 dose, ↓ 5–10%</td><td>No</td><td>No</td></tr>
  <tr><td>INR 5–9.9 (4.5–10), no bleed</td><td>Hold 1–2 doses, ↓ 10–20%</td><td>Not routine <sup class="r">1,2</sup>; 1–2.5 mg PO if high bleed risk</td><td>No</td></tr>
  <tr><td>INR ≥ 10, no bleed</td><td>Hold</td><td><b>2.5–5 mg PO</b> <sup class="r">1</sup></td><td>No</td></tr>
  <tr><td>Non-major bleed</td><td>Hold 1–2 doses</td><td>1–2.5 mg PO if INR ≥ 4.5</td><td>No <sup class="r">3</sup></td></tr>
  <tr><td>Major bleed</td><td><b>Stop</b></td><td><b>5–10 mg IV</b> slow</td><td><b>4F-PCC</b> by INR or 1000 IU fixed; FFP 10–15 mL/kg only if no PCC <sup class="r">3</sup></td></tr>
  <tr><td>ICH</td><td><b>Stop</b></td><td><b>10 mg IV</b></td><td><b>4F-PCC</b> if INR ≥ 2 (COR 1), consider if 1.3–1.9; fixed 1500 IU <sup class="r">4,3</sup></td></tr>
  <tr><td>Elective surgery</td><td>Stop 5 days before, resume 12–24 h after</td><td>1–2 mg PO if INR &gt; 1.5 on D−1</td><td>No <sup class="r">5</sup></td></tr>
  <tr><td>Urgent surgery 24–48 h</td><td>Hold</td><td>1–2.5 mg IV / 2.5–5 mg PO</td><td>Only if still high <sup class="r">6</sup></td></tr>
  <tr><td>Emergency surgery &lt; 6–12 h</td><td>Stop</td><td>5–10 mg IV</td><td>4F-PCC (FFP if unavailable) <sup class="r">6,3</sup></td></tr>
  </tbody></table></div>

function nmRange(k,tg){
  const f=x=>(Math.round(x*10)/10).toFixed(1),lo=tg.lo,hi=tg.hi;
  return {vlow:'< '+f(lo-0.5),low:f(lo-0.5)+'–'+f(lo-0.1),in:f(lo)+'–'+f(hi),h1:f(hi+0.1)+'–'+f(Math.min(hi+1,5)-0.1),h2:f(hi+1)+'–4.9',h3:'5.0–8.9',crit:'≥ 9.0',bleed:'Major bleeding'}[k];
}
function nmBounds(k,tg){const lo=tg.lo,hi=tg.hi;return {vlow:[Math.max(0.8,lo-1.2),lo-0.5],low:[lo-0.5,lo],in:[lo,hi],h1:[hi,Math.min(hi+1,5)],h2:[hi+1,5],h3:[5,9],crit:[9,12]}[k];}

/* TTR — Rosendaal linear interpolation */
const blankTtr=()=>[{d:'',v:''},{d:'',v:''},{d:'',v:''}];
let ttr=blankTtr();
const isoDay=off=>{const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dShort=ms=>new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const dLong=ms=>new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
function renderTtrRows(){
  $('ttRows').innerHTML=ttr.map((r,i)=>`<div class="tt-row"><span class="tt-n">${i+1}</span><input type="date" data-tt="d" data-i="${i}" value="${r.d}" aria-label="Date of INR ${i+1}"><input type="number" step="0.1" min="0.8" max="25" inputmode="decimal" data-tt="v" data-i="${i}" value="${r.v}" placeholder="INR" aria-label="INR ${i+1}"><button type="button" class="tt-x" data-tt-del="${i}" aria-label="Remove INR ${i+1}">×</button></div>`).join('');
}
function ttFrac(a,b,L,H){
  if(Math.abs(b-a)<1e-9) return a<L?[1,0,0]:a>H?[0,0,1]:[0,1,0];
  const mn=Math.min(a,b),mx=Math.max(a,b),len=mx-mn,cl=x=>Math.min(len,Math.max(0,x));
  const bl=cl(L-mn),ab=cl(mx-H);return [bl/len,(len-bl-ab)/len,ab/len];
}
function calcTTR(tg){
  const pts=ttr.map(r=>({t:r.d?Date.parse(r.d+'T00:00:00Z'):NaN,v:parseFloat(r.v)})).filter(p=>isFinite(p.t)&&isFinite(p.v)&&p.v>0).sort((a,b)=>a.t-b.t);
  const R={pts,tot:0,below:0,in:0,above:0,gaps:0,nIn:pts.filter(p=>p.v>=tg.lo&&p.v<=tg.hi).length};
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],d=(b.t-a.t)/864e5;
    if(d<=0) continue;
    if(d>56){R.gaps++;continue;}
    const f=ttFrac(a.v,b.v,tg.lo,tg.hi);R.tot+=d;R.below+=d*f[0];R.in+=d*f[1];R.above+=d*f[2];
  }
  return R;
}
function ttChart(pts,tg){
  const W=Math.max(300,Math.round(($('ttOut').clientWidth||520))),H=W<480?190:220,L=30,Rt=14,T=22,B=26;
  const t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(t1-t0,864e5);
  const ymax=Math.min(10,Math.max(4,Math.ceil(Math.max(...pts.map(p=>p.v))+0.4))),ymin=1;
  const PX=16,X=t=>L+PX+(t-t0)/span*(W-L-Rt-2*PX),Y=v=>T+(1-(Math.min(Math.max(v,ymin),ymax)-ymin)/(ymax-ymin))*(H-T-B);
  const tx='style="fill:var(--ink-3);font:500 11px var(--mono)"';
  let s=`<svg class="tt-chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="INR over time against the target range ${fmt(tg.lo)} to ${fmt(tg.hi)}">`;
  s+=`<rect x="${L}" y="${Y(tg.hi)}" width="${W-L-Rt}" height="${Y(tg.lo)-Y(tg.hi)}" style="fill:var(--good-wash);stroke:var(--good-line)"/>`;
  const step=ymax>6?2:1;
  for(let v=ymin;v<=ymax;v+=step)s+=`<line x1="${L}" x2="${W-Rt}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--rule)" stroke-dasharray="2 3"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" ${tx}>${v}</text>`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],gap=(b.t-a.t)/864e5>56;
    s+=`<line x1="${X(a.t)}" y1="${Y(a.v)}" x2="${X(b.t)}" y2="${Y(b.v)}" style="stroke:var(--acc);stroke-width:2${gap?';stroke-dasharray:4 4;opacity:.5':''}"/>`;}
  const lab=pts.length<=10;
  pts.forEach((p,i)=>{const c=p.v<tg.lo?'var(--acc)':p.v>tg.hi?'var(--bad)':'var(--good)';
    s+=`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" style="fill:${c};stroke:var(--surface);stroke-width:1.5"/>`;
    if(lab)s+=`<text x="${X(p.t)}" y="${Y(p.v)-9}" text-anchor="middle" style="fill:var(--ink);font:600 11px var(--mono)">${fmt(p.v)}${p.v>ymax?'↑':''}</text>`;});
  const nl=Math.max(2,Math.min(pts.length,Math.floor((W-L-Rt)/70)));let last=-1e9;
  for(let k=0;k<nl;k++){const p=pts[Math.round(k*(pts.length-1)/(nl-1))],x=X(p.t);if(x-last<58)continue;last=x;
    s+=`<text x="${x}" y="${H-8}" text-anchor="${x<L+PX+20?'start':x>W-Rt-PX-20?'end':'middle'}" ${tx}>${dShort(p.t)}</text>`;}
  return s+'</svg>';
}
function smTile(k,v,s,cls){return `<div class="tile ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;}
function renderTtr(){
  const tg=sTarget(),R=calcTTR(tg),o=$('ttOut');
  if(R.pts.length<2||R.tot<=0){o.innerHTML=`<div class="sm-empty">Enter at least two dated INR results to calculate the time in therapeutic range (target ${fmt(tg.lo)}–${fmt(tg.hi)}).${R.pts.length>=2&&R.gaps?' Every interval here is longer than 8 weeks, so none can be interpolated.':''}</div>`;return;}
  const pc=x=>x/R.tot*100,ttrP=pc(R.in),cls=ttrP>=70?'good':ttrP>=65?'warn':'bad',first=R.pts[0].t,last=R.pts[R.pts.length-1].t,days=Math.round((last-first)/864e5);
  let h='<div class="sm-tiles">'+smTile('TTR',Math.round(ttrP)+'<small> %</small>',`${Math.round(R.in)} of ${Math.round(R.tot)} days in ${fmt(tg.lo)}–${fmt(tg.hi)}`,cls)
    +smTile('INRs in range',R.nIn+'<small> / '+R.pts.length+'</small>',Math.round(R.nIn/R.pts.length*100)+'% of tests','t-info')
    +smTile('Period',days+'<small> days</small>',dShort(first)+' → '+dLong(last),'t-date')+'</div>';
  const pb=pc(R.below),pa=pc(R.above);
  h+=`<div class="tt-bar" role="img" aria-label="Below range ${Math.round(pb)}%, in range ${Math.round(ttrP)}%, above range ${Math.round(pa)}%"><i class="b" style="width:${pb}%"></i><i class="i" style="width:${ttrP}%"></i><i class="a" style="width:${pa}%"></i></div><div class="tt-key"><span class="b">Below ${Math.round(pb)}%</span><span class="i">In range ${Math.round(ttrP)}%</span><span class="a">Above ${Math.round(pa)}%</span></div>`;
  h+=ttChart(R.pts,tg);
  if(ttrP>=70) h+=`<div class="sm-sg info" style="background:var(--good-wash);border-color:var(--good-line)"><b>Good control</b> — TTR at or above 70%, the ESC 2024 aim. ${SRC('ESC AF 2024')}</div>`;
  else h+=`<div class="sm-sg${ttrP<65?' bad':''}"><b>${ttrP<65?'Poor':'Suboptimal'} control</b> — TTR below 70%. Look for the cause (adherence, diet, interacting drugs or herbs, alcohol, illness), re-educate, and check INR more often. In AF without a mechanical valve or moderate–severe mitral stenosis, switch to a DOAC if eligible (ESC 2024, class I).${ttrP<65?' NICE also reassesses anticoagulation when TTR is below 65%.':''} ${SRC('ESC AF 2024')}${ttrP<65?SRC('NICE NG196'):''}</div>`;
  const six=R.pts.filter(p=>p.t>=last-183*864e5),n5=six.filter(p=>p.v>5).length,n8=six.filter(p=>p.v>8).length,n15=six.filter(p=>p.v<1.5).length,fl=[];
  if(n5>=2)fl.push(n5+' INRs above 5');if(n8>=1)fl.push(n8+' INR'+(n8>1?'s':'')+' above 8');if(n15>=2)fl.push(n15+' INRs below 1.5');
  if(fl.length) h+=`<div class="sm-sg bad">Poor-control flags in the last 6 months: <b>${fl.join(', ')}</b>. NICE reassesses anticoagulation after 2 INRs above 5, 1 above 8, or 2 below 1.5 within 6 months. ${SRC('NICE NG196')}</div>`;
  h+=`<div class="tt-meth">Rosendaal method: the INR is assumed to change in a straight line between tests, and each day is counted as below, in or above range. ${R.gaps?R.gaps+' interval'+(R.gaps>1?'s':'')+' longer than 8 weeks '+(R.gaps>1?'were':'was')+' left out (dashed). ':''}${days<90?'Short period — TTR is more reliable over 6 months or more. ':''}${SRC('Rosendaal 1993')}</div>`;
  o.innerHTML=h;
}
function parseTtrPaste(txt){
  const out=[];
  txt.split(/\n+/).forEach(line=>{
    let y,m,d,rest=line;
    let mt=line.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(mt){y=+mt[1];m=+mt[2];d=+mt[3];}
    else{mt=line.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(mt){d=+mt[1];m=+mt[2];y=+mt[3];if(y<100)y+=y>=60?2500:2000;}}
    if(!mt) return;
    if(y>2400) y-=543;
    rest=line.replace(mt[0],' ');
    const nums=(rest.match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(v=>v>=0.8&&v<=20);
    if(!nums.length||m<1||m>12||d<1||d>31) return;
    out.push({d:y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),v:String(nums[nums.length-1])});
  });
  return out;
}

  try{localStorage.setItem('afsuite-theme',v);}catch(e){}if(!setTheme.q)try{if(parent!==window)parent.postMessage({afTheme:v},'*');}catch(e){}
}

<script>
/* ---------- sun/moon theme button (drives the app's own light/dark controls, kept hidden) ---------- */
(function(){
var C={"hide":".seg-theme","light":"[data-theme-set=\"light\"]","dark":"[data-theme-set=\"dark\"]"},root=document.documentElement;
var old=document.querySelector(C.hide);if(old&&C.parent)old=old.parentElement;if(!old)return;
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
var btn=document.createElement('button');btn.type='button';btn.className='zth';
old.classList.add('zth-hidden');old.insertAdjacentElement('afterend',btn);
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function cur(){var a=root.getAttribute('data-theme');if(a==='light'||a==='dark')return a;return mq&&mq.matches?'dark':'light';}
function thai(){return (root.getAttribute('lang')||'').slice(0,2)==='th';}
function paint(){var d=cur()==='dark';btn.innerHTML=d?SUN:MOON;
  var l=d?(thai()?'เปลี่ยนเป็นโหมดสว่าง':'Switch to light mode'):(thai()?'เปลี่ยนเป็นโหมดมืด':'Switch to dark mode');
  btn.setAttribute('aria-label',l);btn.title=l;}
btn.addEventListener('click',function(){var t=document.querySelector(cur()==='dark'?C.light:C.dark);if(t)t.click();paint();});
new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme','lang']});
if(mq){if(mq.addEventListener)mq.addEventListener('change',paint);else if(mq.addListener)mq.addListener(paint);}
paint();
})();
<\/script>
<script id="zfold">
/* ---------- collapsible blocks ---------- */
(function(){
  var SEL='.card,.sec,.simple>div.sm-card,section.panel,div.panel,section.section';
  var KEY='zfold2:'+(document.title||'app'),st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function headOf(b){
    var h=b.querySelector(':scope>h2,:scope>header,:scope>.sm-h,:scope>.panel-head,:scope>.section-head,:scope>h3');
    if(h)return h;
    var x=b.querySelector('h2,h3');if(!x)return null;
    var k=x;while(k.parentElement&&k.parentElement!==b)k=k.parentElement;
    if(k.parentElement!==b)return null;
    return (k===x||k.children.length<=2)?k:null;   /* heading buried in a content wrapper: leave the block alone */
  }
  function name(b,h){var t=h.querySelector('h1,h2,h3,h4')||h;return (t.textContent||'').replace(/\s+/g,' ').trim().replace(/^[0-9]+[a-z]?\s+/i,'').slice(0,48);}
  function setState(b,closed){
    if(closed)b.setAttribute('data-zf','closed');else b.removeAttribute('data-zf');
    var h=b.querySelector('.zf-head');if(h)h.setAttribute('aria-expanded',String(!closed));
  }
  /* everything starts folded except the main block(s) */
  function defOpen(b){
    if(/^(history|consult note|current meds|setting & situation|picbox|dose calculator|new weekly schedule)/i.test(b.dataset.zfn))return true;
    return document.querySelector('[data-zfn]')===b;
  }
  function prep(){
    document.querySelectorAll(SEL).forEach(function(b){
      if(b.tagName==='DETAILS'||b.closest('[role=dialog],dialog,.modal,.zcl-back,.zcl-modal,.sheet,.sheet-doc'))return;
      var h=headOf(b);if(!h)return;
      if(!h.classList.contains('zf-head')){
        h.classList.add('zf-head','zf-keep');h.setAttribute('role','button');h.setAttribute('tabindex','0');
        var p=h.previousElementSibling;while(p){p.classList.add('zf-keep');p=p.previousElementSibling;}
        b.dataset.zfn=name(b,h);
        var s0=st[b.dataset.zfn];setState(b,s0?s0==='c':!defOpen(b));
      }
    });
    paintAll();
  }
  function toggle(b,force){
    var closed=force!=null?force:b.getAttribute('data-zf')!=='closed';
    setState(b,closed);
    st[b.dataset.zfn]=closed?'c':'o';
    save();paintAll();
    if(!closed)setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},30);
  }
  function blocks(){return [].filter.call(document.querySelectorAll(SEL),function(b){return b.dataset.zfn!=null&&b.offsetParent!==null;});}
  var allBtn=null;
  function anyOpen(){return blocks().some(function(b){return b.getAttribute('data-zf')!=='closed';});}
  function paintAll(){if(allBtn)allBtn.textContent=anyOpen()?'Collapse all':'Expand all';}
  function addAll(){
    var host=document.querySelector('.top,header.mast,header.masthead,.masthead');if(!host||allBtn)return;
    allBtn=document.createElement('button');allBtn.type='button';allBtn.className='zf-all btn';
    allBtn.addEventListener('click',function(){var c=anyOpen();blocks().forEach(function(b){toggle(b,c);});});
    var anchor=host.querySelector('.zth,[data-new]');
    if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(allBtn,anchor);else host.appendChild(allBtn);
    paintAll();
  }
  function act(e){
    var h=e.target.closest&&e.target.closest('.zf-head');if(!h)return;
    if(e.target.closest('button,a,input,select,textarea,label,summary')&&e.target.closest('button,a,input,select,textarea,label,summary')!==h)return;
    var b=h.closest('[data-zfn]');if(!b)return;
    if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;if(e.target!==h)return;e.preventDefault();}
    toggle(b);
  }
  document.addEventListener('click',act);document.addEventListener('keydown',act);
  /* Copy / Print read the page text, so unfold everything for a moment */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.classList.contains('zf-all'))return;
    if(!/copy|print|คัดลอก|พิมพ์/i.test((b.textContent||'')+' '+(b.id||'')))return;
    var c=[].slice.call(document.querySelectorAll('[data-zf="closed"]'));if(!c.length)return;
    c.forEach(function(x){x.removeAttribute('data-zf');});
    setTimeout(function(){c.forEach(function(x){if(x.isConnected)x.setAttribute('data-zf','closed');});},1200);
  },true);
  window.addEventListener('beforeprint',function(){});
  var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;prep();},0);}
  function start(){prep();addAll();new MutationObserver(later).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>

<script>
(function(){
'use strict';
const APPS=["af","hf","htn","periop","doac","warf"];
const TITLES={"af":"AF-CARE Planner","hf":"HF Care Planner","htn":"HTN Care Planner","periop":"Periop CV Planner","doac":"DOAC Planner","warf":"Warfarin Planner"};
const root=document.documentElement;
const frame=a=>document.getElementById('f-'+a);
function load(a){
  const f=frame(a);
  if(f.dataset.loaded)return;
  f.dataset.loaded='1';
  f.addEventListener('load',()=>{if(curTheme)try{f.contentWindow.postMessage({afTheme:curTheme},'*');}catch(e){}});
  f.srcdoc=document.getElementById('src-'+a).textContent.replace(/<\\\/script>/gi,'<'+'/script>');
}
function show(a,push){
  if(!APPS.includes(a))a=APPS[0];
  load(a);
  APPS.forEach(x=>{frame(x).hidden=x!==a;document.querySelector('[data-app="'+x+'"]').setAttribute('aria-selected',x===a?'true':'false');});
  document.title=TITLES[a]+' · Cardio Care Suite';
  try{localStorage.setItem('afsuite-app',a);}catch(e){}
  if(push&&location.hash!=='#'+a)try{history.replaceState(null,'','#'+a);}catch(e){}
  try{frame(a).focus();}catch(e){}
}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.app,true)));
document.querySelector('.sw').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const cur=document.querySelector('[aria-selected="true"]').dataset.app;
  const nx=APPS[(APPS.indexOf(cur)+(e.key==='ArrowRight'?1:APPS.length-1))%APPS.length];
  show(nx,true);document.querySelector('[data-app="'+nx+'"]').focus();
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
let curTheme='';
function applyTheme(v){curTheme=v||'';if(v==='light'||v==='dark')root.setAttribute('data-theme',v);else root.removeAttribute('data-theme');}
try{applyTheme(localStorage.getItem('afsuite-theme'));}catch(e){}
window.addEventListener('message',e=>{
  const v=e.data&&e.data.afTheme;if(!v)return;
  applyTheme(v);
  APPS.forEach(a=>{const f=frame(a);if(f.contentWindow&&f.contentWindow!==e.source&&f.dataset.loaded)try{f.contentWindow.postMessage({afTheme:v},'*');}catch(_){}});
});
let start=location.hash.slice(1);
if(!APPS.includes(start)){try{start=localStorage.getItem('afsuite-app')||APPS[0];}catch(e){start=APPS[0];}}
show(start,true);
})();
</script>
