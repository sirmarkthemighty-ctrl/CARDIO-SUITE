  ['ladil',/\b(severe(?:ly)? (?:dilated|enlarged) (?:la|left atri\w*))\b/,'Dilated LA'],
  ['postop',/\b(post-?op\w*|postoperative|after surgery)\b/,'Post-op'],
  ['sepsis',/\b(sepsis|septic|pneumonia)\b/,'Acute trigger'],
  ['pe',/\b(pulmonary embol\w*|\bpe\b)/,'PE'],
  ['thyro',/\b(hyperthyroid\w*|thyrotox\w*|graves)\b/,'Hyperthyroid'],
  ['obese',/\b(obes\w*|overweight)\b/,'Obesity'],
  ['osa',/\b(osa|sleep apn\w*)\b/,'OSA'],
  ['etoh',/\b(alcohol (?:excess|abuse|use disorder|dependence)|heavy (?:drinking|drinker|alcohol)|etoh abuse|binge)\b/,'Alcohol excess'],
  ['smoke',/\b(smoker|smokes|smoking|cigarettes?|tobacco)\b/,'Smoker'],
  ['lung',/\b(asthma|copd|bronchospasm)\b/,'Asthma/COPD'],
  ['dialysis',/\b(dialysis|haemodialysis|hemodialysis|esrd|capd)\b/,'Dialysis'],
  ['rtx',/\b(kidney|renal) transplant\w*/,'Renal transplant'],
  ['liver',/\b(cirrhosis|chronic liver disease|hepatic impairment)\b/,'Liver disease'],
  ['activeBleed',/\b(active(?:ly)? bleed\w*|ongoing bleed\w*)\b/,'Active bleeding'],
  ['bleed',/\b(gi bleed\w*|bleed\w*|haemorrhag\w*|hemorrhag\w*|ich|melaena|melena|haematemesis|hematemesis|anaemi\w*|anemi\w*|thrombocytopeni\w*)\b/,'Bleeding history'],
  ['apt',/\b(aspirin|asa|clopidogrel|ticagrelor|prasugrel|nsaids?|ibuprofen|naproxen|diclofenac|celecoxib)\b/,'Antiplatelet/NSAID'],
  ['labile',/\b(labile inr|unstable inr|poor ttr|low ttr|fluctuating inr)\b/,'Labile INR'],
  ['pgp',/\b(dronedarone|ciclosporin|cyclosporin\w*|erythromycin|ketoconazole)\b/,'P-gp inhibitor'],
  ['vera',/\bverapamil\b/,'Verapamil'],
  ['azole',/\b(itraconazole|ketoconazole|voriconazole|posaconazole|ritonavir|lopinavir|cobicistat)\b/,'Azole/PI'],
  ['inducer',/\b(rifampi\w*|carbamazepine|phenytoin|phenobarb\w*|st\.? john)/,'Enzyme inducer']
];
function parseHx(){
  const tx=$('hx').value; if(!tx.trim()) return;
  const found=[];
  RULES.forEach(([id,re,lab])=>{if(hit(tx,re)){$(id).checked=true;found.push(lab);}});
  let m;
  if((m=tx.match(/\b(\d{2,3})\s*(?:-?\s*(?:y\/?o|yo|y\.o\.|yrs?|years?)(?:[\s-]*old)?\b|(m|f)\b)/i))){$('age').value=m[1];found.push('Age '+m[1]);if(m[2])setRad('sex',m[2].toUpperCase());}
  if(/\b(female|woman|lady)\b/i.test(tx))setRad('sex','F');else if(/\b(male|man|gentleman)\b/i.test(tx))setRad('sex','M');
  if((m=tx.match(/(\d{2,3}(?:\.\d+)?)\s*kg\b/i))){$('wt').value=m[1];found.push(m[1]+' kg');}
  if((m=tx.match(/(\d{3})\s*cm\b/i))){$('ht').value=m[1];}
  if((m=tx.match(/\b(?:cr|creat(?:inine)?|scr)\s*(?:of|=|:|is)?\s*(\d+(?:\.\d+)?)\s*(mg\/dl|[µμu]mol\/l)?/i))){
    const v=parseFloat(m[1]);const um=(m[2]&&/mol/i.test(m[2]))||v>20;$('cr').value=m[1];$('crUnit').value=um?'umol':'mg';found.push('Cr '+m[1]);}
  if((m=tx.match(/\b(?:lvef|ef)\s*(?:of|=|:|is)?\s*(\d{1,2})\s*%?/i))){$('lvef').value=m[1];found.push('LVEF '+m[1]+'%');}
  if((m=tx.match(/\b(?:hr|heart rate|pulse|ventricular rate|rate)\s*(?:of|=|:|is)?\s*(\d{2,3})\b/i))){$('hr').value=m[1];found.push('HR '+m[1]);}
  if((m=tx.match(/\b(?:bp|blood pressure)\s*(?:of|=|:|is)?\s*(\d{2,3})\s*\/\s*\d{2,3}/i))||(m=tx.match(/\b(\d{2,3})\s*\/\s*\d{2,3}\s*(?:mm\s*hg)?\b/i))){const v=+m[1];if(v>=50&&v<=260){$('sbp').value=v;found.push('SBP '+v);}}
  // pattern
  const pats=[['lsp',/long-?standing persistent/],['permanent',/\bpermanent\b/],['persistent',/\bpersistent\b/],['paroxysmal',/\bparoxysmal\b/],['subclinical',/\b(subclinical|device-detected|ahre)\b/],['first',/\b(first[- ]?(?:diagnosed|detected|episode|onset)|new[- ]onset|newly diagnosed)\b/]];
  for(const [v,re] of pats){if(hit(tx,re)){$('pattern').value=v;found.push($('pattern').selectedOptions[0].text);if(v==='first')$('early').checked=true;break;}}
  // duration
  if((m=tx.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)\b/i))&&+m[1]<24){setRad('dur','lt24');found.push('<24 h');}
  else if(/\b(unknown (?:onset|duration)|onset unknown)\b/i.test(tx)||/\b\d+\s*(days?|weeks?|months?)\b/i.test(tx)) setRad('dur','ge24');
  if(/\b(now|currently|back) in sinus\b|\breverted to sinus\b/i.test(tx)){setRad('dur','sr');found.push('In SR');}
  if((m=tx.match(/\b(\d+)\s*(days?|weeks?|months?)\s*(?:ago|of|history)\b/i))){const n=+m[1],u=m[2].toLowerCase();if(!/month/.test(u)||n<=12){$('early').checked=true;found.push('≤12 mo');}}
  // symptoms
  if((m=tx.match(/\bm?ehra\s*(?:class|score)?\s*(1|2a|2b|3|4)\b/i))){$('ehra').value=m[1].toLowerCase();found.push('mEHRA '+m[1]);}
  else if(hit(tx,/\basymptomatic\b/)){$('ehra').value='1';found.push('Asymptomatic');}
  // anticoagulant
  if(hit(tx,/\b(warfarin|vka|coumadin|acenocoumarol)\b/)){$('oac').value='vka';found.push('On VKA');}
  else if(hit(tx,/\b(apixaban|rivaroxaban|edoxaban|dabigatran|doac|noac)\b/)){$('oac').value='doac';found.push('On DOAC');}
  if(hit(tx,/\b(ha?emodynamically unstable|cardiogenic shock|shock)\b/)){setRad('hemo','unstable');found.push('Unstable');}
  if($('acs').checked&&!/\b(acs|stemi|nstemi|unstable angina)\b/i.test(tx)&&/\belective pci\b/i.test(tx))setRad('acst','ccs');
  const miss=[];['age','wt','cr','lvef'].forEach(k=>{if(num(k)==null)miss.push({age:'age',wt:'weight',cr:'creatinine',lvef:'LVEF'}[k]);});
  $('found').innerHTML=found.map(f=>`<span class="tag">${f}</span>`).join('')+miss.map(f=>`<span class="tag m">missing: ${f}</span>`).join('')||'<span class="tag m">nothing recognised</span>';
  render();
}

/* ---------- examples ---------- */
const EX=[
  {hx:'72F with HTN and T2DM. 3 months of recurrent palpitations; paroxysmal AF, current episode started 10 hours ago. HR 128, BP 146/88. LVEF 60%. Cr 0.9 mg/dL, weight 58 kg, height 155 cm. No prior stroke, no bleeding.',set:{ehra:'2b'}},
  {hx:'68M with ischaemic cardiomyopathy (prior MI, PCI 2019), LVEF 30%, CKD. Breathless for 2 weeks; persistent AF, onset unknown. HR 138, BP 104/68. Cr 1.8 mg/dL, weight 76 kg. On aspirin. Suspected tachycardia-induced cardiomyopathy.',set:{ehra:'3'}},
  {hx:'84M, permanent AF for 6 years. Prior ischaemic stroke 2021, hypertension, previous GI bleed 2023. On warfarin with labile INR. HR 96, BP 150/80. Cr 1.6 mg/dL, weight 55 kg. Takes ibuprofen for knee pain.',set:{ehra:'2a'}},
  {hx:'24M with WPW pattern. Sudden palpitations 3 hours ago, irregular broad-complex tachycardia, HR 240, BP 78/40, drowsy — haemodynamically unstable. Weight 70 kg, Cr 0.9. No past history.',set:{ehra:'4',pattern:'first'}}
];
function loadEx(i){
  resetAll(true);
  $('hx').value=EX[i].hx; parseHx();
  const o=EX[i].set; Object.keys(o).forEach(k=>{$(k).value=o[k];});
  render();
  setView('plan');
}
const mobile=()=>window.matchMedia('(max-width:980px)').matches;
function setView(v,noScroll){
  document.body.dataset.view=v;
  document.querySelectorAll('.mtabs [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(!noScroll&&mobile()) window.scrollTo(0,0);
}
function resetAll(quiet){
  $('f').reset(); $('found').innerHTML='';
  if(!quiet) render();
}

/* ---------- copy ---------- */
function planText(){
  const L=['AF-CARE PLAN (ESC 2024 AF guideline)'];
  const hx=$('hx').value.trim(); if(hx) L.push('History: '+hx);
  L.push('Scores: '+[...document.querySelectorAll('#tiles .tile')].map(t=>t.querySelector('.k').textContent+' '+t.querySelector('.v').textContent.replace(/\s+/g,' ').trim()).join(' · '));
  document.querySelectorAll('#plan > .alert, #plan > .sec').forEach(el=>{
    if(el.classList.contains('alert')){L.push('','!! '+el.innerText.replace(/\s*\n+\s*/g,' — '));return;}
    L.push('','== '+el.querySelector('h3').textContent.toUpperCase()+' ==');
    el.querySelectorAll('.bd > *').forEach(ch=>{
      if(ch.tagName==='H4') L.push('','-- '+ch.textContent);
      else if(ch.classList.contains('lbl')) L.push(ch.textContent+':');
      else if(ch.classList.contains('verdict')) L.push('> '+ch.innerText.replace(/\s+/g,' ').trim());
      else if(ch.tagName==='UL') ch.querySelectorAll('li').forEach(x=>{const c=x.querySelector('.cls').textContent;L.push('  - '+(c!=='•'?'['+c+'] ':'')+x.querySelector('.tx').innerText.replace(/\s*\n+\s*/g,' — '));});
      else if(ch.classList.contains('tblwrap')) ch.querySelectorAll('tbody tr').forEach(tr=>L.push('  - '+[...tr.cells].map(td=>td.innerText.trim()).join(' | ')));
      else if(ch.classList.contains('brk')) L.push('  ('+[...ch.children].filter(x=>x.classList.contains('on')).map(x=>x.textContent).join(', ')+')');
      else if(ch.innerText.trim()) L.push(ch.innerText.trim());
    });
  });
  return L.join('\n');
}
let toastTimer;
function toast(m,action,ms){const t=$('toast');t.textContent=m;if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.onclick=()=>{t.classList.remove('on');action.fn();};t.appendChild(b);}t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),ms||1600);}
$('copyBtn').addEventListener('click',()=>{
  const txt=planText();
  const done=()=>toast('Plan copied');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>fallback(txt));
  else fallback(txt);
  function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed');}a.remove();}
});

/* ---------- wiring ---------- */
$('f').addEventListener('input',e=>{if(e.target.id!=='hx')render();});
$('f').addEventListener('change',e=>{if(e.target.id!=='hx')render();});
$('parseBtn').addEventListener('click',()=>{parseHx();if(mobile()&&$('hx').value.trim())toast('Filled — check the boxes, then tap Plan');});
document.querySelectorAll('.mtabs [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
setView('inputs',true);
/* new case: clear everything, with undo */
function formEls(){return [...$('f').elements].filter(e=>e.name||e.id);}
function snapshot(){return {v:formEls().map(e=>(e.type==='checkbox'||e.type==='radio')?e.checked:e.value),found:$('found').innerHTML};}
function restore(snap){formEls().forEach((e,i)=>{if(e.type==='checkbox'||e.type==='radio')e.checked=snap.v[i];else e.value=snap.v[i];});$('found').innerHTML=snap.found;render();}
function isDirty(){return formEls().some(e=>(e.type==='checkbox'||e.type==='radio')?e.checked!==e.defaultChecked:e.tagName==='SELECT'?[...e.options].some(o=>o.selected!==o.defaultSelected):e.value!==e.defaultValue);}
function newCase(){
  const dirty=isDirty(), snap=dirty?snapshot():null;
  resetAll(false);
  setView('inputs');
  window.scrollTo(0,0); $('f').scrollTop=0;
  try{$('hx').focus({preventScroll:true});}catch(e){}
  if(dirty) toast('All details cleared — ready for a new case',{label:'Undo',fn:()=>{restore(snap);toast('Previous case restored');}},6000);
  else toast('Ready for a new case');
}
document.querySelectorAll('[data-new]').forEach(b=>b.addEventListener('click',newCase));
document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>loadEx(+b.dataset.ex)));

/* theme */
const root=document.documentElement;
function setTheme(v){
  if(v==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',v);
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-theme-set')===v));
  try{localStorage.setItem('afsuite-theme',v);}catch(e){}if(!setTheme.q)try{if(parent!==window)parent.postMessage({afTheme:v},'*');}catch(e){}
}
document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.getAttribute('data-theme-set'))));
try{const v=localStorage.getItem('afsuite-theme');if(v)setTheme(v);}catch(e){}window.addEventListener('message',e=>{if(e.data&&e.data.afTheme){setTheme.q=1;setTheme(e.data.afTheme);setTheme.q=0;}});

render();
})();
<\/script>

<div class="zcl-modal" id="zclModal" hidden role="dialog" aria-modal="true" aria-labelledby="zclTitle"><div class="zcl-sheet"><header><h2 id="zclTitle">What's new<small>Version history</small></h2><button type="button" class="zcl-x" data-zcl-close aria-label="Close">×</button></header><div class="zcl-bd" id="zclBody"></div></div></div>
<script>

(function(){
const changelogData=[
 {"version":"v1.3.1","date":"October 11, 2026","features":["Collapsible blocks: every block starts folded except the main one (history, consult note or case text; in the warfarin planner also Setting & situation and the Simple-mode calculator and schedule). Tap a block’s header to unfold or fold it, or use “Expand all / Collapse all” at the top. The app remembers your choices. Copy and Print always include every block."],"bugs":[]},

 {"version":"v1.2.2","date":"October 6, 2026","features":["Theme switch is now a single sun/moon button, as in the Bronchodilator Guide: it follows your device setting until you tap it, then remembers your choice."],"bugs":[]},

 },
 {

 },

 },
 {

  ],

 }
];
const APP_VERSION=changelogData[0].version;
const modal=document.getElementById('zclModal'),body=document.getElementById('zclBody');
const btn=document.createElement('button');btn.type='button';btn.className='zcl-ver';btn.title="What's new";btn.textContent=APP_VERSION;
function place(){if(btn.isConnected)return;const a=document.querySelector("h1");if(a)a.appendChild(btn);}
place();setInterval(place,1500);
let back=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function open(){back=document.activeElement;
  body.innerHTML=changelogData.map(l=>'<div class="zcl-item"><h3>'+esc(l.version)+'<span>'+esc(l.date)+'</span></h3>'+(l.features.length?'<h5>New</h5><ul>'+l.features.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+(l.bugs.length?'<h5>Fixed</h5><ul>'+l.bugs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</div>').join('');
  modal.hidden=false;document.documentElement.style.overflow='hidden';try{modal.querySelector('[data-zcl-close]').focus();}catch(e){}}
function close(){modal.hidden=true;document.documentElement.style.overflow='';try{back&&back.focus();}catch(e){}}
btn.addEventListener('click',open);
modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-zcl-close]'))close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close();});

<script>
/* ---------- sun/moon theme button (drives the app's own light/dark controls, kept hidden) ---------- */
(function(){
var C={"hide":".seg-theme","light":"[data-theme-set=\"light\"]","dark":"[data-theme-set=\"dark\"]"},root=document.documentElement;
var old=document.querySelector(C.hide);if(old&&C.parent)old=old.parentElement;if(!old)return;
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
var btn=document.createElement('button');btn.type='button';btn.className='zth';
old.classList.add('zth-hidden');old.insertAdjacentElement('afterend',btn);
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function cur(){var a=root.getAttribute('data-theme');if(a==='light'||a==='dark')return a;return mq&&mq.matches?'dark':'light';}
function thai(){return (root.getAttribute('lang')||'').slice(0,2)==='th';}
function paint(){var d=cur()==='dark';btn.innerHTML=d?SUN:MOON;
  var l=d?(thai()?'เปลี่ยนเป็นโหมดสว่าง':'Switch to light mode'):(thai()?'เปลี่ยนเป็นโหมดมืด':'Switch to dark mode');
  btn.setAttribute('aria-label',l);btn.title=l;}
btn.addEventListener('click',function(){var t=document.querySelector(cur()==='dark'?C.light:C.dark);if(t)t.click();paint();});
new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme','lang']});
if(mq){if(mq.addEventListener)mq.addEventListener('change',paint);else if(mq.addListener)mq.addListener(paint);}
paint();

<\/script>
<script id="zcol">
/* ---------- colour-coded blocks: cards by topic, plan sections by their letter colour ---------- */
(function(){
  var KW=[[/bleed|contraind|red flag|danger|active cardiac|safety|storm|side.effect|alarm/i,'red'],
          [/medic|drug|treatment|antihypertens|interact|tablet|override|dosing/i,'amber'],
          [/history|note|picbox|report|case text/i,'teal'],
          [/patient|labs?\b|vital|blood pressure|setting/i,'green'],];
  var CYC=['violet','blue','teal','green'],prev=null;
  function paintCards(){
    var i=0;
    document.querySelectorAll('.card').forEach(function(c){
      var h=c.querySelector(':scope>h2');if(!h||c.dataset.zk)return;
      var tx=h.textContent,k=null;
      for(var j=0;j<KW.length;j++)if(KW[j][0].test(tx)){k=KW[j][1];break;}
      if(!k||(k===prev&&k!=='red'&&k!=='amber')){k=CYC[i++%CYC.length];if(k===prev)k=CYC[i++%CYC.length];}
      prev=k;
      c.style.setProperty('--zk','var(--zc-'+k+')');c.dataset.zk=k;
    });
  }
  function paintSecs(force){
    document.querySelectorAll('.sec').forEach(function(s){
      if(s.dataset.zk&&!force)return;
      var L=s.querySelector(':scope>header .L');if(!L)return;
      var c=getComputedStyle(L).backgroundColor;
      if(!c||c==='transparent'||/rgba\(0, 0, 0, 0\)/.test(c))return;
      s.style.setProperty('--zk',c);s.dataset.zk='1';
    });
  }
  var q=0;function later(f){if(q)return;q=1;requestAnimationFrame(function(){q=0;paintCards();paintSecs(f);});}
  paintCards();paintSecs(false);
  new MutationObserver(function(){later(false);}).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(function(){requestAnimationFrame(function(){paintSecs(true);});}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(){requestAnimationFrame(function(){paintSecs(true);});});
})();
<\/script>
<script id="zfold">
/* ---------- collapsible blocks ---------- */
(function(){
  var SEL='.card,.sec,.simple>div.sm-card,section.panel,div.panel,section.section';
  var KEY='zfold2:'+(document.title||'app'),st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function headOf(b){
    var h=b.querySelector(':scope>h2,:scope>header,:scope>.sm-h,:scope>.panel-head,:scope>.section-head,:scope>h3');
    if(h)return h;
    var x=b.querySelector('h2,h3');if(!x)return null;
    var k=x;while(k.parentElement&&k.parentElement!==b)k=k.parentElement;
    if(k.parentElement!==b)return null;
    return (k===x||k.children.length<=2)?k:null;   /* heading buried in a content wrapper: leave the block alone */
  }
  function name(b,h){var t=h.querySelector('h1,h2,h3,h4')||h;return (t.textContent||'').replace(/\s+/g,' ').trim().replace(/^[0-9]+[a-z]?\s+/i,'').slice(0,48);}
  function setState(b,closed){
    if(closed)b.setAttribute('data-zf','closed');else b.removeAttribute('data-zf');
    var h=b.querySelector('.zf-head');if(h)h.setAttribute('aria-expanded',String(!closed));
  }
  /* everything starts folded except the main block(s) */
  function defOpen(b){
    if(/^(history|consult note|current meds|setting & situation|picbox|dose calculator|new weekly schedule)/i.test(b.dataset.zfn))return true;
    return document.querySelector('[data-zfn]')===b;
  }
  function prep(){
    document.querySelectorAll(SEL).forEach(function(b){
      if(b.tagName==='DETAILS'||b.closest('[role=dialog],dialog,.modal,.zcl-back,.zcl-modal,.sheet,.sheet-doc'))return;
      var h=headOf(b);if(!h)return;
      if(!h.classList.contains('zf-head')){
        h.classList.add('zf-head','zf-keep');h.setAttribute('role','button');h.setAttribute('tabindex','0');
        var p=h.previousElementSibling;while(p){p.classList.add('zf-keep');p=p.previousElementSibling;}
        b.dataset.zfn=name(b,h);
        var s0=st[b.dataset.zfn];setState(b,s0?s0==='c':!defOpen(b));
      }
    });
    paintAll();
  }
  function toggle(b,force){
    var closed=force!=null?force:b.getAttribute('data-zf')!=='closed';
    setState(b,closed);
    st[b.dataset.zfn]=closed?'c':'o';
    save();paintAll();
    if(!closed)setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},30);
  }
  function blocks(){return [].filter.call(document.querySelectorAll(SEL),function(b){return b.dataset.zfn!=null&&b.offsetParent!==null;});}
  var allBtn=null;
  function anyOpen(){return blocks().some(function(b){return b.getAttribute('data-zf')!=='closed';});}
  function paintAll(){if(allBtn)allBtn.textContent=anyOpen()?'Collapse all':'Expand all';}
  function addAll(){
    var host=document.querySelector('.top,header.mast,header.masthead,.masthead');if(!host||allBtn)return;
    allBtn=document.createElement('button');allBtn.type='button';allBtn.className='zf-all btn';
    allBtn.addEventListener('click',function(){var c=anyOpen();blocks().forEach(function(b){toggle(b,c);});});
    var anchor=host.querySelector('.zth,[data-new]');
    if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(allBtn,anchor);else host.appendChild(allBtn);
    paintAll();
  }
  function act(e){
    var h=e.target.closest&&e.target.closest('.zf-head');if(!h)return;
    if(e.target.closest('button,a,input,select,textarea,label,summary')&&e.target.closest('button,a,input,select,textarea,label,summary')!==h)return;
    var b=h.closest('[data-zfn]');if(!b)return;
    if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;if(e.target!==h)return;e.preventDefault();}
    toggle(b);
  }
  document.addEventListener('click',act);document.addEventListener('keydown',act);
  /* Copy / Print read the page text, so unfold everything for a moment */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.classList.contains('zf-all'))return;
    if(!/copy|print|คัดลอก|พิมพ์/i.test((b.textContent||'')+' '+(b.id||'')))return;
    var c=[].slice.call(document.querySelectorAll('[data-zf="closed"]'));if(!c.length)return;
    c.forEach(function(x){x.removeAttribute('data-zf');});
    setTimeout(function(){c.forEach(function(x){if(x.isConnected)x.setAttribute('data-zf','closed');});},1200);
  },true);
  window.addEventListener('beforeprint',function(){});
  var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;prep();},0);}
  function start(){prep();addAll();new MutationObserver(later).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>
