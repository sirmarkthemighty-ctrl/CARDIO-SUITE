const FREQ=[[/\b(t\.?i\.?d\.?|tds|three times)\b/i,3],[/\b(b\.?i\.?d\.?|bd|twice)\b/i,2],[/\b(o\.?d\.?|q\.?d\.?|daily|once|nocte|mane)\b/i,1]];
function drugDose(tx,d){
  const m=tx.match(new RegExp('(?:'+d.re.source+')[^.;,\\n]{0,14}?(\\d+(?:\\.\\d+)?)(?:\\s*\\/\\s*\\d+(?:\\.\\d+)?)?\\s*(?:mg|mcg)?([^.;,\\n]{0,22})','i'));
  if(!m) return null;
  let f=d.f||1;const tail=m[m.length-1]||'';
  for(const [re,v] of FREQ){if(re.test(tail)){f=v;break;}}
  return parseFloat(m[m.length-2])*f;
}
function doseLevel(frac){return frac>=0.99?'tgt':frac>=0.5?'mid':'low';}
function parseHx(){
  const tx=$('hx').value; if(!tx.trim()) return;
  const found=[];
  RULES.forEach(([id,re,lab])=>{if(hit(tx,re)){$(id).checked=true;found.push(lab);}});
  if($('dm1').checked) $('dm2').checked=false;
  let m;
  if((m=tx.match(/\b(\d{2,3})\s*(?:-?\s*(?:y\/?o|yo|y\.o\.|yrs?|years?)(?:[\s-]*old)?\b|(m|f)\b)/i))){$('age').value=m[1];found.push('Age '+m[1]);if(m[2])setRad('sex',m[2].toUpperCase());}
  if(/\b(female|woman|lady|she)\b/i.test(tx))setRad('sex','F');else if(/\b(male|man|gentleman|he)\b/i.test(tx))setRad('sex','M');
  if((m=tx.match(/(\d{2,3}(?:\.\d+)?)\s*kg\b/i))){$('wt').value=m[1];found.push(m[1]+' kg');}
  if((m=tx.match(/(\d{3})\s*cm\b/i))){$('ht').value=m[1];}
  if((m=tx.match(/\bbmi\s*(?:of|=|:)?\s*(\d{2}(?:\.\d)?)/i))&&!$('ht').value&&$('wt').value){$('ht').value=Math.round(100*Math.sqrt(+$('wt').value/+m[1]));found.push('BMI '+m[1]);}
  if((m=tx.match(/\b(?:lvef|ef)\s*(?:of|=|:|is|was)?\s*(\d{1,2})\s*%?/i))){$('lvef').value=m[1];found.push('LVEF '+m[1]+'%');}
  if((m=tx.match(/\b(?:nyha|class)\s*(?:class|fc)?\s*(iv|iii|ii|i|[1-4])\b/i))){const r=m[1].toLowerCase();const v={i:1,ii:2,iii:3,iv:4}[r]||+r;$('nyha').value=v;found.push('NYHA '+ROMAN[v]);}
  if((m=tx.match(/\b(?:hr|heart rate|pulse)\s*(?:of|=|:|is)?\s*(\d{2,3})\b/i))){$('hr').value=m[1];found.push('HR '+m[1]);}
  if((m=tx.match(/\b(?:bp|blood pressure)\s*(?:of|=|:|is)?\s*(\d{2,3})\s*\/\s*\d{2,3}/i))||(m=tx.match(/\b(\d{2,3})\s*\/\s*\d{2,3}\s*(?:mm\s*hg)?\b(?!\s*mg)/i))){const v=+m[1];if(v>=50&&v<=260){$('sbp').value=v;found.push('SBP '+v);}}
  if((m=tx.match(/\bqrs\s*(?:of|=|:|duration)?\s*(\d{2,3})/i))){$('qrs').value=m[1];found.push('QRS '+m[1]);}
  if(hit(tx,/\b(lbbb|left bundle branch block)\b/)){$('qrsm').value='lbbb';found.push('LBBB');}
  else if(hit(tx,/\b(rbbb|right bundle|ivcd|non-?lbbb|intraventricular conduction)\b/)){$('qrsm').value='non';found.push('Non-LBBB');}
  if(hit(tx,/\b(in af|af rhythm|atrial fibrillation with|af with|af,? hr|rate[- ]controlled af|permanent af|persistent af|atrial flutter)\b/)&&!/\bsinus\b/i.test(tx)){$('rhy').value='af';}
  else if(/\b(paced rhythm|v-?paced)\b/i.test(tx)) $('rhy').value='paced';
  else if(/\b(sinus|sr)\b/i.test(tx)) $('rhy').value='sr';
  if((m=tx.match(/\bnt-?pro-?bnp\s*(?:of|=|:|is)?\s*(\d[\d,]*)/i))){$('np').value=m[1].replace(/,/g,'');$('npType').value='nt';found.push('NT-proBNP '+$('np').value);}
  else if((m=tx.match(/\bbnp\s*(?:of|=|:|is)?\s*(\d[\d,]*)/i))){$('np').value=m[1].replace(/,/g,'');$('npType').value='bnp';found.push('BNP '+$('np').value);}
  if((m=tx.match(/\b(?:cr|creat(?:inine)?|scr)\s*(?:of|=|:|is)?\s*(\d+(?:\.\d+)?)\s*(mg\/dl|[µμu]mol\/l)?/i))){
    const v=parseFloat(m[1]);const um=(m[2]&&/mol/i.test(m[2]))||v>20;$('cr').value=m[1];$('crUnit').value=um?'umol':'mg';found.push('Cr '+m[1]);}
  if((m=tx.match(/\begfr\s*(?:of|=|:|is)?\s*(\d{1,3})/i))){$('egfrIn').value=m[1];found.push('eGFR '+m[1]);}
  if((m=tx.match(/\b(?:k\+?|potassium)\s*(?:of|=|:|is)?\s*(\d(?:\.\d)?)\b/i))){$('k').value=m[1];found.push('K '+m[1]);}
  if((m=tx.match(/\b(?:na\+?|sodium)\s*(?:of|=|:|is)?\s*(1[0-6]\d)\b/i))){$('na').value=m[1];}
  if((m=tx.match(/\b(?:hb|ha?emoglobin)\s*(?:of|=|:|is)?\s*(\d{1,2}(?:\.\d)?)/i))){$('hb').value=m[1];}
  if((m=tx.match(/\btsat\s*(?:of|=|:|is)?\s*(\d{1,2})/i))){$('tsat').value=m[1];found.push('TSAT '+m[1]+'%');}
  if((m=tx.match(/\bferritin\s*(?:of|=|:|is)?\s*(\d{1,4})/i))){$('ferr').value=m[1];}
  if((m=tx.match(/\bspo2\s*(?:of|=|:|is)?\s*(\d{2,3})|\bsat(?:uration)?s?\s*(?:of|=|:)?\s*(\d{2})\s*%/i))){$('spo2').value=m[1]||m[2];}
  if((m=tx.match(/\b(?:rr|resp(?:iratory)? rate)\s*(?:of|=|:|is)?\s*(\d{1,2})\b/i))){$('rr').value=m[1];}
  if((m=tx.match(/\blactate\s*(?:of|=|:|is)?\s*(\d+(?:\.\d)?)/i))){$('lact').value=m[1];}
  if((m=tx.match(/(\d+|one|two|three|four|five)\s*(?:hf |heart failure )?(?:hospitali[sz]ations?|admissions?)\s*(?:in|over|during)?\s*(?:the\s*)?(?:past|last)\s*(?:year|12\s*months)/i))){const w={one:1,two:2,three:3,four:4,five:5};$('hfh').value=w[m[1].toLowerCase()]||m[1];found.push('HFH '+$('hfh').value+'/y');}
  if((m=tx.match(/\b6\s*-?\s*mwt?d?\s*(?:of|=|:)?\s*(\d{2,3})/i))&&+m[1]<300) $('exlow').checked=true;
  if((m=tx.match(/\bp?vo2\s*(?:max|peak)?\s*(?:of|=|:)?\s*(\d{1,2}(?:\.\d)?)/i))&&+m[1]<14) $('exlow').checked=true;
  if(/\b(3|three|6|six)\+?\s*months? (?:of|on) (?:optimi[sz]ed|optimal|max\w*)/i.test(tx)) $('fmt3').checked=true;
  if(/\bprevious(?:ly)? (?:lvef|ef)\s*\d|recovered ef|improved (?:lv)?ef|hfimpef\b/i.test(tx)) $('prevLow').checked=true;
  // setting
  if(hit(tx,/\b(decompensat\w*|admitted|acute heart failure|adhf|acute pulmonary o?edema|flash pulmonary|cardiogenic shock|presents? with (?:worsening )?(?:breathless|dyspno))/)){setRad('set','D');found.push('Decompensated');}
  else if(/\basymptomatic\b/i.test(tx)){setRad('set',$('lvef').value||$('isch').checked?'B':'A');found.push('Asymptomatic');}
  if(hit(tx,/\bcardiogenic shock\b/)) setRad('dtype','cs');
  else if(hit(tx,/\b(acute pulmonary o?edema|flash pulmonary|\bapo\b)/)) setRad('dtype','apo');
  else if(hit(tx,/\b(right[- ]sided|isolated right)\b/)) setRad('dtype','right');
  if(/\b(?:stemi|nstemi|mi|myocardial infarction)\b[^.]{0,25}?\b(\d{1,2}|two|three|four|five)\s*(days?|weeks?)\s*ago|recent mi\b/i.test(tx)){const mm=tx.match(/(\d{1,2}|two|three|four|five)\s*(days?|weeks?)\s*ago/i);if(mm){const w={two:2,three:3,four:4,five:5};const n=w[mm[1].toLowerCase()]||+mm[1];const d=/week/i.test(mm[2])?n*7:n;if(d<40)$('mi40').checked=true;}}
  // drugs
  const pick=(cl,selId,dId)=>{
    for(const [k,d] of Object.entries(DR)){
      if(d.cl!==cl) continue;
      if(!hitDrug(tx,d.re)) continue;
      if(k==='valsartan'&&/sacubitril|entresto/i.test(tx)) continue;
      $(selId).value=k;
      const dd=drugDose(tx,d);
      let tg=d.tgd; if(k==='carvedilol'&&num('wt')>85) tg=100; if(k==='finerenone'){const e=collect().egfr;tg=e!=null&&e<=60?20:40;}
      if(dd&&tg) $(dId).value=doseLevel(dd/tg);
      found.push(d.n+(dd&&tg?` ${Math.round(100*dd/tg)}%`:''));
      return;
    }
  };
  pick('ras','ras','rasD'); pick('bb','bb','bbD'); pick('mra','mra','mraD');
  for(const [k,d] of Object.entries(DR)){if(d.cl==='sglt'&&hitDrug(tx,d.re)){$('sglt').value=k;found.push(d.n);break;}}
  // loop diuretic (furosemide-equivalent)
  const loops=[[/(?:furosemide|frusemide|lasix)/,1],[/bumetanide/,40],[/(?:torsemide|torasemide)/,2]];

    const d=drugDose(tx,{re,f:1});

  const miss=[];[['lvef','LVEF'],['sbp','SBP'],['k','K⁺'],['cr','creatinine'],['np','NP']].forEach(([k,l])=>{if(num(k)==null&&!(k==='cr'&&num('egfrIn')!=null))miss.push(l);});
  $('found').innerHTML=found.map(f=>`<span class="tag">${f}</span>`).join('')+miss.map(f=>`<span class="tag m">missing: ${f}</span>`).join('')||'<span class="tag m">nothing recognised</span>';
  render();
}

/* ---------- examples ---------- */
const EX=[
  {hx:'62M ischaemic cardiomyopathy, prior MI 2022 with PCI. Breathless on 1 flight of stairs, NYHA III, mild ankle oedema. LVEF 28%. Sinus rhythm, HR 84, BP 118/72. QRS 156 ms LBBB. NT-proBNP 2600, K 4.7, Cr 1.3 mg/dL, 80 kg, 172 cm. TSAT 14%, ferritin 85. Hypertension, T2DM. On ramipril 2.5 mg bd, bisoprolol 2.5 mg daily, furosemide 40 mg daily, metformin.'},
  {hx:'68F hypertension, T2DM, obesity, 98 kg, 162 cm. Exertional dyspnoea NYHA II. LVEF 60%, LVH, LA dilated, E/e\' 14, PASP 42. NT-proBNP 420. Paroxysmal AF on apixaban. HR 76, BP 146/84. K 4.4, Cr 0.9 mg/dL. On amlodipine, metformin, furosemide 20 mg daily. Takes ibuprofen for knee pain.'},
  {hx:'75M known HFrEF LVEF 25%, admitted with 1 week of worsening orthopnoea, leg oedema, raised JVP — decompensated HF. AF, HR 104, BP 112/74, SpO2 88%, RR 28. NT-proBNP 8900. Cr 1.6 mg/dL, K 5.1, Na 132. Two HF hospitalisations in the past year. On furosemide 80 mg daily, sacubitril/valsartan 49/51 mg bd, carvedilol 6.25 mg bd, spironolactone 25 mg daily. 74 kg.'},
  {hx:'52M dilated cardiomyopathy, LVEF 17%, NYHA IV. Three hospitalisations in the past 12 months, needed dobutamine in May. 6MWT 210 m. BP 86/58, HR 102 sinus, QRS 118. Cr 2.0 mg/dL, K 5.3, NT-proBNP 7400. ICD in situ with appropriate shocks. Intolerant of Entresto due to hypotension. On bisoprolol 1.25 mg, spironolactone 12.5 mg, dapagliflozin 10 mg, furosemide 120 mg daily. 70 kg.'},
  {hx:'59M anterior STEMI 3 weeks ago, primary PCI. Asymptomatic, no congestion. LVEF 38%. Type 2 diabetes, hypertension, smoker. BP 128/78, HR 72, K 4.3, Cr 1.0.'}
];
function loadEx(i){
  resetAll(true);
  $('hx').value=EX[i].hx; parseHx();
  render();
  setView('plan');
}
const mobile=()=>window.matchMedia('(max-width:980px)').matches;
function setView(v,noScroll){
  document.body.dataset.view=v;
  document.querySelectorAll('.mtabs [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(!noScroll&&mobile()) window.scrollTo(0,0);
}
function resetAll(quiet){
  $('f').reset(); $('found').innerHTML='';
  if(!quiet) render();
}

/* ---------- copy ---------- */
function planText(){
  const L=['HF CARE PLAN (ESC 2026 HF guideline)'];
  const hx=$('hx').value.trim(); if(hx) L.push('History: '+hx);
  L.push('Summary: '+[...document.querySelectorAll('#tiles .tile')].map(t=>t.querySelector('.k').textContent+' '+t.querySelector('.v').textContent.replace(/\s+/g,' ').trim()+' ('+t.querySelector('.s').textContent+')').join(' · '));
  document.querySelectorAll('#plan > .alert, #plan > .sec').forEach(el=>{
    if(el.classList.contains('alert')){L.push('','!! '+el.innerText.replace(/\s*\n+\s*/g,' — '));return;}
    L.push('','== '+el.querySelector('h3').textContent.toUpperCase()+' ==');
    el.querySelectorAll('.bd > *').forEach(ch=>{
      if(ch.tagName==='H4') L.push('','-- '+ch.textContent);
      else if(ch.classList.contains('verdict')) L.push('> '+ch.innerText.replace(/\s+/g,' ').trim());
      else if(ch.tagName==='UL') ch.querySelectorAll(':scope > li').forEach(x=>{
        if(x.querySelector('.chk')){x.querySelectorAll('.chk span').forEach(sp=>L.push('      '+sp.previousElementSibling.textContent+' '+sp.textContent));return;}
        const c=x.querySelector('.cls');L.push('  - '+(c&&c.textContent!=='•'?'['+c.textContent+'] ':'')+x.querySelector('.tx').innerText.replace(/\s*\n+\s*/g,' — '));});
      else if(ch.classList.contains('tblwrap')) ch.querySelectorAll('tbody tr').forEach(tr=>L.push('  - '+[...tr.cells].map(td=>td.innerText.trim()).join(' | ')));
      else if(ch.classList.contains('chk')) ch.querySelectorAll('span').forEach(sp=>L.push('    '+sp.previousElementSibling.textContent+' '+sp.textContent));
      else if(ch.classList.contains('brk')) L.push('  ('+[...ch.children].filter(x=>x.classList.contains('on')).map(x=>x.textContent).join(', ')+')');
      else if(ch.innerText.trim()) L.push(ch.innerText.trim());
    });
  });
  return L.join('\n');
}
let toastTimer;
function toast(m,action,ms){const t=$('toast');t.textContent=m;if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.onclick=()=>{t.classList.remove('on');action.fn();};t.appendChild(b);}t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),ms||1600);}
$('copyBtn').addEventListener('click',()=>{
  const txt=planText();
  const done=()=>toast('Plan copied');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>fallback(txt));
  else fallback(txt);
  function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed');}a.remove();}
});

/* ---------- wiring ---------- */
$('f').addEventListener('input',e=>{if(e.target.id!=='hx')render();});
$('f').addEventListener('change',e=>{if(e.target.id!=='hx')render();});
$('parseBtn').addEventListener('click',()=>{parseHx();if(mobile()&&$('hx').value.trim())toast('Filled — check the fields, then tap Plan');});
document.querySelectorAll('.mtabs [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
setView('inputs',true);
/* new case: clear everything, with undo */
function formEls(){return [...$('f').elements].filter(e=>e.name||e.id);}
function snapshot(){return {v:formEls().map(e=>(e.type==='checkbox'||e.type==='radio')?e.checked:e.value),found:$('found').innerHTML};}
function restore(snap){formEls().forEach((e,i)=>{if(e.type==='checkbox'||e.type==='radio')e.checked=snap.v[i];else e.value=snap.v[i];});$('found').innerHTML=snap.found;render();}
function isDirty(){return formEls().some(e=>(e.type==='checkbox'||e.type==='radio')?e.checked!==e.defaultChecked:e.tagName==='SELECT'?[...e.options].some(o=>o.selected!==o.defaultSelected):e.value!==e.defaultValue);}
function newCase(){
  const dirty=isDirty(), snap=dirty?snapshot():null;
  resetAll(false);
  setView('inputs');
  window.scrollTo(0,0); $('f').scrollTop=0;
  try{$('hx').focus({preventScroll:true});}catch(e){}
  if(dirty) toast('All details cleared — ready for a new case',{label:'Undo',fn:()=>{restore(snap);toast('Previous case restored');}},6000);
  else toast('Ready for a new case');
}
document.querySelectorAll('[data-new]').forEach(b=>b.addEventListener('click',newCase));
document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>loadEx(+b.dataset.ex)));

/* theme */
const root=document.documentElement;
function setTheme(v){
  if(v==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',v);
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-theme-set')===v));
  try{localStorage.setItem('afsuite-theme',v);}catch(e){}if(!setTheme.q)try{if(parent!==window)parent.postMessage({afTheme:v},'*');}catch(e){}
}
document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.getAttribute('data-theme-set'))));
try{const v=localStorage.getItem('afsuite-theme');if(v)setTheme(v);}catch(e){}window.addEventListener('message',e=>{if(e.data&&e.data.afTheme){setTheme.q=1;setTheme(e.data.afTheme);setTheme.q=0;}});

render();
})();

<script id="zcol">
/* ---------- colour-coded blocks: cards by topic, plan sections by their letter colour ---------- */
(function(){
  var KW=[[/bleed|contraind|red flag|danger|active cardiac|safety|storm|side.effect|alarm/i,'red'],
          [/medic|drug|treatment|antihypertens|interact|tablet|override|dosing/i,'amber'],
          [/history|note|picbox|report|case text/i,'teal'],
          [/patient|labs?\b|vital|blood pressure|setting/i,'green'],];
  var CYC=['violet','blue','teal','green'],prev=null;
  function paintCards(){
    var i=0;
    document.querySelectorAll('.card').forEach(function(c){
      var h=c.querySelector(':scope>h2');if(!h||c.dataset.zk)return;
      var tx=h.textContent,k=null;
      for(var j=0;j<KW.length;j++)if(KW[j][0].test(tx)){k=KW[j][1];break;}
      if(!k||(k===prev&&k!=='red'&&k!=='amber')){k=CYC[i++%CYC.length];if(k===prev)k=CYC[i++%CYC.length];}
      prev=k;
      c.style.setProperty('--zk','var(--zc-'+k+')');c.dataset.zk=k;
    });
  }
  function paintSecs(force){
    document.querySelectorAll('.sec').forEach(function(s){
      if(s.dataset.zk&&!force)return;
      var L=s.querySelector(':scope>header .L');if(!L)return;
      var c=getComputedStyle(L).backgroundColor;
      if(!c||c==='transparent'||/rgba\(0, 0, 0, 0\)/.test(c))return;
      s.style.setProperty('--zk',c);s.dataset.zk='1';
    });
  }
  var q=0;function later(f){if(q)return;q=1;requestAnimationFrame(function(){q=0;paintCards();paintSecs(f);});}
  paintCards();paintSecs(false);
  new MutationObserver(function(){later(false);}).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(function(){requestAnimationFrame(function(){paintSecs(true);});}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(){requestAnimationFrame(function(){paintSecs(true);});});
})();
<\/script>
<script id="zfold">
/* ---------- collapsible blocks ---------- */
(function(){
  var SEL='.card,.sec,.simple>div.sm-card,section.panel,div.panel,section.section';
  var KEY='zfold2:'+(document.title||'app'),st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function headOf(b){
    var h=b.querySelector(':scope>h2,:scope>header,:scope>.sm-h,:scope>.panel-head,:scope>.section-head,:scope>h3');
    if(h)return h;
    var x=b.querySelector('h2,h3');if(!x)return null;
    var k=x;while(k.parentElement&&k.parentElement!==b)k=k.parentElement;
    if(k.parentElement!==b)return null;
    return (k===x||k.children.length<=2)?k:null;   /* heading buried in a content wrapper: leave the block alone */
  }
  function name(b,h){var t=h.querySelector('h1,h2,h3,h4')||h;return (t.textContent||'').replace(/\s+/g,' ').trim().replace(/^[0-9]+[a-z]?\s+/i,'').slice(0,48);}
  function setState(b,closed){
    if(closed)b.setAttribute('data-zf','closed');else b.removeAttribute('data-zf');
    var h=b.querySelector('.zf-head');if(h)h.setAttribute('aria-expanded',String(!closed));
  }
  /* everything starts folded except the main block(s) */
  function defOpen(b){
    if(/^(history|consult note|current meds|setting & situation|picbox|dose calculator|new weekly schedule)/i.test(b.dataset.zfn))return true;
    return document.querySelector('[data-zfn]')===b;
  }
  function prep(){
    document.querySelectorAll(SEL).forEach(function(b){
      if(b.tagName==='DETAILS'||b.closest('[role=dialog],dialog,.modal,.zcl-back,.zcl-modal,.sheet,.sheet-doc'))return;
      var h=headOf(b);if(!h)return;
      if(!h.classList.contains('zf-head')){
        h.classList.add('zf-head','zf-keep');h.setAttribute('role','button');h.setAttribute('tabindex','0');
        var p=h.previousElementSibling;while(p){p.classList.add('zf-keep');p=p.previousElementSibling;}
        b.dataset.zfn=name(b,h);
        var s0=st[b.dataset.zfn];setState(b,s0?s0==='c':!defOpen(b));
      }
    });
    paintAll();
  }
  function toggle(b,force){
    var closed=force!=null?force:b.getAttribute('data-zf')!=='closed';
    setState(b,closed);
    st[b.dataset.zfn]=closed?'c':'o';
    save();paintAll();
    if(!closed)setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},30);
  }
  function blocks(){return [].filter.call(document.querySelectorAll(SEL),function(b){return b.dataset.zfn!=null&&b.offsetParent!==null;});}
  var allBtn=null;
  function anyOpen(){return blocks().some(function(b){return b.getAttribute('data-zf')!=='closed';});}
  function paintAll(){if(allBtn)allBtn.textContent=anyOpen()?'Collapse all':'Expand all';}
  function addAll(){
    var host=document.querySelector('.top,header.mast,header.masthead,.masthead');if(!host||allBtn)return;
    allBtn=document.createElement('button');allBtn.type='button';allBtn.className='zf-all btn';
    allBtn.addEventListener('click',function(){var c=anyOpen();blocks().forEach(function(b){toggle(b,c);});});
    var anchor=host.querySelector('.zth,[data-new]');
    if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(allBtn,anchor);else host.appendChild(allBtn);
    paintAll();
  }
  function act(e){
    var h=e.target.closest&&e.target.closest('.zf-head');if(!h)return;
    if(e.target.closest('button,a,input,select,textarea,label,summary')&&e.target.closest('button,a,input,select,textarea,label,summary')!==h)return;
    var b=h.closest('[data-zfn]');if(!b)return;
    if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;if(e.target!==h)return;e.preventDefault();}
    toggle(b);
  }
  document.addEventListener('click',act);document.addEventListener('keydown',act);
  /* Copy / Print read the page text, so unfold everything for a moment */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.classList.contains('zf-all'))return;
    if(!/copy|print|คัดลอก|พิมพ์/i.test((b.textContent||'')+' '+(b.id||'')))return;
    var c=[].slice.call(document.querySelectorAll('[data-zf="closed"]'));if(!c.length)return;
    c.forEach(function(x){x.removeAttribute('data-zf');});
    setTimeout(function(){c.forEach(function(x){if(x.isConnected)x.setAttribute('data-zf','closed');});},1200);
  },true);
  window.addEventListener('beforeprint',function(){});
  var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;prep();},0);}
  function start(){prep();addAll();new MutationObserver(later).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:null;};
const rad=n=>{const e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:null;};
const setRad=(n,v)=>{const e=document.querySelector('input[name="'+n+'"][value="'+v+'"]');if(e)e.checked=true;};
const r1=x=>Math.round(x*10)/10;
const fmt=x=>String(+(+x).toFixed(2));
const SRC=(...n)=>n.map(x=>`<span class="srcl">${x}</span>`).join('');
const li=(t,sub,mod)=>`<li class="${mod||''}"><span class="cls dot">${mod==='flag'?'!':'•'}</span><div class="tx">${t}${sub?`<small>${sub}</small>`:''}</div></li>`;
const ul=a=>a.length?`<ul class="it">${a.join('')}</ul>`:'';
const h4=t=>`<h4>${t}</h4>`;
const sec=(k,L,title,desc,body)=>`<section class="sec ${k}"><header><div class="L">${L}</div><div><h3>${title}</h3><p>${desc}</p></div></header><div class="bd">${body}</div></section>`;

/* ---------- drug table (typical adult doses, mg/day) ---------- */
const AG={
 enalapril:{c:'acei',n:'Enalapril',s:5,t:20,m:40,f:'once or twice daily',r:'eGFR < 30: start 2.5 mg'},
 lisinopril:{c:'acei',n:'Lisinopril',s:10,t:20,m:40,f:'once daily',r:'eGFR < 30: start 5 mg'},
 perindopril:{c:'acei',n:'Perindopril arginine',s:5,t:10,m:10,f:'once daily',r:'eGFR 30–60: 2.5–5 mg'},
 ramipril:{c:'acei',n:'Ramipril',s:2.5,t:10,m:10,f:'once daily',r:'eGFR < 30: max 5 mg'},
 losartan:{c:'arb',n:'Losartan',s:50,t:100,m:100,f:'once daily',r:'Mildly uricosuric'},
 valsartan:{c:'arb',n:'Valsartan',s:80,t:160,m:320,f:'once daily',r:''},
 telmisartan:{c:'arb',n:'Telmisartan',s:40,t:80,m:80,f:'once daily',r:'Hepatic clearance'},
 irbesartan:{c:'arb',n:'Irbesartan',s:150,t:300,m:300,f:'once daily',r:''},
 candesartan:{c:'arb',n:'Candesartan',s:8,t:16,m:32,f:'once daily',r:''},
 olmesartan:{c:'arb',n:'Olmesartan',s:20,t:40,m:40,f:'once daily',r:'Rare sprue-like enteropathy'},
 amlodipine:{c:'ccb',n:'Amlodipine',s:5,t:10,m:10,f:'once daily',r:'Start 2.5 mg if frail / elderly'},
 nifedipine:{c:'ccb',n:'Nifedipine ER/GITS',s:30,t:60,m:90,f:'once daily',r:'Never short-acting capsules'},
 felodipine:{c:'ccb',n:'Felodipine ER',s:5,t:10,m:10,f:'once daily',r:''},
 lercanidipine:{c:'ccb',n:'Lercanidipine',s:10,t:20,m:20,f:'once daily',r:'Less ankle oedema'},
 manidipine:{c:'ccb',n:'Manidipine',s:10,t:20,m:20,f:'once daily',r:''},
 hctz:{c:'thz',n:'Hydrochlorothiazide',s:12.5,t:25,m:25,f:'once daily',r:'Weak at eGFR < 30'},
 chlorthalidone:{c:'thz',n:'Chlorthalidone',s:12.5,t:25,m:25,f:'once daily',r:'Effective at eGFR 15–30 (CLICK)'},
 indapamide:{c:'thz',n:'Indapamide SR',s:1.5,t:1.5,m:1.5,f:'once daily',r:''},
 spironolactone:{c:'mra',n:'Spironolactone',s:12.5,t:25,m:50,f:'once daily',r:'Avoid if K > 5.0 or eGFR < 30'},
 eplerenone:{c:'mra',n:'Eplerenone',s:25,t:50,m:100,f:'once or twice daily',r:'Less gynaecomastia'},
 bisoprolol:{c:'bb',n:'Bisoprolol',s:2.5,t:5,m:10,f:'once daily',r:'Cardioselective'},
 metoprolol:{c:'bb',n:'Metoprolol succinate',s:50,t:100,m:200,f:'once daily',r:''},
 carvedilol:{c:'bb',n:'Carvedilol',s:12.5,t:50,m:50,f:'per day, in 2 doses',r:'Non-selective + alpha'},
 nebivolol:{c:'bb',n:'Nebivolol',s:5,t:5,m:10,f:'once daily',r:''},
 atenolol:{c:'bb',n:'Atenolol',s:25,t:50,m:100,f:'once daily',r:'eGFR < 35: max 50 mg'},
 propranolol:{c:'bb',n:'Propranolol',s:80,t:160,m:320,f:'per day, divided',r:'Non-selective — avoid in asthma'},
 doxazosin:{c:'alpha',n:'Doxazosin',s:1,t:4,m:16,f:'once daily (XL 4–8 mg)',r:'First-dose postural drop'}
};
const CLS=[{id:'acei',l:'ACE inhibitor'},{id:'arb',l:'ARB'},{id:'ccb',l:'DHP CCB'},{id:'thz',l:'Thiazide / -like'},{id:'mra',l:'MRA'},{id:'bb',l:'Beta-blocker'},{id:'alpha',l:'Alpha-blocker'}];
$('medrows').innerHTML=CLS.map(c=>`<div class="medrow"><span>${c.l}</span><select id="m_${c.id}" aria-label="${c.l}"><option value="">—</option>${Object.keys(AG).filter(k=>AG[k].c===c.id).map(k=>`<option value="${k}">${AG[k].n}</option>`).join('')}</select><input id="d_${c.id}" type="number" min="0" step="0.5" inputmode="decimal" placeholder="mg/day" aria-label="${c.l} dose, mg per day"><span class="lv" id="v_${c.id}">—</span></div>`).join('');

const CK=['eMal','eEnc','eIs','eIch','eAcs','ePe','eAd','eAki','eEcl','eCat','dm','cad','angina','hfref','hfpef','af','stroke','pad','lvh','fh','gout','asthma','bph','frail','ortho','lle','preg','planPreg','angio','bras','oNdhp','oLoop','oCentral','oHydral','oAmil','oArni','oSglt','adh','edema','cough','iNsaid','iDecon','iOcp','iSteroid','iCni','iVegf','iStim','iSnri','iEpo','iLic','iEtoh','iSalt','sAbrupt','sHypoK','sInc','sOsa','sPheo','sCush','sBruit','sFlash','sCrRise','sKidAsym','sUrine','sCoarc','sCa','sThy','sAcro','sFam'];

function lvl(ag,dose){
  if(!ag) return null;
  const a=AG[ag];
  if(dose==null) return {k:'low',t:'dose?'};
  if(dose<a.t) return {k:'low',t:'low'};
  if(dose<a.m) return {k:'full',t:'full'};
  return {k:'max',t:'max'};
}
function egfr(cr,age,sex){
  if(cr==null||age==null) return null;
  const F=sex==='F',k=F?0.7:0.9,a=F?-0.241:-0.302;
  return 142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(0.9938,age)*(F?1.012:1);
}

/* ---------- state ---------- */
function collect(){
  const s={};
  CK.forEach(k=>s[k]=$(k).checked);
  ['sbp','dbp','hsbp','hdbp','hr','age','onset','wt','ht','k','acr','risk'].forEach(k=>s[k]=num(k));
  s.fw=rad('fw');s.sex=rad('sex');s.acute=rad('acute')==='yes';
  s.crMg=num('cr')==null?null:($('crUnit').value==='umol'?num('cr')/88.4:num('cr'));
  s.egfr=egfr(s.crMg,s.age,s.sex);
  s.bmi=(s.wt&&s.ht)?s.wt/Math.pow(s.ht/100,2):null;
  s.alb=s.acr!=null&&s.acr>=30;
  s.ckd=(s.egfr!=null&&s.egfr<60)||s.alb;
  s.cvd=s.cad||s.angina||s.hfref||s.hfpef||s.stroke||s.pad;
  s.meds={};
  CLS.forEach(c=>{const ag=$('m_'+c.id).value||null;const d=num('d_'+c.id);s.meds[c.id]={ag,dose:d,lv:lvl(ag,d)};});
  const M=s.meds;
  s.hasA=!!(M.acei.ag||M.arb.ag);s.hasC=!!M.ccb.ag;s.hasD=!!M.thz.ag;s.hasM=!!M.mra.ag;s.hasB=!!M.bb.ag;s.hasAl=!!M.alpha.ag;
  s.nCore=(s.hasA?1:0)+(s.hasC?1:0)+(s.hasD?1:0);
  s.treated=s.nCore>0||s.hasM||s.hasB||s.hasAl||s.oNdhp||s.oLoop||s.oCentral||s.oHydral||s.oAmil||s.oArni;
  s.emerg=s.acute&&(s.eMal||s.eEnc||s.eIs||s.eIch||s.eAcs||s.ePe||s.eAd||s.eAki||s.eEcl||s.eCat);
  s.lenient=(s.age!=null&&s.age>=85)||s.frail||s.ortho||s.lle;
  s.youngOnset=(s.onset!=null?s.onset:(s.treated?null:s.age));
  s.hypoK=s.sHypoK||(s.k!=null&&s.k<3.5);
  s.highRisk=s.cvd||s.dm||s.ckd||s.fh||s.lvh||(s.risk!=null&&s.risk>=10);
  s.ahaHigh=s.cvd||s.dm||s.ckd||(s.risk!=null&&s.risk>=7.5);
  s.noRas=s.preg||s.planPreg||s.bras||(s.k!=null&&s.k>5.5);
  return s;
}

/* ---------- classification ---------- */
function catESC(sb,db){if(sb==null&&db==null)return null;sb=sb||0;db=db||0;
  if(sb>=140||db>=90)return {k:'htn',l:'Hypertension'};if(sb>=120||db>=70)return {k:'elev',l:'Elevated BP'};return {k:'non',l:'Non-elevated BP'};}
function catAHA(sb,db){if(sb==null&&db==null)return null;sb=sb||0;db=db||0;
  if(sb>=180||db>=120)return {k:'sev',l:'Severe (≥ 180/120)'};if(sb>=140||db>=90)return {k:'s2',l:'Stage 2 hypertension'};if(sb>=130||db>=80)return {k:'s1',l:'Stage 1 hypertension'};if(sb>=120)return {k:'elev',l:'Elevated BP'};return {k:'norm',l:'Normal BP'};}
function phenotype(s){
  if(s.sbp==null||s.hsbp==null) return null;
  const oh=s.sbp>=140||(s.dbp||0)>=90, hh=s.hsbp>=135||(s.hdbp||0)>=85;
  if(oh&&hh) return {k:'sus',l:s.treated?'Uncontrolled at home and in clinic':'Sustained hypertension'};
  if(oh&&!hh) return {k:'wc',l:s.treated?'White-coat effect (home controlled)':'White-coat hypertension'};
  if(!oh&&hh) return {k:'mask',l:s.treated?'Masked uncontrolled hypertension':'Masked hypertension'};
  return {k:'ok',l:'Normal at home and in clinic'};
}
function target(s){
  if(s.preg) return {sb:139,db:89,txt:'< 140/90',src:SRC('CHAP 2022','ESC 2024'),note:'Pregnancy: treat at ≥ 140/90 and aim below it.'};
  if(s.lenient) return {sb:139,db:89,txt:'< 140/90, or as low as reasonably achievable',src:s.fw==='esc'?SRC('ESC 2024'):SRC('AHA/ACC 2025'),note:'Age ≥ 85, frailty, symptomatic orthostatic hypotension or limited life expectancy — individualise.'};
  if(s.fw==='esc') return {sb:129,db:79,lo:120,txt:'SBP 120–129, DBP < 80 if tolerated',src:SRC('ESC 2024'),note:'If not tolerated: as low as reasonably achievable (ALARA).'};
  return {sb:129,db:79,txt:'< 130/80, SBP < 120 encouraged',src:SRC('AHA/ACC 2025'),note:''};
}

/* ---------- drug helpers ---------- */
const nextDose=(ag,d)=>{const a=AG[ag];if(d==null||d<a.t)return a.t;return a.m;};
const upTxt=(cls,s)=>{const m=s.meds[cls];const a=AG[m.ag];const nd=nextDose(m.ag,m.dose);return `<b>${a.n}</b> ${m.dose!=null?fmt(m.dose)+' → ':''}${fmt(nd)} mg ${a.f}`;};
function pickA(s){
  if(s.gout&&!s.angio) return '<b>losartan 50 mg</b> (ARB; mildly lowers urate)';
  if(s.angio||s.cough) return '<b>an ARB</b> — e.g. losartan 50 mg or telmisartan 40 mg (avoid ACE inhibitors)';
  return '<b>an ACE inhibitor or ARB</b> — e.g. perindopril 5 mg or losartan 50 mg';
}
const pickC=s=>`<b>amlodipine ${(s.age!=null&&s.age>=75)||s.frail||(s.wt!=null&&s.wt<50)?'2.5':'5'} mg</b>`;
function pickD(s){
  if(s.egfr!=null&&s.egfr<30) return '<b>chlorthalidone 12.5 mg</b> (effective at eGFR 15–30) — or a loop diuretic if fluid overloaded';
  return '<b>indapamide SR 1.5 mg or chlorthalidone 12.5 mg</b> (HCTZ 12.5–25 mg acceptable)';
}
const isFull=lv=>lv&&(lv.k==='full'||lv.k==='max');

/* ---------- treatment engine ---------- */
function plan(s,T){
  const out={verdict:'',step:0,acts:[],adds:[],cautions:[],pre:[]};
  const sb=s.sbp,db=s.dbp,cE=catESC(sb,db),cA=catAHA(sb,db),ph=phenotype(s);
  const atT=sb!=null&&sb<=T.sb&&(db==null||db<=T.db);
  const homeOK=s.hsbp!=null&&s.hsbp<130&&(s.hdbp==null||s.hdbp<80);
  const M=s.meds;
  // ladder position
  const coreFull=['acei','arb','ccb','thz'].filter(k=>M[k].ag).every(k=>isFull(M[k].lv));
  if(!s.treated) out.step=0;
  else if(s.hasM&&s.nCore>=3) out.step=4;
  else if(s.nCore>=3) out.step=coreFull?3:2;
  else out.step=1;

  if(sb==null){out.verdict='Enter office blood pressure to build the plan.';return out;}

  // pregnancy: separate path
  if(s.preg||s.planPreg){
    if(s.hasA||s.hasM||s.oArni) out.cautions.push(li(`<b>Stop ACE inhibitor / ARB / ARNI / MRA</b> — fetotoxic; switch ${s.preg?'now':'before conception'}`,'',''));
    out.acts.push(li('<b>Nifedipine ER</b> 30 mg once daily → up to 120 mg/day '+SRC('ESC 2024')));
    out.acts.push(li('<b>Labetalol</b> 100 mg twice daily → up to 2400 mg/day in 2–4 doses (avoid in asthma)'));
    out.acts.push(li('<b>Methyldopa</b> 250 mg twice–three times daily → up to 3 g/day'));
    out.verdict=s.preg?`Pregnancy: treat to below 140/90 with pregnancy-safe drugs ${SRC('CHAP 2022')}`:'Planning pregnancy: move to pregnancy-safe drugs before conception';
    if(s.preg) out.adds.push(li('Low-dose aspirin from 12 weeks if pre-eclampsia risk (chronic hypertension qualifies); home BP; urine protein each visit'));
    return out;
  }

  // untreated: is treatment indicated?
  const decSb=(ph&&ph.k==='wc')?s.hsbp:sb, decDb=(ph&&ph.k==='wc')?s.hdbp:db;
  if(!s.treated){
    if(ph&&ph.k==='wc'){out.verdict='White-coat hypertension — no drugs on clinic readings alone; lifestyle and out-of-office monitoring';out.acts.push(li('Repeat home BP or ABPM yearly; consider drugs if high CV risk or organ damage '+SRC('ESC 2024')));return out;}
    const htn=(ph&&ph.k==='mask')||sb>=140||(db||0)>=90;
    const stage1=!htn&&(sb>=130||(db||0)>=80);
    let start=false,mono=false;
    if(htn){start=true;mono=s.lenient;}
    else if(stage1){
      if(s.fw==='esc'){
        out.verdict=s.highRisk?'Elevated BP with high CV risk — 3 months of lifestyle change, then drug treatment if still ≥ 130/80':'Elevated BP — lifestyle; recheck yearly';
        if(s.highRisk){out.acts.push(li(`If ≥ 130/80 after 3 months: start <b>one drug at low dose</b> or a low-dose 2-drug combination ${SRC('ESC 2024')}`));}
        if(s.risk==null&&!s.highRisk) out.acts.push(li('Estimate 10-year CVD risk (SCORE2 / SCORE2-OP); ≥ 10% counts as high risk '+SRC('ESC 2024')));
        return out;
      } else {
        if(s.ahaHigh){start=true;mono=true;}
        else{out.verdict='Stage 1 — lifestyle for 3–6 months; start a drug if still ≥ 130/80';out.acts.push(li('Estimate 10-year risk with PREVENT; ≥ 7.5% → start drug now '+SRC('AHA/ACC 2025')));return out;}
      }
    } else {
      out.verdict=sb>=120?'Elevated BP — lifestyle measures; recheck in 3–6 months':'BP not elevated — no treatment needed';
      return out;
    }
    if(start){
      if(s.hfref){out.verdict='Start heart-failure therapy — it lowers BP too';out.acts.push(...hfrefActs(s));return out;}
      if(mono){
        out.verdict=s.lenient?'Start one drug at low dose and titrate slowly':'Start one drug';
        out.acts.push(li(`Start ${pickC(s)} <i>or</i> ${s.noRas?'(RAS blockers unsuitable here)':pickA(s).replace(/<b>|<\/b>/g,'')} ${SRC(s.fw==='esc'?'ESC 2024':'AHA/ACC 2025')}`,s.lenient?'Check standing BP at each visit; escalate only if tolerated':''));
      } else {
        out.verdict='Start a low-dose 2-drug combination, ideally one pill';
        const second=s.noRas?null:(s.hfpef||s.edema?'D':'C');
        if(s.noRas) out.acts.push(li(`Start ${pickC(s)} + ${pickD(s)} — RAS blockers unsuitable (${s.bras?'bilateral renal artery stenosis':'K⁺ > 5.5'})`));
        else out.acts.push(li(`Start ${pickA(s)} <b>+</b> ${second==='C'?pickC(s):pickD(s)} ${SRC('ESC 2024','AHA/ACC 2025')}`,'As a single-pill combination where available (e.g. amlodipine/valsartan 5/80, amlodipine/telmisartan 5/40, perindopril/amlodipine 5/5, losartan/HCTZ 50/12.5)'));
      }
      return out;
    }
  }

  // treated
  if(atT){
    out.verdict='At target — continue the current regimen';
    if(T.lo&&sb<T.lo) out.acts.push(li(`SBP below ${T.lo}: no need to reduce if well tolerated; de-escalate if dizziness, falls or orthostatic symptoms`));
    return out;
  }
  if(ph&&ph.k==='wc'&&homeOK){out.verdict='Above target in clinic, controlled at home — confirm with ABPM before adding drugs';out.acts.push(li('White-coat effect: base titration on home or ambulatory readings '+SRC('ESC 2024')));return out;}

  // pre-escalation checks
  out.pre.push(li('Confirm with home BP or ABPM; check cuff size and technique'));
  if(s.adh) out.pre.push(li('<b>Adherence concern</b> — single-pill combination, once-daily dosing, pill count / pharmacy refill check','','flag'));
  const intf=[s.iNsaid&&'NSAIDs',s.iDecon&&'decongestants',s.iOcp&&'oestrogen contraceptive',s.iSteroid&&'corticosteroid',s.iCni&&'ciclosporin/tacrolimus',s.iVegf&&'VEGF inhibitor',s.iStim&&'stimulants',s.iSnri&&'SNRI',s.iEpo&&'erythropoietin',s.iLic&&'liquorice',s.iEtoh&&'alcohol excess',s.iSalt&&'high salt'].filter(Boolean);
  if(intf.length) out.pre.push(li(`Remove or reduce BP-raising factors: <b>${intf.join(', ')}</b>`,'','flag'));

  if(s.hfref){out.verdict='HF with EF ≤ 40%: titrate heart-failure therapy first';out.acts.push(...hfrefActs(s));return out;}

  const lows=['acei','arb','ccb','thz'].filter(k=>M[k].ag&&!isFull(M[k].lv));
  const missing=[];if(!s.hasA&&!s.noRas)missing.push('A');if(!s.hasC)missing.push('C');if(!s.hasD)missing.push('D');
  const addTxt=x=>x==='A'?pickA(s):x==='C'?pickC(s):pickD(s);
  if(s.nCore===0){
    out.verdict='Current drugs are not first-line — build on a RAS blocker + CCB / thiazide';
    out.acts.push(li(`Add ${s.noRas?pickC(s)+' + '+pickD(s):pickA(s)+' + '+pickC(s)} as the core; keep ${s.hasB?'the beta-blocker only if it has its own indication':'other agents only if indicated'} ${SRC('ESC 2024')}`));
  } else if(s.nCore===1){
    out.verdict='Step 1 → add a second first-line drug (combination beats up-titrating one drug)';
    const pref=s.hasA?(s.hfpef||s.edema?'D':'C'):s.hasC?(s.noRas?'D':'A'):(s.noRas?'C':'A');
    out.acts.push(li(`Add ${addTxt(pref)} ${SRC('ESC 2024','AHA/ACC 2025')}`,'Switch to a single-pill combination when doses settle'));
  } else if(s.nCore===2){
    out.verdict='Step 2 → three-drug combination: RAS blocker + CCB + thiazide-like';
    if(missing.length) out.acts.push(li(`Add ${addTxt(missing[0])} ${SRC('ESC 2024')}`,lows.length?'Alternative: take the current two to full dose first — '+lows.map(k=>AG[M[k].ag].n).join(', '):'Ideally as a three-drug single pill'));
    else out.acts.push(li('RAS blocker unsuitable — add a fourth-line agent (see resistant step)'));
  } else if(s.nCore>=3&&lows.length){
    out.verdict='Step 3 → up-titrate the three drugs to full dose';
    lows.forEach(k=>out.acts.push(li('Increase '+upTxt(k,s))));
  } else if(!s.hasM){
    out.verdict='Resistant hypertension (3 drugs at full dose) → confirm, screen for secondary causes, add spironolactone';
    out.acts.push(...resistantActs(s));
  } else {
    out.verdict='Uncontrolled on 4 drugs including an MRA — fifth-line options and specialist referral';
    if(!isFull(M.mra.lv)) out.acts.push(li('Increase '+upTxt('mra',s)+' if K⁺ ≤ 5.0'));
    out.acts.push(li(`Add <b>bisoprolol</b> 5 → 10 mg ${s.hasB?'(already on a beta-blocker — up-titrate it)':''}, then <b>doxazosin</b> 1 → 4–8 mg, then clonidine or hydralazine ${SRC('ESC 2024')}`));
    out.acts.push(li('Renal denervation at an experienced centre if eGFR > 40 '+SRC('ESC 2024','AHA/ACC 2025')));
    out.acts.push(li('Refer to a hypertension specialist'));
  }
  return out;
}
function hfrefActs(s){
  const a=[];
  a.push(li(`<b>Sacubitril/valsartan</b> 24/26 → 97/103 mg twice daily (or ACE inhibitor / ARB at target dose) ${SRC('ESC HF')}`));
  a.push(li('<b>Evidence-based beta-blocker</b> — bisoprolol 1.25 → 10 mg, carvedilol 3.125 → 25 mg twice daily, or metoprolol succinate 12.5 → 200 mg'));
  a.push(li(`<b>MRA</b> — spironolactone 12.5–25 → 50 mg if K⁺ ≤ 5.0 and eGFR ≥ 30`));
  a.push(li('<b>SGLT2 inhibitor</b> — dapagliflozin or empagliflozin 10 mg'));
  a.push(li('BP still high on all four: add amlodipine or hydralazine/nitrate. Avoid diltiazem, verapamil and moxonidine; use doxazosin only as a last resort'));
  return a;
}
function resistantActs(s){
  const a=[];
  a.push(li('Confirm true resistance: ABPM or home BP, adherence check (pill count, drug levels where available), interfering drugs and salt intake '+SRC('ESC 2024')));
  a.push(li('Screen for secondary causes — especially primary aldosteronism, sleep apnoea, CKD and renal artery stenosis (see below)'));
  const e=s.egfr,k=s.k;
  if((e==null||e>=45)&&(k==null||k<=4.5)) a.push(li(`Add <b>spironolactone 12.5–25 mg</b> once daily → 50 mg ${SRC('PATHWAY-2','ESC 2024')}`,`Check K⁺ and creatinine at 1–2 weeks${k==null?' · K⁺ not entered':''}${e==null?' · eGFR not available':''}`));
  else if((e==null||e>=30)&&(k==null||k<=5.0)) a.push(li(`<b>Spironolactone 12.5 mg</b> possible with close K⁺ monitoring (eGFR ${e!=null?Math.round(e):'?'}, K⁺ ${k??'?'}) ${SRC('ESC 2024')}`,'Recheck K⁺ within 1 week; stop if > 5.5','flag'));
  else a.push(li(`Avoid MRA (eGFR ${e!=null?Math.round(e):'?'}, K⁺ ${k??'?'}) — use <b>bisoprolol</b> 5–10 mg or <b>doxazosin</b> 4–8 mg; switch thiazide to a loop diuretic if eGFR < 30`,'','flag'));
  a.push(li('If spironolactone not tolerated: eplerenone 50–100 mg, amiloride 10–20 mg, then beta-blocker, alpha-blocker or centrally acting drug'));
  a.push(li('Renal denervation can be considered at experienced centres when drugs fail '+SRC('ESC 2024','AHA/ACC 2025')));
  return a;
}
function compelling(s){
  const a=[];
  if(s.dm||s.ckd){
    if(s.alb) a.push(li(`Albuminuria: RAS blocker at the <b>maximum tolerated dose</b>; accept an eGFR fall ≤ 30% ${SRC('KDIGO 2024')}`));
    const sgltCkd=(s.dm&&s.ckd)||(s.acr!=null&&s.acr>=200)||(s.egfr!=null&&s.egfr>=20&&s.egfr<45);
    if(!s.oSglt&&sgltCkd&&(s.egfr==null||s.egfr>=20)) a.push(li(`<b>SGLT2 inhibitor</b> (dapagliflozin / empagliflozin 10 mg) for kidney and heart protection ${SRC('KDIGO 2024')}`,'CKD with diabetes, UACR ≥ 200 mg/g, or eGFR 20–45; continue until dialysis'));
    if(s.dm&&s.alb&&(s.egfr==null||s.egfr>=25)&&(s.k==null||s.k<=5.0)) a.push(li(`Type 2 diabetes + albuminuria: add <b>finerenone</b> 10 → 20 mg if K⁺ ≤ 5.0 on a RAS blocker ${SRC('KDIGO 2024','FIDELIO/FIGARO')}`));
  }
  if(s.cad||s.angina) a.push(li(`CAD / angina: beta-blocker (bisoprolol 2.5–10 mg) and/or CCB for symptoms ${SRC('ESC 2024')}`));
  if(s.af) a.push(li('AF: beta-blocker for rate (diltiazem/verapamil only if EF > 40%); anticoagulation by CHA₂DS₂-VA — see the AF-CARE tab'));
  if(s.hfpef) a.push(li('HF with EF > 40%: SGLT2 inhibitor; diuretic for congestion; consider MRA'));
  if(s.stroke) a.push(li(`Prior stroke / TIA: RAS blocker + thiazide-like or CCB; aim < 130/80 ${SRC('ESC 2024')}`));
  if(s.lvh) a.push(li('LVH: RAS blocker + CCB or thiazide regresses LV mass'));
  if(s.gout) a.push(li('Gout: prefer losartan and CCB; avoid thiazide and loop diuretics where possible (raise urate)'));
  if(s.asthma) a.push(li('Asthma: avoid non-selective beta-blockers (propranolol, carvedilol)','','flag'));
  if(s.bph) a.push(li('BPH: doxazosin is a reasonable add-on (watch postural hypotension)'));
  if(s.bras) a.push(li('Bilateral renal artery stenosis: avoid RAS blockers; CCB-based regimen; discuss revascularisation criteria','','flag'));
  if(s.angio) a.push(li('Angioedema history: no ACE inhibitor or sacubitril/valsartan; ARB with caution','','flag'));
  if(s.sex==='F'&&s.age!=null&&s.age>=15&&s.age<=49&&(s.hasA||s.hasM)&&!s.preg&&!s.planPreg) a.push(li('Woman of child-bearing age on RAS blocker / MRA: discuss contraception and switch before pregnancy'));
  return a;
}
function cautions(s){
  const a=[];const M=s.meds;
  if(M.acei.ag&&M.arb.ag) a.push(li('<b>ACE inhibitor + ARB together</b> — not recommended (hyperkalaemia, AKI); stop one '+SRC('ESC 2024'),'','flag'));
  if(s.oArni&&M.acei.ag) a.push(li('<b>Sacubitril/valsartan with an ACE inhibitor</b> — contraindicated (36-h washout)','','flag'));
  if(s.k!=null&&s.k>5.5) a.push(li(`K⁺ ${s.k}: reduce/hold RAS blocker or MRA, review diet and drugs, consider a potassium binder`,'','flag'));
  else if(s.k!=null&&s.k>5.0&&(s.hasA||s.hasM)) a.push(li(`K⁺ ${s.k}: do not start or increase an MRA; recheck in 1 week`,'','flag'));
  if(s.k!=null&&s.k<3.5) a.push(li(`K⁺ ${s.k}: replace potassium; ${s.hasD?'thiazide-related or ':''}consider primary aldosteronism`,'','flag'));
  if(s.egfr!=null&&s.egfr<30&&M.thz.ag&&M.thz.ag!=='chlorthalidone') a.push(li(`${AG[M.thz.ag].n} is weak at eGFR < 30 — switch to chlorthalidone or a loop diuretic`,'','flag'));
  if(s.hfref&&s.oNdhp) a.push(li('Diltiazem / verapamil with EF ≤ 40% — avoid (negative inotropes)','','flag'));
  if(s.hasB&&s.oNdhp) a.push(li('Beta-blocker + diltiazem/verapamil — bradycardia and heart block risk','','flag'));
  if(s.edema&&s.hasC) a.push(li('CCB ankle oedema: adding or up-titrating the RAS blocker reduces it; or switch to lercanidipine / lower the dose'));
  if(s.cough&&M.acei.ag) a.push(li('ACE-inhibitor cough: switch to an ARB at equivalent dose'));
  if(s.asthma&&M.bb.ag&&['carvedilol','propranolol'].includes(M.bb.ag)) a.push(li(`${AG[M.bb.ag].n} in asthma — switch to a cardioselective agent or another class`,'','flag'));
  if(s.treated&&(s.ortho||(s.sbp!=null&&s.sbp<110))) a.push(li('Low or orthostatic BP on treatment — consider reducing the least essential drug','','flag'));
  return a;
}

/* ---------- secondary causes ---------- */
function secondary(s){
  const ph=phenotype(s);
  const confirmed=(s.sbp!=null&&(s.sbp>=140||(s.dbp||0)>=90))||s.treated||(ph&&ph.k==='mask');
  const resistant=s.nCore>=3&&s.sbp!=null&&s.sbp>=140;
  const young=s.youngOnset!=null&&s.youngOnset<40;
  const severe=(s.sbp||0)>=180||(s.dbp||0)>=110;
  const C=[];
  const add=(name,why,tests,pri,src)=>C.push({name,why,tests,pri,src});
  // primary aldosteronism
  const paWhy=[resistant&&'resistant',s.hypoK&&'hypokalaemia',s.sInc&&'adrenal incidentaloma',s.af&&'AF',s.sOsa&&'sleep apnoea',young&&'onset < 40',s.sFam&&'family history',severe&&'BP ≥ 180/110'].filter(Boolean);
  if(confirmed) add('Primary aldosteronism',paWhy.length?paWhy.join(', '):'all patients with confirmed hypertension',
    ['Morning aldosterone–renin ratio (seated), after correcting K⁺; can be done on most current drugs — MRAs and amiloride raise renin (false negative), beta-blockers lower it (false positive)','Positive: confirmatory test (saline infusion, oral salt loading or captopril challenge) → adrenal CT → adrenal vein sampling if surgery is an option'],
    paWhy.length?'high':'routine',SRC('Endocrine Society 2025','ESC 2024'));
  const rvWhy=[young&&s.youngOnset<30&&'onset < 30 (fibromuscular dysplasia)',s.sAbrupt&&'abrupt onset/worsening',s.sFlash&&'flash pulmonary oedema',s.sCrRise&&'creatinine rise > 30% on RAS blocker',s.sKidAsym&&'kidney asymmetry',s.sBruit&&'abdominal bruit',resistant&&(s.cad||s.pad)&&'resistant with atherosclerosis'].filter(Boolean);
  if(rvWhy.length) add('Renovascular hypertension',rvWhy.join(', '),['Renal artery duplex ultrasound','CT or MR angiography (eGFR permitting); young women with suspected FMD — imaging from head to pelvis'],'high',SRC('ESC 2024'));
  const rpWhy=[s.egfr!=null&&s.egfr<60&&`eGFR ${Math.round(s.egfr)}`,s.alb&&`UACR ${s.acr}`,s.sUrine&&'abnormal urinalysis'].filter(Boolean);
  if(rpWhy.length) add('Renal parenchymal disease',rpWhy.join(', '),['Urine microscopy, repeat UACR, renal ultrasound; nephrology referral if eGFR falling or haematuria with proteinuria'],'high','');
  const osaWhy=[s.sOsa&&'snoring/apnoeas/sleepiness',s.bmi!=null&&s.bmi>=30&&`BMI ${r1(s.bmi)}`,resistant&&'resistant'].filter(Boolean);
  if(osaWhy.length) add('Obstructive sleep apnoea',osaWhy.join(', '),['STOP-Bang questionnaire → home sleep test or polysomnography; CPAP if moderate–severe'],s.sOsa?'high':'routine','');
  const phWhy=[s.sPheo&&'paroxysmal symptoms',s.sInc&&'adrenal incidentaloma',severe&&s.sAbrupt&&'severe labile BP'].filter(Boolean);
  if(phWhy.length) add('Phaeochromocytoma / paraganglioma',phWhy.join(', '),['Plasma free metanephrines (supine) or 24-h urine fractionated metanephrines','Positive → adrenal/abdominal imaging; never start a beta-blocker before alpha-blockade'],'high','');
  const cuWhy=[s.sCush&&'Cushingoid features',s.sInc&&'adrenal incidentaloma'].filter(Boolean);
  if(cuWhy.length) add('Cushing syndrome',cuWhy.join(', '),['1-mg overnight dexamethasone suppression test, late-night salivary cortisol or 24-h urinary free cortisol (two abnormal tests needed)'],'routine','');
  if(s.sThy) add('Thyroid disease','thyroid symptoms',['TSH (± free T4)'],'routine','');
  if(s.sCa) add('Primary hyperparathyroidism','hypercalcaemia',['Calcium, PTH'],'routine','');
  if(s.sCoarc||(young&&s.youngOnset<30)) add('Coarctation of the aorta',s.sCoarc?'radio-femoral delay / arm–leg gradient':'onset < 30',['Four-limb BP, echocardiography; CT or MR angiography if suspected'],s.sCoarc?'high':'routine','');
  if(s.sAcro) add('Acromegaly','acromegalic features',['IGF-1'],'routine','');
  const drugs=[s.iNsaid&&'NSAIDs',s.iDecon&&'decongestants',s.iOcp&&'oestrogen contraceptive',s.iSteroid&&'corticosteroids',s.iCni&&'calcineurin inhibitors',s.iVegf&&'VEGF inhibitors',s.iStim&&'stimulants',s.iSnri&&'SNRIs',s.iEpo&&'erythropoietin',s.iLic&&'liquorice',s.iEtoh&&'alcohol'].filter(Boolean);
  if(drugs.length) add('Drug- or substance-induced',drugs.join(', '),['Stop or substitute where possible; recheck BP 2–4 weeks later'],'high','');

/* ---------- acute severe hypertension ---------- */
function acuteCard(s){

      li('Not an emergency: start or intensify <b>oral</b> therapy and lower BP gradually over hours to days '+SRC('ESC 2024')),
      li('Avoid sublingual / short-acting nifedipine and rapid drops (stroke, MI risk)','','flag'),
      li('Rest in a quiet room and recheck; look for pain, anxiety, missed doses and drugs; review within a few days')]));
  }
  const rows=[];
  const R=(cond,target,drugs)=>rows.push(`<tr><td>${cond}</td><td>${target}</td><td>${drugs}</td></tr>`);
  if(s.eAd) R('Aortic dissection','SBP &lt; 120 and HR &lt; 60 within 20 min','Esmolol or labetalol first, then nitroprusside / nicardipine');
  if(s.ePe) R('Acute pulmonary oedema','SBP &lt; 140 immediately','Nitroglycerin or nitroprusside + loop diuretic');
  if(s.eAcs) R('Acute coronary syndrome','SBP &lt; 140 immediately','Nitroglycerin, labetalol');
  if(s.eIs) R('Acute ischaemic stroke','Before thrombolysis &lt; 185/110, then &lt; 180/105 for 24 h; no lysis: treat only if &gt; 220/120 (lower MAP ~15% in 24 h)','Labetalol, nicardipine');
  if(s.eIch) R('Intracerebral haemorrhage','SBP ~140 if presenting 150–220; avoid &lt; 130 '+SRC('AHA/ASA 2022'),'Labetalol, nicardipine');
  if(s.eEcl) R('Severe pre-eclampsia / eclampsia','SBP &lt; 160 and DBP &lt; 105 immediately','Labetalol or nicardipine + magnesium sulphate; plan delivery');
  if(s.eCat) R('Phaeochromocytoma / sympathomimetic','SBP &lt; 140','Phentolamine; benzodiazepines for drugs; no beta-blocker before alpha-blockade');

  const doses=ul([
    li('<b>Labetalol</b> 0.25–0.5 mg/kg (or 20 mg) IV bolus, repeat 20–80 mg every 10 min, or infusion 2–4 mg/min (max 300 mg)'),
    li('<b>Nicardipine</b> 5 mg/h, increase by 2.5 mg/h every 5–15 min to max 15 mg/h'),
    li('<b>Esmolol</b> 0.5–1 mg/kg bolus, then 50–300 µg/kg/min'),
    li('<b>Nitroglycerin</b> 5 µg/min, increase by 5 µg/min every 3–5 min to 200 µg/min'),
    li('<b>Nitroprusside</b> 0.3–10 µg/kg/min (cyanide toxicity with prolonged use)'),
    li('<b>Urapidil</b> 12.5–25 mg bolus, then 5–40 mg/h · <b>Phentolamine</b> 2.5–15 mg bolus')]);

    `<div class="tblwrap"><table class="dose"><thead><tr><th>Situation</th><th>BP target</th><th>Preferred IV drugs</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`+h4('IV doses')+doses);
}

const DRUGRE={enalapril:'enalapril',lisinopril:'lisinopril',perindopril:'perindopril',ramipril:'ramipril',losartan:'losartan',valsartan:'valsartan',telmisartan:'telmisartan',irbesartan:'irbesartan',candesartan:'candesartan',olmesartan:'olmesartan',amlodipine:'amlodipine',nifedipine:'nifedipine',felodipine:'felodipine',lercanidipine:'lercanidipine',manidipine:'manidipine',hctz:'hctz|hydrochlorothiazide',chlorthalidone:'chlorthalidone|chlortalidone',indapamide:'indapamide',spironolactone:'spironolactone',eplerenone:'eplerenone',bisoprolol:'bisoprolol',metoprolol:'metoprolol',carvedilol:'carvedilol',nebivolol:'nebivolol',atenolol:'atenolol',propranolol:'propranolol',doxazosin:'doxazosin'};

function planText(){

<script id="zcol">
/* ---------- colour-coded blocks: cards by topic, plan sections by their letter colour ---------- */
(function(){
  var KW=[[/bleed|contraind|red flag|danger|active cardiac|safety|storm|side.effect|alarm/i,'red'],
          [/medic|drug|treatment|antihypertens|interact|tablet|override|dosing/i,'amber'],
          [/history|note|picbox|report|case text/i,'teal'],
          [/patient|labs?\b|vital|blood pressure|setting/i,'green'],];
  var CYC=['violet','blue','teal','green'],prev=null;
  function paintCards(){
    var i=0;
    document.querySelectorAll('.card').forEach(function(c){
      var h=c.querySelector(':scope>h2');if(!h||c.dataset.zk)return;
      var tx=h.textContent,k=null;
      for(var j=0;j<KW.length;j++)if(KW[j][0].test(tx)){k=KW[j][1];break;}
      if(!k||(k===prev&&k!=='red'&&k!=='amber')){k=CYC[i++%CYC.length];if(k===prev)k=CYC[i++%CYC.length];}

  var q=0;function later(f){if(q)return;q=1;requestAnimationFrame(function(){q=0;paintCards();paintSecs(f);});}
  paintCards();paintSecs(false);
  new MutationObserver(function(){later(false);}).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(function(){requestAnimationFrame(function(){paintSecs(true);});}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(){requestAnimationFrame(function(){paintSecs(true);});});

<script id="zfold">
/* ---------- collapsible blocks ---------- */
(function(){
  var SEL='.card,.sec,.simple>div.sm-card,section.panel,div.panel,section.section';
  var KEY='zfold2:'+(document.title||'app'),st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function headOf(b){
    var h=b.querySelector(':scope>h2,:scope>header,:scope>.sm-h,:scope>.panel-head,:scope>.section-head,:scope>h3');
    if(h)return h;
    var x=b.querySelector('h2,h3');if(!x)return null;
    var k=x;while(k.parentElement&&k.parentElement!==b)k=k.parentElement;
    if(k.parentElement!==b)return null;
    return (k===x||k.children.length<=2)?k:null;   /* heading buried in a content wrapper: leave the block alone */
  }
  function name(b,h){var t=h.querySelector('h1,h2,h3,h4')||h;return (t.textContent||'').replace(/\s+/g,' ').trim().replace(/^[0-9]+[a-z]?\s+/i,'').slice(0,48);}
  function setState(b,closed){
    if(closed)b.setAttribute('data-zf','closed');else b.removeAttribute('data-zf');
    var h=b.querySelector('.zf-head');if(h)h.setAttribute('aria-expanded',String(!closed));
  }
  /* everything starts folded except the main block(s) */
  function defOpen(b){
    if(/^(history|consult note|current meds|setting & situation|picbox|dose calculator|new weekly schedule)/i.test(b.dataset.zfn))return true;
    return document.querySelector('[data-zfn]')===b;
  }
  function prep(){
    document.querySelectorAll(SEL).forEach(function(b){
      if(b.tagName==='DETAILS'||b.closest('[role=dialog],dialog,.modal,.zcl-back,.zcl-modal,.sheet,.sheet-doc'))return;
      var h=headOf(b);if(!h)return;
      if(!h.classList.contains('zf-head')){
        h.classList.add('zf-head','zf-keep');h.setAttribute('role','button');h.setAttribute('tabindex','0');
        var p=h.previousElementSibling;while(p){p.classList.add('zf-keep');p=p.previousElementSibling;}
        b.dataset.zfn=name(b,h);
        var s0=st[b.dataset.zfn];setState(b,s0?s0==='c':!defOpen(b));
      }
    });
    paintAll();
  }
  function toggle(b,force){
    var closed=force!=null?force:b.getAttribute('data-zf')!=='closed';
    setState(b,closed);
    st[b.dataset.zfn]=closed?'c':'o';
    save();paintAll();
    if(!closed)setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},30);
  }
  function blocks(){return [].filter.call(document.querySelectorAll(SEL),function(b){return b.dataset.zfn!=null&&b.offsetParent!==null;});}
  var allBtn=null;
  function anyOpen(){return blocks().some(function(b){return b.getAttribute('data-zf')!=='closed';});}
  function paintAll(){if(allBtn)allBtn.textContent=anyOpen()?'Collapse all':'Expand all';}
  function addAll(){
    var host=document.querySelector('.top,header.mast,header.masthead,.masthead');if(!host||allBtn)return;
    allBtn=document.createElement('button');allBtn.type='button';allBtn.className='zf-all btn';
    allBtn.addEventListener('click',function(){var c=anyOpen();blocks().forEach(function(b){toggle(b,c);});});
    var anchor=host.querySelector('.zth,[data-new]');
    if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(allBtn,anchor);else host.appendChild(allBtn);
    paintAll();
  }
  function act(e){
    var h=e.target.closest&&e.target.closest('.zf-head');if(!h)return;
    if(e.target.closest('button,a,input,select,textarea,label,summary')&&e.target.closest('button,a,input,select,textarea,label,summary')!==h)return;
    var b=h.closest('[data-zfn]');if(!b)return;
    if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;if(e.target!==h)return;e.preventDefault();}
    toggle(b);
  }
  document.addEventListener('click',act);document.addEventListener('keydown',act);
  /* Copy / Print read the page text, so unfold everything for a moment */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b||b.classList.contains('zf-all'))return;
    if(!/copy|print|คัดลอก|พิมพ์/i.test((b.textContent||'')+' '+(b.id||'')))return;
    var c=[].slice.call(document.querySelectorAll('[data-zf="closed"]'));if(!c.length)return;
    c.forEach(function(x){x.removeAttribute('data-zf');});
    setTimeout(function(){c.forEach(function(x){if(x.isConnected)x.setAttribute('data-zf','closed');});},1200);
  },true);
  window.addEventListener('beforeprint',function(){});
  var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;prep();},0);}
  function start(){prep();addAll();new MutationObserver(later).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
